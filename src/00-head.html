<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>割りすぎ瓦割り</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c196;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#2b2b3a;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
.nb{display:inline-block;white-space:nowrap}

/* 絵は画面いっぱい。遊ぶ場所は縦9:16で中央 */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠。単位は cqw（枠の幅の1%）。文字の置き場所に使うだけで、触れるのは下の絵 */
#stage{position:relative;container-type:size;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}
#stage>*{pointer-events:none}

/* 上：残り時間 / 下：連打数 */
#hudTop{position:absolute;left:0;right:0;top:6cqw;text-align:center;font-weight:900;color:#fff;
  -webkit-text-stroke:1.2cqw #7a1f1a;paint-order:stroke fill;text-shadow:0 1cqw 0 #7a1f1a;
  font-size:13cqw;line-height:1;font-variant-numeric:tabular-nums;opacity:0}
#hudTop small{font-size:5cqw;margin-left:1.2cqw;-webkit-text-stroke-width:.8cqw}
#hudTop.on{opacity:1}
#hudTop.low{color:#ffe14d}
#hudBot{position:absolute;left:0;right:0;bottom:7cqw;text-align:center;font-weight:bold;color:#fff;
  font-size:5.6cqw;text-shadow:0 .6cqw 0 #0007,0 0 2cqw #0007;font-variant-numeric:tabular-nums;opacity:0}
#hudBot.on{opacity:1}
#hudBot b{font-size:7cqw}

/* 「はじめ」「せいっ」 */
#call{position:absolute;left:0;right:0;top:34cqw;text-align:center;font-weight:900;font-size:21cqw;color:#fff;
  -webkit-text-stroke:2cqw #7a1f1a;paint-order:stroke fill;text-shadow:0 1.6cqw 0 #7a1f1a;
  opacity:0;transform:scale(.6)}
#call.on{animation:call .5s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes call{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

/* 段階ごとの大きな文字（見せ場）。文字の大きさは setCap で文字数に合わせる */
#cap{position:absolute;left:0;right:0;top:11cqw;text-align:center;font-weight:900;color:#fff;white-space:nowrap;
  -webkit-text-stroke:1.8cqw #7a1f1a;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #7a1f1a;line-height:1.1;opacity:0}
#cap.on{animation:capin .35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes capin{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

/* タイトル（上に題字、下に「はじめる」。真ん中は構えた空手家と積んだ瓦を見せる） */
#title{position:absolute;inset:0;z-index:20}
#title.hide{display:none}
#title .tt{position:absolute;left:5cqw;right:5cqw;top:8cqw;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2.6cqw}
#title .t2{font-size:19cqw;font-weight:900;line-height:1.1;color:#fff;white-space:nowrap;
  -webkit-text-stroke:1.6cqw #5a2a14;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #5a2a14,0 2.2cqw 3cqw #0004}
#title .t2 .t2a{display:block;font-size:10cqw;letter-spacing:.6cqw;line-height:1.2;-webkit-text-stroke-width:1.1cqw}
#title .t3{font-size:5.2cqw;font-weight:bold;color:#5a2a14;background:#fffd;border-radius:3cqw;padding:1cqw 4cqw}
#title .t4{position:absolute;left:0;right:0;bottom:14cqw;text-align:center}
#title .t4 span{display:inline-block;font-size:6.4cqw;font-weight:bold;color:#fff;background:#d2382f;border-radius:6cqw;
  padding:2cqw 9cqw;box-shadow:0 1.2cqw 0 #8f221c;animation:blink 1.1s ease-in-out infinite;letter-spacing:.8cqw}
@keyframes blink{50%{transform:scale(1.07)}}

/* 結果：段位認定証（#stage の外に固定配置。幅と位置は JS が決める。cqw は認定証の幅の 1%） */
#cert{position:fixed;left:0;top:0;width:400px;z-index:30;container-type:inline-size;touch-action:manipulation;
  opacity:0;visibility:hidden;transform:translateY(7%);pointer-events:none;
  transition:opacity .25s,transform .25s,visibility 0s .25s}
#cert.show{opacity:1;visibility:visible;transform:none;pointer-events:auto;
  transition:opacity .3s,transform .5s cubic-bezier(.2,1.25,.4,1),visibility 0s}
#cert .paper{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2cqw;padding:3.8cqw 4.6cqw 4.2cqw;
  background:#fffaf0;border:1.2cqw solid #7a4a22;border-radius:2.4cqw;color:#3a2a1c;text-align:center;overflow:hidden;
  box-shadow:inset 0 0 0 .6cqw #e9c36a,0 1.6cqw 0 #3a1a0a,0 2.6cqw 5cqw #0006}
#cert .ct{font-size:6.4cqw;font-weight:900;letter-spacing:1.4cqw;color:#7a1f1a;line-height:1.1;white-space:nowrap;
  border-bottom:.5cqw solid #c9a15a;padding:0 0 1.4cqw 1.4cqw}
#cert .top{display:flex;align-items:center;justify-content:space-between;gap:2cqw;text-align:left}
#cert .who{font-size:3.4cqw;color:#7a6a58;font-weight:bold;white-space:nowrap}
#cert .rank{font-size:14cqw;font-weight:900;line-height:1.05;color:#c8321f;white-space:nowrap}
#cert .seal{flex:none;width:16cqw;height:16cqw;border:.9cqw solid #c8321f;border-radius:50%;color:#c8321f;
  display:grid;place-items:center;font-size:5.2cqw;font-weight:900;white-space:nowrap;transform:rotate(-14deg);
  background:radial-gradient(#fff4,#fff0)}
#cert .st{display:flex;align-items:baseline;justify-content:center;gap:2cqw;white-space:nowrap}
#cert .st .lbl{font-size:3.4cqw;color:#7a6a58;font-weight:bold}
#cert .st b{font-size:9cqw;font-weight:900;color:#2b2b3a;line-height:1.1}
#cert .vd{font-size:3.5cqw;color:#5a4a3a;line-height:1.5;font-weight:bold}
#cert .facts{font-size:4cqw;font-weight:bold;line-height:1.4;font-variant-numeric:tabular-nums}
#cert .facts>div{white-space:nowrap}
#cert .facts b{font-size:4.6cqw;color:#c8321f}
#cert .upd{display:inline-block;margin-left:1.4cqw;font-size:3cqw;color:#fff;background:#e0902a;border-radius:3cqw;padding:.3cqw 1.8cqw;vertical-align:.3cqw}
#cert .best{font-size:3.4cqw;color:#7a6a58;font-weight:bold;white-space:nowrap}
#cert .seenH{font-size:3cqw;color:#7a6a58;font-weight:bold;text-align:left;margin-bottom:-.6cqw;white-space:nowrap}
#cert .seen{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw}
#cert .chip{font-size:3.1cqw;line-height:1;padding:1.7cqw 0;border-radius:1.2cqw;background:#efe3c8;color:#a8977c;
  white-space:nowrap;overflow:hidden;position:relative}
#cert .chip.on{background:#fff;color:#3a2a1c;font-weight:bold;box-shadow:inset 0 0 0 .35cqw #c9a15a}
#cert .chip.cur{background:#ffe08a;box-shadow:inset 0 0 0 .5cqw #c8321f}
#cert .chip.nw::after{content:"";position:absolute;top:.5cqw;right:.6cqw;width:1.5cqw;height:1.5cqw;border-radius:50%;background:#e0382a}
#cert .btns{display:flex;gap:2.4cqw;margin-top:.6cqw}
#cert button{border:0;font:inherit;font-weight:bold;cursor:pointer;touch-action:manipulation;color:#fff}
#cert #again{flex:1.7;height:12cqw;font-size:5.4cqw;border-radius:3.6cqw;background:linear-gradient(#ff6b5a,#d2382f);
  box-shadow:0 1.1cqw 0 #8f221c;opacity:.4}
#cert.ready #again{opacity:1;animation:blink 1.1s ease-in-out infinite}
#cert #again:active{transform:translateY(.8cqw);box-shadow:0 .3cqw 0 #8f221c}
#cert #share{flex:1;height:12cqw;font-size:3.6cqw;border-radius:3.2cqw;background:transparent;color:#2c4aa0;
  border:.5cqw solid #2c4aa0;box-shadow:0 .5cqw 0 #2c4aa066}
#cert #share:active{transform:translateY(.4cqw)}
/* 破門状 */
#cert.ban .paper{background:#f3eee2;border-color:#26222a;box-shadow:inset 0 0 0 .6cqw #8a8070,0 1.6cqw 0 #111,0 2.6cqw 5cqw #0007}
#cert.ban .ct{color:#26222a;border-bottom-color:#26222a;letter-spacing:2.4cqw}
#cert.ban .rank{color:#26222a}
#cert.ban .seal{border-width:1.2cqw;background:radial-gradient(#fff3,#fff0)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="hudTop"><span id="tLeft">5.0</span><small>秒</small></div>
  <div id="hudBot"><b id="cNum">0</b> 回</div>
  <div id="call"></div>
  <div id="cap"></div>
  <div id="title">
    <div class="tt">
      <div class="t2"><span class="t2a nb">割りすぎ</span><span class="nb">瓦割り</span></div>
      <div class="t3"><span class="nb">5秒で</span> <span class="nb">どこまで</span> <span class="nb">割れる？</span></div>
    </div>
    <div class="t4"><span>はじめる</span></div>
  </div>
</div>
<div id="cert">
  <div class="paper">
    <div class="ct" id="cTitle">段位認定証</div>
    <div class="top">
      <div><div class="who"><span class="nb">挑戦者</span> <span class="nb">殿</span></div><div class="rank" id="cRank"></div></div>
      <div class="seal" id="cSeal">師範</div>
    </div>
    <div class="st"><span class="lbl">審査結果</span><b id="cStage"></b></div>
    <div class="vd" id="cVerdict"></div>
    <div class="facts"><div>割った瓦　<b id="cTiles"></b></div><div>連打　<b id="cCount"></b> 回<span class="upd" id="cNewC">更新</span></div></div>
    <div class="best" id="cBest"></div>
    <div class="seenH" id="cSeenH"></div>
    <div class="seen" id="cSeen"></div>
    <div class="btns"><button id="again" type="button">もう一回</button><button id="share" type="button">Xで共有</button></div>
  </div>
</div>
<script>
