<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>割りすぎ瓦割り</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c196;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#2b2b3a;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
.nb{display:inline-block;white-space:nowrap}

/* 絵は画面いっぱい。遊ぶ場所は縦9:16で中央 */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠。単位は cqw（枠の幅の1%）。文字の置き場所に使うだけで、触れるのは下の絵 */
#stage{position:relative;container-type:size;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}
#stage>*{pointer-events:none}

/* 上：残り時間 / 下：連打数 */
#hudTop{position:absolute;left:0;right:0;top:6cqw;text-align:center;font-weight:900;color:#fff;
  -webkit-text-stroke:1.2cqw #7a1f1a;paint-order:stroke fill;text-shadow:0 1cqw 0 #7a1f1a;
  font-size:13cqw;line-height:1;font-variant-numeric:tabular-nums;opacity:0}
#hudTop small{font-size:5cqw;margin-left:1.2cqw;-webkit-text-stroke-width:.8cqw}
#hudTop.on{opacity:1}
#hudTop.low{color:#ffe14d}
#hudBot{position:absolute;left:0;right:0;bottom:7cqw;text-align:center;font-weight:bold;color:#fff;
  font-size:5.6cqw;text-shadow:0 .6cqw 0 #0007,0 0 2cqw #0007;font-variant-numeric:tabular-nums;opacity:0}
#hudBot.on{opacity:1}
#hudBot b{font-size:7cqw}

/* 「はじめ」「せいっ」 */
#call{position:absolute;left:0;right:0;top:34cqw;text-align:center;font-weight:900;font-size:21cqw;color:#fff;
  -webkit-text-stroke:2cqw #7a1f1a;paint-order:stroke fill;text-shadow:0 1.6cqw 0 #7a1f1a;
  opacity:0;transform:scale(.6)}
#call.on{animation:call .5s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes call{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

/* 段階ごとの大きな文字（見せ場）。文字の大きさは setCap で文字数に合わせる */
#cap{position:absolute;left:0;right:0;top:11cqw;text-align:center;font-weight:900;color:#fff;white-space:nowrap;
  -webkit-text-stroke:1.8cqw #7a1f1a;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #7a1f1a;line-height:1.1;opacity:0}
#cap.on{animation:capin .35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes capin{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

/* タイトル（上に題字、下に「はじめる」。真ん中は構えた空手家と積んだ瓦を見せる） */
#title{position:absolute;inset:0;z-index:20}
#title.hide{display:none}
#title .tt{position:absolute;left:5cqw;right:5cqw;top:8cqw;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2.6cqw}
#title .t2{font-size:19cqw;font-weight:900;line-height:1.1;color:#fff;white-space:nowrap;
  -webkit-text-stroke:1.6cqw #5a2a14;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #5a2a14,0 2.2cqw 3cqw #0004}
#title .t2 .t2a{display:block;font-size:10cqw;letter-spacing:.6cqw;line-height:1.2;-webkit-text-stroke-width:1.1cqw}
#title .t3{font-size:5.2cqw;font-weight:bold;color:#5a2a14;background:#fffd;border-radius:3cqw;padding:1cqw 4cqw}
#title .t4{position:absolute;left:0;right:0;bottom:14cqw;text-align:center}
#title .t4 span{display:inline-block;font-size:6.4cqw;font-weight:bold;color:#fff;background:#d2382f;border-radius:6cqw;
  padding:2cqw 9cqw;box-shadow:0 1.2cqw 0 #8f221c;animation:blink 1.1s ease-in-out infinite;letter-spacing:.8cqw}
@keyframes blink{50%{transform:scale(1.07)}}

/* 結果：段位認定証（#stage の外に固定配置。幅と位置は JS が決める。cqw は認定証の幅の 1%） */
#cert{position:fixed;left:0;top:0;width:400px;z-index:30;container-type:inline-size;touch-action:manipulation;
  opacity:0;visibility:hidden;transform:translateY(7%);pointer-events:none;
  transition:opacity .25s,transform .25s,visibility 0s .25s}
#cert.show{opacity:1;visibility:visible;transform:none;pointer-events:auto;
  transition:opacity .3s,transform .5s cubic-bezier(.2,1.25,.4,1),visibility 0s}
#cert .paper{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2cqw;padding:3.8cqw 4.6cqw 4.2cqw;
  background:#fffaf0;border:1.2cqw solid #7a4a22;border-radius:2.4cqw;color:#3a2a1c;text-align:center;overflow:hidden;
  box-shadow:inset 0 0 0 .6cqw #e9c36a,0 1.6cqw 0 #3a1a0a,0 2.6cqw 5cqw #0006}
#cert .ct{font-size:6.4cqw;font-weight:900;letter-spacing:1.4cqw;color:#7a1f1a;line-height:1.1;white-space:nowrap;
  border-bottom:.5cqw solid #c9a15a;padding:0 0 1.4cqw 1.4cqw}
#cert .top{display:flex;align-items:center;justify-content:space-between;gap:2cqw;text-align:left}
#cert .who{font-size:3.4cqw;color:#7a6a58;font-weight:bold;white-space:nowrap}
#cert .rank{font-size:14cqw;font-weight:900;line-height:1.05;color:#c8321f;white-space:nowrap}
#cert .seal{flex:none;width:16cqw;height:16cqw;border:.9cqw solid #c8321f;border-radius:50%;color:#c8321f;
  display:grid;place-items:center;font-size:5.2cqw;font-weight:900;white-space:nowrap;transform:rotate(-14deg);
  background:radial-gradient(#fff4,#fff0)}
#cert .st{display:flex;align-items:baseline;justify-content:center;gap:2cqw;white-space:nowrap}
#cert .st .lbl{font-size:3.4cqw;color:#7a6a58;font-weight:bold}
#cert .st b{font-size:9cqw;font-weight:900;color:#2b2b3a;line-height:1.1}
#cert .vd{font-size:3.5cqw;color:#5a4a3a;line-height:1.5;font-weight:bold}
#cert .facts{font-size:4cqw;font-weight:bold;line-height:1.4;font-variant-numeric:tabular-nums}
#cert .facts>div{white-space:nowrap}
#cert .facts b{font-size:4.6cqw;color:#c8321f}
#cert .upd{display:inline-block;margin-left:1.4cqw;font-size:3cqw;color:#fff;background:#e0902a;border-radius:3cqw;padding:.3cqw 1.8cqw;vertical-align:.3cqw}
#cert .best{font-size:3.4cqw;color:#7a6a58;font-weight:bold;white-space:nowrap}
#cert .seenH{font-size:3cqw;color:#7a6a58;font-weight:bold;text-align:left;margin-bottom:-.6cqw;white-space:nowrap}
#cert .seen{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw}
#cert .chip{font-size:3.1cqw;line-height:1;padding:1.7cqw 0;border-radius:1.2cqw;background:#efe3c8;color:#a8977c;
  white-space:nowrap;overflow:hidden;position:relative}
#cert .chip.on{background:#fff;color:#3a2a1c;font-weight:bold;box-shadow:inset 0 0 0 .35cqw #c9a15a}
#cert .chip.cur{background:#ffe08a;box-shadow:inset 0 0 0 .5cqw #c8321f}
#cert .chip.nw::after{content:"";position:absolute;top:.5cqw;right:.6cqw;width:1.5cqw;height:1.5cqw;border-radius:50%;background:#e0382a}
#cert .btns{display:flex;gap:2.4cqw;margin-top:.6cqw}
#cert button{border:0;font:inherit;font-weight:bold;cursor:pointer;touch-action:manipulation;color:#fff}
#cert #again{flex:1.7;height:12cqw;font-size:5.4cqw;border-radius:3.6cqw;background:linear-gradient(#ff6b5a,#d2382f);
  box-shadow:0 1.1cqw 0 #8f221c;opacity:.4}
#cert.ready #again{opacity:1;animation:blink 1.1s ease-in-out infinite}
#cert #again:active{transform:translateY(.8cqw);box-shadow:0 .3cqw 0 #8f221c}
#cert #share{flex:1;height:12cqw;font-size:3.6cqw;border-radius:3.2cqw;background:transparent;color:#2c4aa0;
  border:.5cqw solid #2c4aa0;box-shadow:0 .5cqw 0 #2c4aa066}
#cert #share:active{transform:translateY(.4cqw)}
/* 破門状 */
#cert.ban .paper{background:#f3eee2;border-color:#26222a;box-shadow:inset 0 0 0 .6cqw #8a8070,0 1.6cqw 0 #111,0 2.6cqw 5cqw #0007}
#cert.ban .ct{color:#26222a;border-bottom-color:#26222a;letter-spacing:2.4cqw}
#cert.ban .rank{color:#26222a}
#cert.ban .seal{border-width:1.2cqw;background:radial-gradient(#fff3,#fff0)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="hudTop"><span id="tLeft">5.0</span><small>秒</small></div>
  <div id="hudBot"><b id="cNum">0</b> 回</div>
  <div id="call"></div>
  <div id="cap"></div>
  <div id="title">
    <div class="tt">
      <div class="t2"><span class="t2a nb">割りすぎ</span><span class="nb">瓦割り</span></div>
      <div class="t3"><span class="nb">5秒で</span> <span class="nb">どこまで</span> <span class="nb">割れる？</span></div>
    </div>
    <div class="t4"><span>はじめる</span></div>
  </div>
</div>
<div id="cert">
  <div class="paper">
    <div class="ct" id="cTitle">段位認定証</div>
    <div class="top">
      <div><div class="who"><span class="nb">挑戦者</span> <span class="nb">殿</span></div><div class="rank" id="cRank"></div></div>
      <div class="seal" id="cSeal">師範</div>
    </div>
    <div class="st"><span class="lbl">審査結果</span><b id="cStage"></b></div>
    <div class="vd" id="cVerdict"></div>
    <div class="facts"><div>割った瓦　<b id="cTiles"></b></div><div>連打　<b id="cCount"></b> 回<span class="upd" id="cNewC">更新</span></div></div>
    <div class="best" id="cBest"></div>
    <div class="seenH" id="cSeenH"></div>
    <div class="seen" id="cSeen"></div>
    <div class="btns"><button id="again" type="button">もう一回</button><button id="share" type="button">Xで共有</button></div>
  </div>
</div>
<script>
// ===== 調整用の数値 =====
const CFG = {
  h: 1 / 120,            // 検証用の固定刻み
  readySecs: 0.6,        // 「はじめ」から連打の開始まで
  duration: 5,           // 連打の長さ（秒）。「はじめ」のあとに固定
  finishSecs: 0.16,      // 「せいっ」で腕を振り下ろして瓦に届くまで。そのあと見せ場
  retryWait: 1.0,        // 結果が出てから再挑戦を受け付けるまで（誤タップ防止。認定証を見せるので長め）
  certDelay: 0.6,        // 見せ場のあと、認定証を出すまで（見せ場の最後の画面を見せる時間）
  shareUrl: 'https://fish-suika.github.io/kawarawari/',
  maxPerSec: 25,         // 1秒に数える連打の上限（直近1秒の窓）
  tiles: 20,             // 積む瓦の枚数

  // 段階 i になる最低の連打数（段階 0〜10）。本人のテストプレイで調整。段階 8〜10 は本人の最終修正（2026-11-20）で追加
  levelAt: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60],   // 6 回ごと。毎秒 8 回強でクレーター、毎秒 12 回（両手の全力）で地球真っ二つ
  stageNames: ['ひびだけ', '瓦 数枚', '瓦 全部', '道場の床', '道場 全壊', '町内 全壊', '山 真っ二つ', 'クレーター', '大陸 真っ二つ', '地球に ひび', '地球 真っ二つ'],

  tierEvery: 6,          // 連打 6 回ごとにオーラが一段派手になる（下で levelAt[0] から上書き）
  maxTier: 10,

  // ---- Phase 2：破壊の見せ場 ----
  showSecs: [1.0, 1.2, 1.5, 2.1, 2.7, 3.2, 3.6, 4.0, 4.5, 4.8, 5.0],   // 段階ごとの見せ場の長さ（秒。高いほど長い。最高でも約 5 秒）
  showSpeed: [1, 1, 1, 1, 1, 1, 1, 1, 1.2, 1.4, 1.5],   // 見せ場の進む速さ。段階 8〜10 は中身が長いので少し速く進めて 5 秒に収める
  showMax: 5.0,          // 見せ場の長さの上限（秒）
  skipGrace: 0.4,        // 見せ場の最初の 0.4 秒はタップを早送りにしない（連打の指が残っているため）
  maxPieces: 400,        // 破片（砂ぼこり含む）の数の上限
  seed: 20261120,        // 乱数のシード（連打数を足して使う。同じ連打数なら同じ壊れ方）
  camAt: [0, 0, 0, 0.75, 1.5, 2.05, 2.6, 3.05, 3.9, 5.0, 6.4],          // 段階 k のカメラが引き始める時刻（見せ場の時刻の単位）
  camDur: [0, 0, 0, 0.45, 0.45, 0.45, 0.4, 0.45, 0.7, 0.8, 0.4],        // そのカメラが動く時間
  craterT: [3.15, 3.8],  // クレーターができ始める・できあがる時刻
  // 段階 8〜10（宇宙へ）の時刻 [始め, 終わり]。run：地割れが走る／open：大陸が左右に開く／close：開いた割れ目が細くなる（段階 9〜）
  // globe：地球の外見に切り替わる／ecr：地球のひびが広がる／split：地球が割れて離れる／world：町や山が見えなくなる
  sp: { run: [4.35, 4.8], open: [4.75, 5.15], close: [5.2, 5.8], globe: [5.3, 5.85], ecr: [5.75, 6.45], split: [6.5, 7.2], world: [5.3, 5.8] },
  showCaps: [            // 段階ごとの大きな文字 [文字, 出る時刻]
    ['……いたい', 0.2], ['瓦、数枚', 0.2], ['瓦、全部', 0.3], ['床、抜けた', 0.95],
    ['道場、全壊', 1.65], ['町内、全壊', 2.25], ['山、真っ二つ', 2.75], ['……クレーター', 3.3],
    ['大陸、真っ二つ', 4.8], ['地球に、ひび', 5.9], ['地球、真っ二つ', 6.6]],
};
CFG.tierEvery = CFG.levelAt[0];                       // オーラの段は段階と同じ区切り（6 回ごと）
CFG.topCount = CFG.levelAt[CFG.levelAt.length - 1];   // 最高段階の連打数。強さの伸びの上限に使う
// ===== ゲームのロジック（画面を使わない）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// 連打数 → 段階（0〜10）
function stageFor(count) {
  let s = 0;
  for (let i = 0; i < CFG.levelAt.length; i++) if (count >= CFG.levelAt[i]) s = i + 1;
  return s;
}
// 連打数 → オーラの段（段階と同じ区切りで一段）
function tierFor(count) { return Math.min(CFG.maxTier, Math.floor(count / CFG.tierEvery)); }

// キー入力を数えてよいか（スペース・Enter、押しっぱなしの連続入力は数えない）
function acceptKey(e) {
  if (e.repeat) return false;
  return e.key === ' ' || e.key === 'Enter' || e.code === 'Space';
}

const Game = {
  mode: 'title',   // title → ready → play → finish（せいっ）→ show（破壊の見せ場）→ over（結果）
  t: 0, readyT: 0, finT: 0, showT: 0, showR: 0, overT: 0, show: null,   // showT：見せ場の時刻（見せ場の単位）／showR：見せ場が始まってからの実際の秒数
  count: 0, hits: [],      // hits: 数えた時刻（直近1秒の窓の判定に使う）
  events: [],

  reset() {
    this.mode = 'title';
    this.t = 0; this.readyT = 0; this.finT = 0; this.showT = 0; this.showR = 0; this.overT = 0; this.show = null;
    this.count = 0; this.hits = [];
    this.events = [];
  },

  begin() {
    if (this.mode !== 'title') return;
    this.mode = 'ready'; this.readyT = 0;
    this.events.push({ type: 'ready' });
  },

  stage() { return stageFor(this.count); },
  tier() { return tierFor(this.count); },
  remaining() { return Math.max(0, CFG.duration - this.t); },
  // 見せ場を始める（届いた段階まで。壊れ方は連打数で決まるシード付き）
  startShow() {
    const st = this.stage();
    this.show = buildShow(st, CFG.seed + this.count);
    this.mode = 'show'; this.showT = 0; this.showR = 0;
    this.events.push({ type: 'show', stage: st });
  },
  // タップで早送り：見せ場の最初の skipGrace 秒は受け付けない。結果へ直ちに移る
  skip() {
    if (this.mode !== 'show' || this.showR < CFG.skipGrace) return false;
    this.showT = this.show.dur; this.mode = 'over'; this.overT = 0;
    this.events.push({ type: 'over', skipped: true });
    return true;
  },
  canRetry() { return this.mode === 'over' && this.overT >= CFG.retryWait; },

  // 連打 1 回。'hit' 数えた / 'limited' 速すぎて数えない / 'ignored' 受付外（はじめ前・締め切り後）
  tap() {
    if (this.mode !== 'play' || this.t >= CFG.duration - 1e-9) return 'ignored';
    const h = this.hits;
    while (h.length && this.t - h[0] >= 1 - 1e-9) h.shift();
    if (h.length >= CFG.maxPerSec) return 'limited';
    h.push(this.t);
    this.count++;
    this.events.push({ type: 'hit', count: this.count, tier: this.tier(), tierUp: this.count % CFG.tierEvery === 0 && this.count / CFG.tierEvery <= CFG.maxTier });
    return 'hit';
  },

  step(dt) {
    if (this.mode === 'ready') {
      this.readyT += dt;
      if (this.readyT >= CFG.readySecs) { this.mode = 'play'; this.t = 0; this.hits = []; this.events.push({ type: 'start' }); }
      return;
    }
    if (this.mode === 'play') {
      this.t += dt;
      if (this.t >= CFG.duration - 1e-9) {
        this.t = CFG.duration;
        this.mode = 'finish'; this.finT = 0;
        this.events.push({ type: 'end', count: this.count, stage: this.stage() });
      }
      return;
    }
    if (this.mode === 'finish') {
      this.finT += dt;
      if (this.finT >= CFG.finishSecs) this.startShow();
      return;
    }
    if (this.mode === 'show') {
      this.showR += dt;
      this.showT = Math.min(this.show.dur, this.showR * this.show.speed);
      if (this.showT >= this.show.dur - 1e-9) { this.showT = this.show.dur; this.mode = 'over'; this.overT = 0; this.events.push({ type: 'over' }); }
      return;
    }
    if (this.mode === 'over') this.overT += dt;
  },
};
// ===== 段位・記録・共有（画面を使わない）=====
// 段位。8〜10 は破門の先のおかしな段位（本人の最終修正 2026-11-20 で追加）
const RANKS = ['出直し', '初段', '二段', '三段', '四段', '五段', '名誉師範', '破門', '永久破門', '地球出禁', '宇宙破門'];
const NST = CFG.stageNames.length;   // 段階の数（11）
// 師範のひとこと（文節ごとに区切る。画面では文節の途中で改行しない）
const VERDICTS = [
  ['瓦が割れるまで、', '出直してまいれ'],
  ['右の者、', '瓦を割ったことを', '認める'],
  ['右の者、', '瓦を全部', '割ったことを', '認める'],
  ['右の者、', '道場の床まで', '割ったことを', '認める'],
  ['右の者、', '道場を', '全壊させたことを', '認める'],
  ['右の者、', '町内を', '全壊させたことを', '認める'],
  ['右の者、', '山まで', '割ったゆえ', '名誉師範とする'],
  ['右の者、', '割りすぎにつき', '破門とする'],
  ['右の者、', '大陸を', '真っ二つにしたゆえ', '永久に', '破門とする'],
  ['右の者、', '地球に', 'ひびを入れたゆえ', '地球への', '立ち入りを', '禁ずる'],
  ['右の者、', '地球を', '割りすぎたゆえ', '宇宙より', '破門とする'],
];

const rankFor = s => RANKS[clamp(s, 0, NST - 1)];

// 本人の光の輪の強さ・大きさ、引いたときに本人を大きく見せる倍率（見つけられる大きさ・穴の底に収まる大きさ）
const HERO_MAX = 10;

  if (S >= 8) sc = Math.max(sc, Math.min(HERO_MAX, 24 / (31 * k)));

// 乱数（シード付き。同じシードなら同じ壊れ方）
function mkRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

// カメラが見ている世界の範囲（画面 W×H px に収める倍率 k = px/世界単位）
function viewFor(cam, W, H) {
  const k = Math.min(W / cam.w, H / cam.h), hw = W / (2 * k), hh = H / (2 * k);

// 見せ場の時刻 t のカメラ（段階が上がるたびに一段引く）
function camAt(S, t) {
  let a = BASE_CAM, b = BASE_CAM, u = 1;
  for (let k = 3; k <= S; k++) {

// クレーターの進み具合（0〜1）

}
// 地面の上端（クレーターで掘れた後）。真ん中の底（半幅 CFL）が平らで、本人はそこに立つ。まわりは外へ向かって浅くなる
function craterTop(x, cp) {
  const u = (Math.abs(x - CR.x) - CFL) / (CR.R - CFL);

  return GY + cp * CR.D * (u <= 0 ? 1 : Math.pow(1 - u * u, 0.75));
}
// 画面の揺れ（px）・光（0〜）
function shakeAt(sh, t, o) {

  for (const s of sh.shakes) if (t >= s.t && t < s.t + s.d) { const u = 1 - (t - s.t) / s.d; a += s.a * u * u; }

function flashAt(sh, t) {

}
// 今出す大きな文字（出ていなければ -1）
function captionAt(sh, t) {
  let r = -1;
  for (let i = 0; i < sh.caps.length; i++) if (sh.caps[i].t <= t) r = i;
  return r;
}

// 空手家の動き：腕の目標・顔・落ちる高さ
function karaAt(sh, t) {
  const S = sh.stage, o = { dy: 0, dx: 0, tx: 61, ty: 65, face: 'serious' };
  if (S === 0) {            // 手を押さえて悶える
    const e = smooth((t - 0.12) / 0.25);
    o.tx = lerp(61, KX + 9, e); o.ty = lerp(65, 105, e); o.face = 'pain';
    if (t > 0.3) { o.dx = Math.sin(t * 48) * 0.7; o.dy = -Math.abs(Math.sin((t - 0.3) * 13)) * 1.8; }
  } else {                  // 拳が瓦を割り下ろし、そのあと正拳の姿勢のまま真顔
    const wv = S === 1 ? [3, 15, 0.35, 0.6] : [8, 60, 0.6, 0.75];
    const w = smooth((t - 0.05) / wv[2]), e = smooth((t - wv[3]) / 0.3);
    o.tx = lerp(61 + wv[0] * w, KX + 27, e); o.ty = lerp(65 + wv[1] * w, 104, e);

    const tt = t - FALL_T, fall = BY - GY, tl = Math.sqrt(2 * fall / GRAV);

    const dg = craterTop(KX, craterAt(S, t)) - GY;

// 時刻 t の本人の足もと（世界の座標）。段階 8 以上は割れた地球の左の半分（クレーターのある側）に乗って動く

// ---- 破片 ----
// 着地までの時間（床に届かないなら Infinity）

  return Math.max(0, (-p.vy + Math.sqrt(d)) / GRAV);

// 時刻 t の破片の姿勢を o に書く（位置 x,y・角度 a・透明度 al・大きさ s）。式だけで決まるので早送りでも飛ばない

}

// 家の窓・ドアの飾り（箱の中心が原点。[x, y, w, h, 色] の長方形を順に描く）
function houseDec(w, h) {
  const d = [], win = (x, y, ww, hh) => {
    d.push([x - 0.7, y - 0.7, ww + 1.4, hh + 1.4, '#9a7048'], [x, y, ww, hh, '#d4f0ff'],
      [x + ww / 2 - 0.25, y, 0.5, hh, '#9a7048'], [x, y + hh / 2 - 0.25, ww, 0.5, '#9a7048']);
  };
  win(-w * 0.4, -h * 0.3, w * 0.24, h * 0.24);

// 段階 S までの見せ場を作る。S より上の物は壊れずに（tb = Infinity）そのまま置いてある
function buildShow(S, seed) {
  const R = mkRng(seed), RG = mkRng(CFG.seed + 99);   // R：飛び方（連打数で変わる） RG：形・切れ目（いつも同じ）

  for (let c = 0; c < 6; c++) for (let r = 0; r < 2; r++) {     // 奥の壁

// 配置は 30-show.js（GY・KX・TX…）
const TIER_COL = ['#ffffff', '#fff2a8', '#ffd84a', '#ffa63a', '#ff6a2a', '#ff3d4a', '#e63cc8', '#7a5cff', '#4aa8ff', '#35e0d0', '#fff1a0'];

// ---- 演出の状態 ----
const V = { kick: 0, bounce: 0, pulse: 0, aura: 12, flash: 0, slam: 0 };
const sparks = [], rings = [];
const SPARK_MAX = 90;

function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function mix(c1, c2, k) {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const a = p(c1), b = p(c2);
  return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',') + ')';
}

// 押した反応（見た目）
function onHit(e) {
  V.kick = Math.min(1.6, V.kick + 0.5);
  V.bounce = 1; V.pulse = 1;
  const n = e.tier >= 4 ? 3 : 2;
  for (let i = 0; i < n && sparks.length < SPARK_MAX; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, sp = 18 + Math.random() * 26 + e.tier * 3;
    sparks.push({ x: KX + 6 + (Math.random() - 0.5) * 6, y: 78 + Math.random() * 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 0.35 + Math.random() * 0.3, col: TIER_COL[e.tier], r: 0.9 + Math.random() * 0.9 });
  }
  if (e.tierUp) {
    rings.push({ life: 0, max: 0.6, col: TIER_COL[e.tier] });
    V.flash = Math.min(0.5, 0.12 + e.tier * 0.04);
  }
}
function onSlam() { V.slam = 1; V.flash = 0.6; V.kick = 3; }
function resetVisual() { V.kick = 0; V.bounce = 0; V.pulse = 0; V.aura = 12; V.flash = 0; V.slam = 0; sparks.length = 0; rings.length = 0; }

function updateVisual(dt) {
  V.kick *= Math.exp(-dt * 7);
  V.bounce *= Math.exp(-dt * 12);
  V.pulse *= Math.exp(-dt * 8);
  V.flash *= Math.exp(-dt * 6);
  V.slam *= Math.exp(-dt * 4);
  const target = Game.mode === 'title' ? 12 : (Game.mode === 'show' || Game.mode === 'over') ? 0 : 14 + Math.min(Game.count, CFG.topCount) / CFG.topCount * 38.5;
  V.aura += (target - V.aura) * (1 - Math.exp(-dt * 10));
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life += dt;
    if (s.life >= s.max) { sparks.splice(i, 1); continue; }
    s.vy += 60 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].life += dt; if (rings[i].life >= rings[i].max) rings.splice(i, 1); }
}

function twoBone(sx, sy, tx, ty, l1, l2, flip) {
  const dx = tx - sx, dy = ty - sy, d0 = Math.hypot(dx, dy) || 0.01;
  const d = clamp(d0, Math.abs(l1 - l2) + 0.1, l1 + l2 - 0.05);
  const ux = dx / d0, uy = dy / d0;
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a)) * (flip ? -1 : 1);
  return { ex: sx + ux * a + uy * h, ey: sy + uy * a - ux * h, hx: sx + ux * d, hy: sy + uy * d };
}

// ---- 空・雲・太陽・裏山の芯 ----

// 地面の上端を決める点の x（地面の断面の輪郭）。引いたとき（disc）は地球の丸みを足すので細かく刻む
function groundXs(v, cp, disc) {
  const xL = v.x0 - 30, xR = v.x1 + 30, xs = [xL, xR];
  if (disc) { const st = Math.max(6, (xR - xL) / 240); for (let x = xL; x < xR; x += st) xs.push(x); }
  if (cp > 0) {
    for (let x = CR.x - CR.R - 6; x <= CR.x + CR.R + 6; x += 6) xs.push(x);
    for (const e of [CR.x - CFL, CR.x + CFL]) xs.push(e - 0.001, e + 0.001);   // 穴の底の平らな部分の端
  }
  return xs.filter(x => x >= xL && x <= xR).sort((a, b) => a - b);
}
// 丸み：クレーターの中心 (PX, GY) の高さを基準に、地球の円（中心 x=EX）に沿って地面が下がる量。Re：そのときの地球の半径（0 なら平ら）
const sagOf = Re => {
  if (!Re) return () => 0;
  const cy = cyOf(Re);
  return x => { const d = x - EX; return cy - GY - (Math.abs(d) < Re * 0.9995 ? Math.sqrt(Re * Re - d * d) : 0); };
};
// 地層の下の深いところ（半径に対する割合・色）：地球の断面。引いたときだけ見える
const DEEP = [[0.72, '#9c5a3c'], [0.55, '#d06a38'], [0.34, '#ff9a3a'], [0.17, '#ffe27a']];

// クレーターの穴の中（奥の壁）：縁は明るく、奥ほど暗い。地層の線がうっすら見える。穴のふちの内側は影で、えぐれて見える
function drawCavity(v, cp, sp) {

  const xs = groundXs(v, cp, false).filter(x => x >= CR.x - CR.R - 7 && x <= CR.x + CR.R + 7);
  if (xs.length < 2) return;
  const xa = xs[0], xb = xs[xs.length - 1];
  c.save(); c.beginPath();
  xs.forEach((x, i) => (i ? c.lineTo(x, GY + sag(x)) : c.moveTo(x, GY + sag(x))));
  for (let i = xs.length - 1; i >= 0; i--) c.lineTo(xs[i], craterTop(xs[i], cp) + sag(xs[i]));
  c.closePath(); c.clip();

  g.addColorStop(0, '#d4b283'); g.addColorStop(0.22, '#aa8460'); g.addColorStop(0.5, '#6c4d38'); g.addColorStop(0.8, '#3d2b24'); g.addColorStop(1, '#271b1c');
  c.fillStyle = g; c.fillRect(xa - 2, GY - 12, xb - xa + 4, CR.D + 90);
  c.lineWidth = 1.6 / v.k;
  for (let i = 1; i < STRATA.length; i++) {            // 奥の壁の地層の線
    const y = STRATA[i][0];
    c.strokeStyle = 'rgba(30,16,8,0.30)'; c.beginPath(); c.moveTo(xa, y); c.lineTo(xb, y); c.stroke();
    c.strokeStyle = 'rgba(255,230,190,0.10)'; c.beginPath(); c.moveTo(xa, y + 1.6 / v.k); c.lineTo(xb, y + 1.6 / v.k); c.stroke();
  }
  c.beginPath();                                      // 穴の縁（掘れた地面との境）に落ちる影
  for (let i = xs.length - 1; i >= 0; i--) { const x = xs[i], y = craterTop(x, cp) + sag(x); if (i === xs.length - 1) c.moveTo(x, y); else c.lineTo(x, y); }

}

// 地面の断面：地層の帯、道場の下の階、クレーター（本人は穴の底に立つ）。引いたとき（sp.eps > 0.05）は地球の丸みと断面（円の層）になる
function drawGround(v, cp, sp) {

  if (!disc) {
    for (let i = 0; i < STRATA.length; i++) {
      const y0 = STRATA[i][0], y1 = i + 1 < STRATA.length ? STRATA[i + 1][0] : yB;
      c.fillStyle = STRATA[i][1]; c.fillRect(xL, y0, xR - xL, Math.max(y1, y0 + 1) - y0 + 0.5);
    }
  } else {
    const dk = (r, col) => { c.fillStyle = col; c.beginPath(); c.arc(EX, ccy, r, 0, 6.283); c.fill(); };
    for (const [y, col] of STRATA) dk(Re - (y - GY), col);
    for (const [f, col] of DEEP) dk(Re * f, col);
  }
  if (v.x1 - v.x0 < 2500) drawStrataArt(v);
  // 下の階（道場の真下の部屋）
  c.fillStyle = '#b89a72'; c.fillRect(DL, GY, DR - DL, BY - GY);
  c.fillStyle = '#d8c096'; c.fillRect(DL, GY, DR - DL, 3);
  c.fillStyle = '#8f7452';
  for (let x = DL + 17; x < DR; x += 34) c.fillRect(x - 1, GY, 2, BY - GY);
  c.fillRect(DL, 176, DR - DL, 1.6);
  c.fillStyle = '#e0b068'; c.fillRect(DL, BY, DR - DL, 9);
  c.fillStyle = '#9a7438'; c.fillRect(DL, BY, DR - DL, 1.2);
  if (cp > 0) {   // 穴のふち（えぐれた土）の影と輪郭線。地面の内側だけに見える
    const cr = pts.filter(p => p[0] >= CR.x - CR.R - 7 && p[0] <= CR.x + CR.R + 7);
    c.beginPath(); cr.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
    c.lineJoin = 'round';
    c.strokeStyle = 'rgba(48,26,14,0.26)'; c.lineWidth = Math.min(16 / v.k, 24); c.stroke();
    c.strokeStyle = 'rgba(48,26,14,0.32)'; c.lineWidth = Math.min(7 / v.k, 13); c.stroke();
    c.strokeStyle = '#45291a'; c.lineWidth = 3.2 / v.k; c.stroke();
  }
  c.restore();
  if (!disc) drawGrass(v, cp);
}

// 破片・建物・山など（lay：奥から手前）。時刻 tp の姿勢は 30-show.js の poseAt
const po = { x: 0, y: 0, a: 0, al: 1, s: 1 };
function drawPieces(sh, lay, tp, jit) {
  const c = cx, amp = 0.35 + Math.min(Game.count, CFG.topCount) / CFG.topCount * 0.84;
  for (const p of sh.pieces) {
    if (p.lay !== lay) continue;
    if (p.hid && tp < p.tb) continue;
    poseAt(p, tp, po);
    if (po.al <= 0.01) continue;
    if (jit && p.g === 'tile') {   // 連打の間の瓦の震え
      const i = CFG.tiles - 1 - p.idx, j = Math.sin(nowT * 65 + i * 2.31), j2 = Math.sin(nowT * 83 + i * 1.7);
      po.x += j * amp * V.kick * (0.4 + i * 0.05) + j * V.slam * 1.2; po.y += j2 * amp * V.kick * 0.25;
    }
    c.save(); c.translate(po.x, po.y);
    if (po.al < 1) c.globalAlpha = po.al;
    if (p.kind === 'puff') {
      c.fillStyle = p.col; c.beginPath(); c.arc(0, 0, po.s, 0, 6.283); c.fill();
    } else {
      if (po.a) c.rotate(po.a);
      const q = p.poly;
      c.beginPath(); c.moveTo(q[0], q[1]);
      for (let i = 2; i < q.length; i += 2) c.lineTo(q[i], q[i + 1]);
      c.closePath(); c.fillStyle = p.col; c.fill();
      if (p.edge) { c.strokeStyle = p.edge; c.lineWidth = Math.min(1.1, Math.max(0.35, 0.8 / CAMV.k)); c.stroke(); }
      if (p.dec) for (const d of p.dec) { c.fillStyle = d[4]; c.fillRect(d[0], d[1], d[2], d[3]); }
      if (p.decp) for (const d of p.decp) { c.fillStyle = d.col; c.beginPath(); c.moveTo(d.pts[0], d.pts[1]); for (let i = 2; i < d.pts.length; i += 2) c.lineTo(d.pts[i], d.pts[i + 1]); c.closePath(); c.fill(); }
      if (p.deco) { const f = DECO[p.deco]; if (f) f(c, p); }
      if (p.ck && tp >= p.ckT && tp < p.tb) {   // ひび
        c.strokeStyle = '#141a22'; c.lineWidth = 0.4; c.beginPath(); c.moveTo(p.ck[0], p.ck[1]);
        for (let i = 2; i < p.ck.length; i += 2) c.lineTo(p.ck[i], p.ck[i + 1]);
        c.stroke();
      }
    }
    c.restore();
  }
}

function drawAura() {
  const c = cx, t = Game.tier(), col = TIER_COL[t];
  if (Game.mode === 'title' || Game.mode === 'ready' || V.aura < 1.5) return;
  const ax = KX + 2, ay = 108, R = V.aura * (1 + V.pulse * 0.12);
  c.save(); c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(ax, ay, 0, ax, ay, R);
  g.addColorStop(0, col + 'cc'); g.addColorStop(0.5, col + '55'); g.addColorStop(1, col + '00');
  c.fillStyle = g; c.beginPath(); c.arc(ax, ay, R, 0, 6.283); c.fill();
  if (t >= 1) {   // 段階と同じ区切りで一段派手に：光の筋
    const n = 6 + t * 2, rot = nowT * (0.6 + t * 0.25);
    c.fillStyle = col + '40';
    for (let i = 0; i < n; i++) {
      const a = rot + i * 6.283 / n, w = 0.11, rl = R * (1.15 + 0.1 * Math.sin(nowT * 9 + i));
      c.beginPath(); c.moveTo(ax + Math.cos(a - w) * R * 0.55, ay + Math.sin(a - w) * R * 0.55);
      c.lineTo(ax + Math.cos(a) * rl, ay + Math.sin(a) * rl);
      c.lineTo(ax + Math.cos(a + w) * R * 0.55, ay + Math.sin(a + w) * R * 0.55); c.fill();
    }
  }
  for (const r of rings) {
    const p = r.life / r.max;
    c.strokeStyle = r.col; c.globalAlpha = 1 - p; c.lineWidth = 1.6 * (1 - p) + 0.3;
    c.beginPath(); c.arc(ax, ay, R * (0.7 + p * 1.1), 0, 6.283); c.stroke();
  }
  c.restore();
}

// 空手家の今の姿勢（腕の目標と顔）。連打〜せいっは Phase 1 のまま、見せ場は 30-show.js の karaAt
function karaView() {
  const m = Game.mode, sh = Game.show;
  if ((m === 'show' || m === 'over') && sh) {
    const t = m === 'show' ? Game.showT : sh.dur, k = karaAt(sh, t);
    return { dx: k.dx, dy: k.dy, tx: k.tx, ty: k.ty, face: k.face, t, by: 0, pain: sh.stage === 0, flip: false };
  }
  let tx = KX + 11, ty = 76 + (m === 'play' ? -V.bounce * 1.5 : 0);
  if (m === 'title') { tx = KX + 27; ty = 99; }   // 構え（ひじを下げて拳を前に）
  if (m === 'ready') { tx = KX + 12; ty = 84; }
  if (m === 'finish') {
    const e = Math.pow(clamp(Game.finT / 0.12, 0, 1), 2);
    tx = lerp(KX + 11, 61, e); ty = lerp(76, TB - CFG.tiles * TP - 3, e);
  }
  const by = V.bounce * 1.2 + (m === 'play' ? Math.sin(nowT * 30) * 0.15 * Math.min(1, Game.count / 20) : 0);
  return { dx: 0, dy: 0, tx, ty, face: m === 'play' || m === 'finish' ? 'shout' : m === 'title' ? 'serious' : 'calm', t: nowT, by, pain: false, flip: m === 'title' };
}

function drawKarateka() {
  const c = cx, K = karaView();
  const skin = mix('#f6cfa6', '#ff7a5a', clamp(Game.count / CFG.topCount, 0, 1));
  const kz = CAMV.k, hs0 = haloStrength();
  const sc = hs0 > 0 && Game.show ? heroScale(Game.show.stage, kz) : 1;   // 引いたとき大きく（宇宙まで引いたら、見つけられる大きさ・穴の底に収まる大きさまで）
  const ow = Math.min(2.2, Math.max(0.7, 1.1 / kz));                                          // 縁取りの太さ（引いても見える）
  c.save(); c.translate(K.dx, K.dy + K.by);
  if (sc > 1) { c.translate(KX + 1, GY); c.scale(sc, sc); c.translate(-(KX + 1), -GY); }
  const hs = haloStrength();
  if (hs > 0.05) { c.shadowColor = 'rgba(255,255,255,' + 0.95 * hs + ')'; c.shadowBlur = 9 * DPR * hs; }
  // 影
  c.save(); c.translate(0, -K.by); c.fillStyle = '#0003'; c.beginPath(); c.ellipse(KX + 1, GY + 1.5, 15, 2.6, 0, 0, 6.283); c.fill(); c.restore();
  c.lineCap = 'round'; c.lineJoin = 'round';
  const white = '#fffdf6', edge = '#7a604a';
  const limb = (w, pts) => {
    for (const [lw, col] of [[w + ow * 2, edge], [w, white]]) {
      c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); c.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
      c.stroke();
    }
  };
  // 脚（馬立ち）
  limb(7, [KX - 3, 122, KX - 10, GY - 1]); limb(7, [KX + 5, 122, KX + 12, GY - 1]);
  c.fillStyle = skin; c.beginPath(); c.ellipse(KX - 11, GY - 0.3, 4, 1.6, 0, 0, 6.283); c.ellipse(KX + 13, GY - 0.3, 4, 1.6, 0, 0, 6.283); c.fill();
  // 後ろの腕（ふだんは腰に。痛いときは手首を押さえる）
  if (K.pain) { const bk = twoBone(KX - 5, 105, K.tx - 1, K.ty + 2, 20, 20); limb(5.4, [KX - 5, 105, bk.ex, bk.ey, bk.hx, bk.hy]); }
  else limb(5.4, [KX - 5, 105, KX - 11, 114, KX - 5, 118]);
  // 胴
  c.fillStyle = white; c.strokeStyle = edge; c.lineWidth = Math.max(0.7, ow * 0.7);
  rr(c, KX - 8, 99, 17, 25, 4.5); c.fill(); c.stroke();
  c.strokeStyle = edge; c.lineWidth = 0.6; c.beginPath(); c.moveTo(KX - 1, 99); c.lineTo(KX + 4, 110); c.lineTo(KX + 7, 99); c.stroke();   // 襟
  c.fillStyle = '#26262e'; c.fillRect(KX - 8.3, 118.5, 17.6, 3.2);   // 黒帯
  // 頭
  const hx = KX + 1.5, hy = 91;
  c.fillStyle = skin; c.strokeStyle = edge; c.lineWidth = Math.max(0.7, ow * 0.7);
  c.beginPath(); c.arc(hx, hy, 7, 0, 6.283); c.fill(); c.stroke();
  c.fillStyle = '#26262e'; c.beginPath(); c.arc(hx - 0.6, hy - 1.2, 7.3, Math.PI * 1.02, Math.PI * 2.0); c.fill();
  c.fillStyle = '#fff'; c.fillRect(hx - 7.2, hy - 2.6, 14.4, 2.2);   // はちまき
  c.fillStyle = '#d2382f'; c.beginPath(); c.arc(hx, hy - 1.5, 1.1, 0, 6.283); c.fill();
  c.fillStyle = '#26262e'; c.strokeStyle = '#26262e';
  if (K.face === 'pain') {            // >_< と汗
    c.lineWidth = 0.8; c.beginPath(); c.moveTo(hx + 2, hy - 0.5); c.lineTo(hx + 4, hy + 1); c.lineTo(hx + 2, hy + 2.4); c.stroke();
    c.beginPath(); c.moveTo(hx + 1.6, hy - 1.6); c.lineTo(hx + 5, hy - 0.6); c.stroke();
    c.strokeStyle = '#7a1f1a'; c.beginPath(); c.moveTo(hx + 1.6, hy + 4.6); c.lineTo(hx + 2.6, hy + 3.8); c.lineTo(hx + 3.6, hy + 4.6); c.lineTo(hx + 4.6, hy + 3.8); c.stroke();
    c.fillStyle = '#7ec8ff';
    for (let i = 0; i < 3; i++) { const u = (K.t * 2.2 + i / 3) % 1; c.globalAlpha = 1 - u; c.beginPath(); c.ellipse(hx + 8 + i * 2 + u * 5, hy - 6 - u * 7, 0.9, 1.4, 0, 0, 6.283); c.fill(); }
    c.globalAlpha = 1;
  } else if (K.face === 'serious') {  // 真顔：まっすぐな眉、点の目、一文字の口
    c.beginPath(); c.ellipse(hx + 3.2, hy + 1.2, 0.8, 0.8, 0, 0, 6.283); c.fill();
    c.lineWidth = 0.8; c.beginPath(); c.moveTo(hx + 1.8, hy - 0.5); c.lineTo(hx + 5, hy - 0.5); c.stroke();
    c.strokeStyle = '#7a1f1a'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(hx + 1.8, hy + 4.3); c.lineTo(hx + 4.6, hy + 4.3); c.stroke();
  } else {
    const shout = K.face === 'shout';
    c.beginPath(); c.ellipse(hx + 3.2, hy + 1.2, 0.9, shout ? 0.6 : 1, 0, 0, 6.283); c.fill();   // 目
    c.lineWidth = 0.8; c.beginPath(); c.moveTo(hx + 1.8, hy - 0.6); c.lineTo(hx + 5, hy + 0.2); c.stroke();   // まゆ
    if (shout) { c.fillStyle = '#7a1f1a'; c.beginPath(); c.ellipse(hx + 3.2, hy + 4.4, 1.7, 1.2 + Math.min(1, V.pulse) * 0.9, 0, 0, 6.283); c.fill(); }
    else { c.strokeStyle = '#7a1f1a'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(hx + 1.8, hy + 4.3); c.lineTo(hx + 4.6, hy + 4.3); c.stroke(); }
  }
  // 前の腕（二関節）
  const arm = twoBone(KX + 3, 104, K.tx, K.ty, 22, 22, K.flip);
  limb(5.4, [KX + 3, 104, arm.ex, arm.ey, arm.hx, arm.hy]);
  c.fillStyle = skin; c.strokeStyle = edge; c.lineWidth = Math.max(0.5, ow * 0.6);
  c.beginPath(); c.arc(arm.hx, arm.hy, 3.4, 0, 6.283); c.fill(); c.stroke();
  c.restore();
}

function drawSparks() {
  const c = cx;
  for (const s of sparks) {
    const p = s.life / s.max;
    c.globalAlpha = 1 - p; c.fillStyle = s.col;
    c.beginPath(); c.arc(s.x, s.y, s.r * (1 - p * 0.5), 0, 6.283); c.fill();
  }
  c.globalAlpha = 1;
}

// 世界のひとまとまり（奥の壁・山・家・地面・人・瓦…）。core：本人（オーラ・光の輪）を地面の手前に描く
function drawScene(v, sh, sp, inShow, ts, tp, jit, core) {
  const c = cx, wa = sp.world, cp = craterAt(sh.stage, ts);
  drawCavity(v, cp, sp);              // 穴の奥の壁（世界が見えなくなっても、穴は地面の一部として残る）
  c.save(); if (wa < 1) c.globalAlpha = wa;
  if (wa > 0.01) {
    drawHills(v, tp);
    drawPieces(sh, 0, tp, jit);       // 裏山
    drawResidents(v);
    drawPieces(sh, 1, tp, jit);       // 家・電柱
    drawWires(sh, tp, v);
    drawPieces(sh, 2, tp, jit);       // 道場の奥の壁・柱
  }
  c.restore();
  drawGround(v, cp, sp);
  if (sp.glb > 0.01) { drawGlobe(v, sp); drawCavity(v, cp, sp); }   // 地球の外見に切り替わっても、本人の立つ穴は見える
  if (sp.ecr > 0.001) drawEarthCracks(v, sp);
  c.save(); if (wa < 1) c.globalAlpha = wa;
  if (wa > 0.01) drawCast(v, sh, inShow, ts);
  c.restore();
  if (core) { drawAura(); drawHalo(karaView()); drawKarateka(); }
  c.save(); if (wa < 1) c.globalAlpha = wa;
  if (wa > 0.01) {
    drawPieces(sh, 3, tp, jit);       // 瓦・台・床
    drawPieces(sh, 4, tp, jit);       // 屋根・外の壁
    drawPieces(sh, 5, tp, jit);       // 砂ぼこり・土
  }
  c.restore();
  if (sp.eps > 0.4) drawFolk(v, sp);
}

function render() {
  const c = cx, m = Game.mode, sh = Game.show || IDLE;
  const inShow = !!Game.show && (m === 'show' || m === 'over');
  const ts = inShow ? (m === 'show' ? Game.showT : sh.dur) : 0;                                   // カメラ・演出の時刻
  const tp = inShow ? (m === 'show' ? Game.showT : sh.dur + Math.min(Game.overT, 3)) : 0;          // 破片の時刻（結果のあとも着地まで進む）
  let cam = inShow ? camAt(sh.stage, ts) : BASE_CAM;
  const shk = inShow ? shakeAt(sh, ts, { x: 0, y: 0 }) : { x: 0, y: 0 };
  if (m === 'over' && RESL.on) {          // 認定証が出るとき、絵をずらして本人が認定証にかぶらないように
    const u = smooth((Game.overT - CFG.certDelay) / 0.55);
    if (u > 0) {
      const sft = resultShift(sh.stage, cam, W, H, RESL), zf = lerp(1, 1 / sft.z, u), c2 = { cx: cam.cx, cy: cam.cy, w: cam.w * zf, h: cam.h * zf }, kc = viewFor(c2, W, H).k;
      cam = { cx: cam.cx - sft.x * u / kc, cy: cam.cy - sft.y * u / kc, w: c2.w, h: c2.h };
    }
  }
  const v = CAMV = viewFor(cam, W, H);
  const sp = inShow ? spaceAt(sh.stage, ts) : NOSP;     // 段階 8〜10 の宇宙の状態（それ以外は何もなし）
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  c.setTransform(DPR * v.k, 0, 0, DPR * v.k, DPR * (W / 2 - cam.cx * v.k + shk.x), DPR * (H / 2 - cam.cy * v.k + shk.y));
  const jit = !inShow;
  drawSky(v, sp);
  if (sp.eps > 0.05) { drawSpaceBuddies(v, sp); drawMagma(v, sp); }
  const split = sp.eps > 0.05 && (sp.ang > 0.0005 || sp.sp > 0.0005);
  if (!split) drawScene(v, sh, sp, inShow, ts, tp, jit, true);
  else {                                  // 大陸（地球）が x=EX で左右の半分に割れて動く。本人はクレーターの底に立ったまま、左の半分といっしょに動く
    const ov = 1.2 / v.k, half = side => { const h = halfXf(sp, side); c.translate(h.dx, 0); c.translate(EX, PCY); c.rotate(h.rot); c.translate(-EX, -PCY); };
    for (const side of [-1, 1]) {
      c.save(); half(side);
      c.beginPath();
      if (side < 0) c.rect(EX - 4e5, PCY - 4e5, 4e5 + ov, 8e5); else c.rect(EX, PCY - 4e5, 4e5, 8e5);   // 左は継ぎ目が見えないよう少し重ねる
      c.clip();
      drawScene(v, sh, sp, inShow, ts, tp, jit, false);
      c.restore();
    }
    c.save(); half(-1);
    drawAura(); drawHalo(karaView()); drawKarateka();
    c.restore();
  }
  if (sp.crack > 0) drawRiftCrack(v, sp);
  drawSparks();
  if (inShow) drawBubbles(v, sh, ts);
  const f = Math.min(0.85, V.flash + (inShow ? flashAt(sh, ts) : 0));
  if (f > 0.01) { c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = 'rgba(255,255,255,' + f + ')'; c.fillRect(0, 0, cv.width, cv.height); }
}
// ===== 絵（Canvas）：道場の飾り・人・吹き出し・高台・光の輪・地層の模様 =====
// やわらかい線のイラスト風：明るい色の面に、あたたかい茶色の細い縁取り
const INK = '#6b4a3a';
const FONT = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif';

// ---- 壁・床・瓦の飾り（物の中心が原点）----
const DECO = {
  planks(c, p) {                      // 下の壁：板張り
    const w = p.poly[2] - p.poly[0], h = p.poly[5] - p.poly[1], x0 = -w / 2;
    c.fillStyle = 'rgba(255,255,255,0.16)';
    for (let n = 0, x = x0; x < w / 2; n++, x += 6.4) if (n % 2) c.fillRect(x, -h / 2, Math.min(6.4, w / 2 - x), h);
    c.strokeStyle = '#c99a58'; c.lineWidth = 0.35; c.beginPath();
    for (let x = x0 + 6.4; x < w / 2 - 0.5; x += 6.4) { c.moveTo(x, -h / 2); c.lineTo(x, h / 2); }
    c.stroke();
    c.fillStyle = '#b9854a'; c.fillRect(x0, -h / 2, w, 2.2);
    c.fillStyle = '#d8b274'; c.fillRect(x0, -h / 2 + 2.2, w, 0.7);
    c.fillStyle = '#c9a060'; c.fillRect(x0, h / 2 - 3.4, w, 3.4);
  },
  window(c) {                         // 格子窓
    c.fillStyle = '#9a6a38'; c.fillRect(-10, -27, 20, 28);
    c.fillStyle = '#d6f1ff'; c.fillRect(-8.6, -25.6, 17.2, 25.2);
    c.fillStyle = 'rgba(255,255,255,0.7)';
    c.beginPath(); c.moveTo(-7.4, -24.6); c.lineTo(-1.4, -24.6); c.lineTo(-7.4, -14); c.closePath(); c.fill();
    c.fillStyle = '#9a6a38'; c.fillRect(-0.5, -25.6, 1, 25.2); c.fillRect(-8.6, -13.6, 17.2, 1);
    c.fillStyle = '#7a4f26'; c.fillRect(-11.5, 0.6, 23, 1.8);
  },
  plaque(c) {                         // 木の看板
    c.strokeStyle = '#8a6a4a'; c.lineWidth = 0.5; c.beginPath(); c.moveTo(-8, -20); c.lineTo(-8, -28); c.moveTo(8, -20); c.lineTo(8, -28); c.stroke();
    c.fillStyle = '#7a4a22'; c.fillRect(-12.5, -20.5, 25, 11);

const Snd = (() => {
  let ac = null, master = null, noiseBuf = null, bus = null;   // bus：見せ場の音の出口（早送りで一気に止められる）

  const live = [];     // 鳴っている音の終わる時刻（同時に鳴りすぎたら新しい音を間引く）
  const MAX_VOICES = 36;

      tone(f * 0.5, t, 0.2, { gain: v * 0.6, f2: f * 0.42 });

        noise(t + 0.08, 0.2, { type: 'highpass', f: 2500, q: 0.7, gain: 0.14 });
      } else if (name === 'whoosh') {    // 屋根が飛ぶ：ヒュオーッ
        noise(t, 0.55, { f: 400, f2: 2800, q: 1.2, gain: 0.22 });
      } else if (name === 'collapse') {  // 崩れる：ガラガラ
        noise(t, 0.8, { type: 'lowpass', f: 1400, f2: 180, q: 0.8, gain: 0.34 });
        noise(t + 0.15, 0.5, { f: 700, f2: 250, q: 0.9, gain: 0.18 });
        tone(80, t, 0.5, { gain: 0.3, f2: 36 });
      } else if (name === 'topple') {    // 倒れる：ズシン
        tone(70, t, 0.3, { gain: 0.28, f2: 32 });
        noise(t, 0.2, { type: 'lowpass', f: 600, q: 0.7, gain: 0.18 });
      } else if (name === 'rumble') {    // 地響き
        tone(46, t, 0.9, { gain: 0.3, f2: 30, attack: 0.08 });
        noise(t, 0.9, { type: 'lowpass', f: 140, q: 0.7, gain: 0.26 });
      } else if (name === 'mountain') {  // 山が割れる：ゴゴゴッ
        tone(55, t, 1.0, { gain: 0.4, f2: 28, attack: 0.1 });
        noise(t, 1.0, { type: 'lowpass', f: 300, f2: 90, q: 0.8, gain: 0.34 });
        noise(t + 0.1, 0.3, { f: 2000, f2: 500, q: 0.8, gain: 0.16 });
      } else if (name === 'crash') {
        noise(t, 0.5, { f: 1800, f2: 300, q: 0.7, gain: 0.26 });
        tone(110, t, 0.4, { gain: 0.3, f2: 40 });
      } else if (name === 'wah') {       // 失敗：しょんぼり（ぼよーん）
        tone(392, t, 0.55, { type: 'triangle', gain: 0.16, f2: 196 });
        tone(370, t + 0.02, 0.55, { type: 'triangle', gain: 0.08, f2: 180 });
      } else if (name === 'clap') {      // まばらな拍手：パチ…
        noise(t, 0.05, { type: 'highpass', f: 2200, q: 0.8, gain: 0.2 });
        noise(t + 0.18, 0.05, { type: 'highpass', f: 2600, q: 0.8, gain: 0.14 });
        noise(t + 0.33, 0.05, { type: 'highpass', f: 2000, q: 0.8, gain: 0.1 });
      } else if (name === 'crowd') {     // どよめき：おおお
        noise(t, 0.7, { f: 520, f2: 760, q: 2.2, gain: 0.2 });
        noise(t + 0.03, 0.7, { f: 900, f2: 1250, q: 2.6, gain: 0.12 });
        noise(t + 0.06, 0.6, { f: 330, f2: 420, q: 2, gain: 0.14 });
      } else if (name === 'run') {       // 逃げる足音：タタタタ
        for (let i = 0; i < 6; i++) noise(t + i * 0.09, 0.04, { type: 'lowpass', f: 700, q: 0.8, gain: 0.12 });
      } else if (name === 'gong') {      // 破門：ゴォーン
        this.gongAt(t, 1);
      } else if (name === 'rise') {      // カメラが空へ引く：ヒュイーン
        tone(220, t, 0.7, { gain: 0.14, f2: 1400, attack: 0.1 });
        noise(t, 0.7, { f: 600, f2: 3000, q: 1.2, gain: 0.1 });
      } else if (name === 'rift') {      // 大陸に地割れ：ゴゴゴ＋ピシピシ
        noise(t, 0.6, { type: 'lowpass', f: 260, f2: 80, q: 0.8, gain: 0.3 });
        for (let i = 0; i < 5; i++) noise(t + i * 0.09, 0.05, { type: 'highpass', f: 3000, q: 0.8, gain: 0.14 });
        tone(50, t, 0.7, { gain: 0.3, f2: 30, attack: 0.08 });
      } else if (name === 'quake') {     // 大陸が割れて開く：どどーん
        tone(40, t, 1.4, { gain: 0.5, f2: 24, attack: 0.02 });
        noise(t, 1.2, { type: 'lowpass', f: 500, f2: 60, q: 0.7, gain: 0.4 });
        noise(t, 0.3, { f: 2200, f2: 300, q: 0.7, gain: 0.2 });
      } else if (name === 'space') {     // 宇宙の静けさ：きらーん（ほとんど無音）
        tone(1320, t, 1.2, { gain: 0.04, attack: 0.3 });
        tone(1976, t + 0.15, 1.0, { gain: 0.03, attack: 0.3 });
      } else if (name === 'earthcrack') { // 静けさのあと：ピシピシッ、どおぉん
        for (let i = 0; i < 6; i++) noise(t + i * 0.05, 0.05, { type: 'highpass', f: 2500 + i * 300, q: 0.8, gain: 0.2 });
        tone(36, t + 0.05, 1.6, { gain: 0.5, f2: 22, attack: 0.02 });
        noise(t + 0.05, 1.3, { type: 'lowpass', f: 400, f2: 50, q: 0.7, gain: 0.4 });
      } else if (name === 'earthsplit') { // 地球が割れる：どごおおおん
        tone(30, t, 2.2, { gain: 0.5, f2: 20, attack: 0.02 });
        noise(t, 2.0, { type: 'lowpass', f: 800, f2: 40, q: 0.7, gain: 0.42 });
        noise(t, 0.6, { f: 3000, f2: 200, q: 0.7, gain: 0.22 });
        tone(60, t, 1.6, { type: 'sawtooth', gain: 0.12, f2: 28 });
      } else if (name === 'twinkle') {   // 割れたあとのきらきら
        tone(1568, t, 0.5, { type: 'triangle', gain: 0.06 });
        tone(2093, t + 0.12, 0.5, { type: 'triangle', gain: 0.05 });
      } else if (name === 'crater') {    // どーん
        tone(72, t, 1.1, { gain: 0.5, f2: 26, attack: 0.01 });
        noise(t, 1.2, { type: 'lowpass', f: 1000, f2: 70, q: 0.7, gain: 0.4 });
        noise(t, 0.3, { f: 2500, f2: 400, q: 0.7, gain: 0.2 });
      }
    },
    // ゴング（k：音の高さの倍率。段階が高いほど低く）
    gongAt(t, k) {
      tone(98 * k, t, 1.8, { gain: 0.3, f2: 92 * k, attack: 0.01 });
      tone(196 * k, t, 1.5, { type: 'triangle', gain: 0.14, f2: 190 * k, attack: 0.01 });
      tone(312 * k, t, 1.1, { type: 'sine', gain: 0.08, attack: 0.01 });
      noise(t, 0.12, { f: 1800, q: 0.9, gain: 0.12 });
    },
    // 認定証が出る音：太鼓のどん＋段階が高いほど明るい鈴（破門はゴング、出直しはしょんぼり）
    cert(stage) {
      if (!ac) return; const t = now();
      if (stage >= 7) { this.gongAt(t, 1 - (stage - 7) * 0.1); return; }
      if (stage === 0) return;
      tone(110, t, 0.3, { gain: 0.38, f2: 55 });
      noise(t, 0.05, { f: 1400, q: 0.9, gain: 0.14 });
      const f = 523 * Math.pow(2, stage * 1.5 / 12);
      tone(f, t + 0.12, 0.5, { type: 'triangle', gain: 0.09 });
      tone(f * 1.5, t + 0.2, 0.5, { type: 'triangle', gain: 0.07 });
    },
  };
})();
// ===== 操作・ループ・結果 =====
let shownResult = false, last = 0, cueI = 0, capKey = '';

function setCall(text) {
  const el = $('call');
  el.textContent = text;
  el.classList.remove('on');
  void el.offsetWidth;   // アニメーションを最初から
  el.classList.add('on');
}

// 画面どこでもタップ／スペース・Enter。タイトルで開始、結果で再挑戦、連打中は 1 回
function press() {
  Snd.init();
  if (Game.mode === 'title') { Game.begin(); return; }
  if (Game.mode === 'show') { Game.skip(); return; }   // 見せ場はタップで早送り
  if (Game.mode === 'over') { if (Game.canRetry()) retry(); return; }
  Game.tap();
}

// 段階ごとの大きな文字（言葉の途中では改行しない：「、」の後ろで区切る）
function setCap(text) {
  const el = $('cap'), parts = text.split(/(?<=、)/);
  el.innerHTML = parts.map(p => '<span class="nb">' + p + '</span>').join('');
  el.style.fontSize = Math.min(17, 86 / text.length) + 'cqw';
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}
function hideCap() { $('cap').classList.remove('on'); }

function bindUI() {
  cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });   // マルチタッチは指ごとに 1 回
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (!acceptKey(e)) { if (e.key === ' ' || e.key === 'Enter') e.preventDefault(); return; }
    e.preventDefault();
    press();
  });
  $('again').addEventListener('click', () => { if (Game.canRetry()) retry(); $('again').blur(); });
  $('share').addEventListener('click', () => { share(); $('share').blur(); });
  // ダブルタップ拡大・ピンチを止める（iOS）。認定証の中のボタンは普通に押せるように
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault());
  const inCert = e => !!(e.target && e.target.closest && e.target.closest('#cert'));
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => { const n = Date.now(); if (!inCert(e) && n - lastTouchEnd < 350) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
  document.addEventListener('touchmove', e => { if (!inCert(e)) e.preventDefault(); }, { passive: false });
  window.addEventListener('resize', () => { resize(); if (shownResult) layoutCert(); });
}

function retry() {
  Game.reset();
  shownResult = false;
  resetVisual();
  $('cert').classList.remove('show', 'ready'); RESL.on = false;
  $('call').classList.remove('on'); hideCap(); capKey = '';
  Game.begin();   // 再挑戦はそのまま「はじめ」から
}

// ---- 結果：段位認定証（最高段階は破門状）----
let REC = loadRec();   // 自己ベストと見た段階（保存できないときはこの中だけで動く）
const nbs = parts => parts.map(p => '<span class="nb">' + p + '</span>').join('');

const sealText = S => (S >= 10 ? '宇宙' : S === 9 ? '出禁' : S === 8 ? '永久' : S === 7 ? '破門' : S === 0 ? '再審' : '師範');   // 認定証の印
function fillCert(S, n, r) {
  const el = $('cert'), ban = S >= 7, rank = rankFor(S);
  el.classList.toggle('ban', ban);
  $('cTitle').textContent = certTitle(S);
  $('cRank').textContent = rank; $('cRank').style.fontSize = (rank.length >= 4 ? 11.5 : 14) + 'cqw';
  $('cSeal').textContent = sealText(S);
  $('cStage').innerHTML = nbs(CFG.stageNames[S].split(' '));
  $('cVerdict').innerHTML = nbs(VERDICTS[S]);
  $('cTiles').textContent = tileText(S);
  $('cCount').textContent = n;
  $('cNewC').style.display = r.newCount ? '' : 'none';
  $('cBest').innerHTML = nbs(['自己ベスト', stageLabel(REC.bestStage) + '・' + REC.bestCount + ' 回' + (r.newStage || r.newCount ? '（更新！）' : '')]).replace('</span><span', '</span>　<span');
  $('cSeenH').textContent = '見た段階　' + seenCount(REC) + ' / ' + NST;
  let h = '';
  for (let i = 0; i < NST; i++) {
    const seen = REC.seen[i], cls = 'chip' + (seen ? ' on' : '') + (i === S ? ' cur' : '') + (r.newSeen.indexOf(i) >= 0 ? ' nw' : '');
    h += '<span class="' + cls + '">' + (seen ? stageLabel(i) : '？？？') + '</span>';
  }
  $('cSeen').innerHTML = h;
}
// 認定証の幅・位置を決める（縦は下に、横は右に）。高さは中身で決まるので測ってから
function layoutCert() {
  const el = $('cert');
  el.style.width = '400px'; el.style.left = '0px'; el.style.top = '0px';
  const ratio = Math.max(0.6, el.offsetHeight / 400);
  const box = certBox(W, H, ratio);
  el.style.width = box.w + 'px';
  let h = el.offsetHeight;
  if (h > H - 24) {   // 文の折り返しで予想より高くなったら、画面に収まるよう幅を縮める
    const w = box.w * (H - 24) / h;
    el.style.width = w + 'px'; box.w = w; box.x = box.portrait ? (W - w) / 2 : W - w - 14; h = el.offsetHeight;
  }
  const y = box.portrait ? H - h - 14 : (H - h) / 2;
  el.style.left = box.x + 'px'; el.style.top = y + 'px';
  Object.assign(RESL, { on: true, portrait: box.portrait, x: box.x, y, w: box.w, h });
}
function showResult() {
  shownResult = true;
  $('call').classList.remove('on');
  const S = Game.stage(), n = Game.count;
  const r = applyResult(REC, S, n); REC = r.rec; saveRec(REC);
  fillCert(S, n, r);
  layoutCert();
  $('cert').classList.add('show');
  Snd.cert(S);
}

// ---- 共有（認定証のカード画像）----
function fitText(c, text, x, y, maxW, size, weight, color, align) {
  let sz = size;
  c.font = weight + ' ' + sz + 'px ' + FONT;
  while (c.measureText(text).width > maxW && sz > 18) { sz -= 2; c.font = weight + ' ' + sz + 'px ' + FONT; }
  c.fillStyle = color; c.textAlign = align || 'center'; c.textBaseline = 'alphabetic';
  c.fillText(text, x, y);
}
function makeShareImage() {
  return new Promise(resolve => {
    try {
      const Wd = 1080, Ht = 1350, S = Game.stage(), n = Game.count, ban = S >= 7;
      const cc = document.createElement('canvas');
      cc.width = Wd; cc.height = Ht;
      const c = cc.getContext('2d');
      c.fillStyle = ban ? '#2c2832' : '#e8d6a8'; c.fillRect(0, 0, Wd, Ht);
      // 今の画面の絵（本人のまわり）
      const px = 60, py = 60, pw = Wd - 120, ph = 580;
      c.save(); rr(c, px, py, pw, ph, 28); c.clip();
      c.fillStyle = '#bfe6ff'; c.fillRect(px, py, pw, ph);
      try {
        const free = RESL.on ? (RESL.portrait ? { w: W, h: RESL.y } : { w: RESL.x, h: H }) : { w: W, h: H };
        if (S >= 9) {   // 宇宙から見た地球は、認定証に隠れない範囲をそのまま入れる（切り取らない）
          c.fillStyle = '#070b24'; c.fillRect(px, py, pw, ph);
          const k = cv.width / W, sc = Math.min(pw / free.w, ph / free.h), dw = free.w * sc, dh = free.h * sc;
          c.drawImage(cv, 0, 0, free.w * k, free.h * k, px + (pw - dw) / 2, py + (ph - dh) / 2, dw, dh);
        } else {
        const v = CAMV, sy0 = S >= 3 ? BY : GY, a = pw / ph;
        const sx = (KX + 1 - v.x0) * v.k, sy = (sy0 - 28 - v.y0) * v.k;
        const cw = Math.min(free.w, free.h * a), ch = cw / a;
        const x0 = clamp(sx - cw / 2, 0, Math.max(0, free.w - cw)), y0 = clamp(sy - ch / 2, 0, Math.max(0, free.h - ch));
        const k = cv.width / W;
        c.drawImage(cv, x0 * k, y0 * k, cw * k, ch * k, px, py, pw, ph);
        }
      } catch (_) { /* 絵が取れなくても文字のカードは作る */ }
      c.restore();
      c.strokeStyle = ban ? '#8a8070' : '#7a4a22'; c.lineWidth = 10; rr(c, px, py, pw, ph, 28); c.stroke();
      // 認定証
      const ty = 670, th = Ht - ty - 60;
      c.fillStyle = ban ? '#f3eee2' : '#fffaf0'; c.strokeStyle = ban ? '#26222a' : '#7a4a22'; c.lineWidth = 12;
      rr(c, 60, ty, Wd - 120, th, 26); c.fill(); c.stroke();
      const ink = ban ? '#26222a' : '#7a1f1a';
      fitText(c, certTitle(S), Wd / 2, ty + 92, 700, 66, '900', ink);
      c.fillStyle = ban ? '#26222a' : '#c9a15a'; c.fillRect(140, ty + 116, Wd - 280, 5);
      c.textAlign = 'left'; c.font = 'bold 36px ' + FONT; c.fillStyle = '#7a6a58'; c.fillText('挑戦者 殿', 140, ty + 176);
      fitText(c, rankFor(S), 140, ty + 316, 560, 150, '900', ban ? '#26222a' : '#c8321f', 'left');
      c.save(); c.translate(Wd - 220, ty + 250); c.rotate(-0.24);
      c.strokeStyle = ban ? '#26222a' : '#c8321f'; c.lineWidth = 10; c.beginPath(); c.arc(0, 0, 88, 0, 6.283); c.stroke();
      fitText(c, sealText(S), 0, 22, 120, 62, '900', ban ? '#26222a' : '#c8321f');
      c.restore();
      fitText(c, '「' + stageLabel(S) + '」', Wd / 2, ty + 430, 800, 88, '900', '#2b2b3a');
      fitText(c, '割った瓦 ' + tileText(S), Wd / 2, ty + 510, 800, 48, 'bold', '#3a2a1c');
      fitText(c, '連打 ' + n + ' 回', Wd / 2, ty + 570, 800, 54, 'bold', '#c8321f');
      fitText(c, '自己ベスト ' + stageLabel(REC.bestStage) + '・' + REC.bestCount + ' 回　見た段階 ' + seenCount(REC) + '/' + NST, Wd / 2, ty + 625, 840, 36, 'bold', '#7a6a58');
      fitText(c, CFG.shareUrl, Wd / 2, Ht - 80, 860, 34, 'normal', ban ? '#d8d0c0' : '#5a3d1e');
      cc.toBlob(b => resolve(b), 'image/png');
    } catch (_) { resolve(null); }
  });
}
async function share() {
  const S = Game.stage(), text = shareText(S, Game.count), url = CFG.shareUrl;
  if (useWebShare(navigator.userAgent, navigator.maxTouchPoints) && navigator.share) {
    try {
      const blob = await makeShareImage();
      const file = blob ? new File([blob], 'kawarawari.png', { type: 'image/png' }) : null;
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ text, url, files: [file] });
      else await navigator.share({ text, url });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }
  window.open(tweetUrl(text, url), '_blank', 'noopener');
}

// ゲームの出来事を、見た目と音の反応にする
function reactToEvents() {
  for (const e of Game.events) {
    if (e.type === 'ready') {
      $('title').classList.add('hide');
      setCall('はじめ'); Snd.hajime();
    } else if (e.type === 'start') {
      $('call').classList.remove('on');
    } else if (e.type === 'hit') {
      Snd.taiko(e.count);
      if (e.tierUp) Snd.tier(e.tier);
      onHit(e);
    } else if (e.type === 'end') {
      setCall('せいっ'); Snd.sei();
    } else if (e.type === 'show') {      // 瓦に届いた：見せ場の始まり
      $('call').classList.remove('on'); cueI = 0; capKey = '';
      Snd.showBegin(); onSlam();
    } else if (e.type === 'over') {
      Snd.showEnd(!!e.skipped); hideCap();
    }
  }
  Game.events.length = 0;
}

// 見せ場の音の合図と大きな文字
function playShow() {
  const sh = Game.show;
  if (Game.mode !== 'show' || !sh) return;
  while (cueI < sh.cues.length && sh.cues[cueI].t <= Game.showT) Snd.cue(sh.cues[cueI++].s);
  const i = captionAt(sh, Game.showT), key = i < 0 ? '' : sh.caps[i].text;
  if (key !== capKey) { capKey = key; if (key) setCap(key); }
}

function updateHud() {
  const m = Game.mode, playing = m === 'play', show = m === 'ready' || playing || m === 'finish';
  const rem = m === 'ready' ? CFG.duration : Game.remaining();
  $('tLeft').textContent = rem.toFixed(1);
  $('hudTop').classList.toggle('on', show);
  $('hudTop').classList.toggle('low', playing && rem <= 1.5);
  $('hudBot').classList.toggle('on', show);
  $('cNum').textContent = Game.count;
}

function frame(ts) {
  const dt = last ? Math.min((ts - last) / 1000, 0.1) : 0;
  last = ts; nowT += dt;
  Game.step(dt);
  reactToEvents();
  playShow();
  if (Game.mode === 'over' && !shownResult && Game.overT >= CFG.certDelay) showResult();
  if (shownResult && Game.canRetry()) $('cert').classList.add('ready');
  updateHud();
  updateVisual(dt);
  render();
  requestAnimationFrame(frame);
}
Game.reset();
resize();
bindUI();
requestAnimationFrame(frame);
</script>
