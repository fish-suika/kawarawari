</head><body><h1>割りすぎ瓦割り 検証</h1><div id="out"></div>
<script>
// ===== 調整用の数値 =====
const CFG = {
  h: 1 / 120,            // 検証用の固定刻み
  readySecs: 0.6,        // 「はじめ」から連打の開始まで
  duration: 5,           // 連打の長さ（秒）。「はじめ」のあとに固定
  finishSecs: 0.16,      // 「せいっ」で腕を振り下ろして瓦に届くまで。そのあと見せ場
  retryWait: 1.0,        // 結果が出てから再挑戦を受け付けるまで（誤タップ防止。認定証を見せるので長め）
  certDelay: 0.6,        // 見せ場のあと、認定証を出すまで（見せ場の最後の画面を見せる時間）
  shareUrl: 'https://fish-suika.github.io/kawarawari/',
  maxPerSec: 25,         // 1秒に数える連打の上限（直近1秒の窓）
  tiles: 20,             // 積む瓦の枚数

  // 段階 i になる最低の連打数（段階 0〜10）。本人のテストプレイで調整。段階 8〜10 は本人の最終修正（2026-11-20）で追加
  levelAt: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60],   // 6 回ごと。毎秒 8 回強でクレーター、毎秒 12 回（両手の全力）で地球真っ二つ
  stageNames: ['ひびだけ', '瓦 数枚', '瓦 全部', '道場の床', '道場 全壊', '町内 全壊', '山 真っ二つ', 'クレーター', '大陸 真っ二つ', '地球に ひび', '地球 真っ二つ'],

  tierEvery: 6,          // 連打 6 回ごとにオーラが一段派手になる（下で levelAt[0] から上書き）
  maxTier: 10,

  // ---- Phase 2：破壊の見せ場 ----
  showSecs: [1.0, 1.2, 1.5, 2.1, 2.7, 3.2, 3.6, 4.0, 4.5, 4.8, 5.0],   // 段階ごとの見せ場の長さ（秒。高いほど長い。最高でも約 5 秒）
  showSpeed: [1, 1, 1, 1, 1, 1, 1, 1, 1.2, 1.4, 1.5],   // 見せ場の進む速さ。段階 8〜10 は中身が長いので少し速く進めて 5 秒に収める
  showMax: 5.0,          // 見せ場の長さの上限（秒）
  skipGrace: 0.4,        // 見せ場の最初の 0.4 秒はタップを早送りにしない（連打の指が残っているため）
  maxPieces: 400,        // 破片（砂ぼこり含む）の数の上限
  seed: 20261120,        // 乱数のシード（連打数を足して使う。同じ連打数なら同じ壊れ方）
  camAt: [0, 0, 0, 0.75, 1.5, 2.05, 2.6, 3.05, 3.9, 5.0, 6.4],          // 段階 k のカメラが引き始める時刻（見せ場の時刻の単位）
  camDur: [0, 0, 0, 0.45, 0.45, 0.45, 0.4, 0.45, 0.7, 0.8, 0.4],        // そのカメラが動く時間
  craterT: [3.15, 3.8],  // クレーターができ始める・できあがる時刻
  // 段階 8〜10（宇宙へ）の時刻 [始め, 終わり]。run：地割れが走る／open：大陸が左右に開く／close：開いた割れ目が細くなる（段階 9〜）
  // globe：地球の外見に切り替わる／ecr：地球のひびが広がる／split：地球が割れて離れる／world：町や山が見えなくなる
  sp: { run: [4.35, 4.8], open: [4.75, 5.15], close: [5.2, 5.8], globe: [5.3, 5.85], ecr: [5.75, 6.45], split: [6.5, 7.2], world: [5.3, 5.8] },
  showCaps: [            // 段階ごとの大きな文字 [文字, 出る時刻]
    ['……いたい', 0.2], ['瓦、数枚', 0.2], ['瓦、全部', 0.3], ['床、抜けた', 0.95],
    ['道場、全壊', 1.65], ['町内、全壊', 2.25], ['山、真っ二つ', 2.75], ['……クレーター', 3.3],
    ['大陸、真っ二つ', 4.8], ['地球に、ひび', 5.9], ['地球、真っ二つ', 6.6]],
};
CFG.tierEvery = CFG.levelAt[0];                       // オーラの段は段階と同じ区切り（6 回ごと）
CFG.topCount = CFG.levelAt[CFG.levelAt.length - 1];   // 最高段階の連打数。強さの伸びの上限に使う
// ===== ゲームのロジック（画面を使わない）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// 連打数 → 段階（0〜10）
function stageFor(count) {
  let s = 0;
  for (let i = 0; i < CFG.levelAt.length; i++) if (count >= CFG.levelAt[i]) s = i + 1;
  return s;
}
// 連打数 → オーラの段（段階と同じ区切りで一段）
function tierFor(count) { return Math.min(CFG.maxTier, Math.floor(count / CFG.tierEvery)); }

// キー入力を数えてよいか（スペース・Enter、押しっぱなしの連続入力は数えない）
function acceptKey(e) {
  if (e.repeat) return false;
  return e.key === ' ' || e.key === 'Enter' || e.code === 'Space';
}

const Game = {
  mode: 'title',   // title → ready → play → finish（せいっ）→ show（破壊の見せ場）→ over（結果）
  t: 0, readyT: 0, finT: 0, showT: 0, showR: 0, overT: 0, show: null,   // showT：見せ場の時刻（見せ場の単位）／showR：見せ場が始まってからの実際の秒数
  count: 0, hits: [],      // hits: 数えた時刻（直近1秒の窓の判定に使う）
  events: [],

  reset() {
    this.mode = 'title';
    this.t = 0; this.readyT = 0; this.finT = 0; this.showT = 0; this.showR = 0; this.overT = 0; this.show = null;
    this.count = 0; this.hits = [];
    this.events = [];
  },

  begin() {
    if (this.mode !== 'title') return;
    this.mode = 'ready'; this.readyT = 0;
    this.events.push({ type: 'ready' });
  },

  stage() { return stageFor(this.count); },
  tier() { return tierFor(this.count); },
  remaining() { return Math.max(0, CFG.duration - this.t); },
  // 見せ場を始める（届いた段階まで。壊れ方は連打数で決まるシード付き）
  startShow() {
    const st = this.stage();
    this.show = buildShow(st, CFG.seed + this.count);
    this.mode = 'show'; this.showT = 0; this.showR = 0;
    this.events.push({ type: 'show', stage: st });
  },
  // タップで早送り：見せ場の最初の skipGrace 秒は受け付けない。結果へ直ちに移る
  skip() {
    if (this.mode !== 'show' || this.showR < CFG.skipGrace) return false;
    this.showT = this.show.dur; this.mode = 'over'; this.overT = 0;
    this.events.push({ type: 'over', skipped: true });
    return true;
  },
  canRetry() { return this.mode === 'over' && this.overT >= CFG.retryWait; },

  // 連打 1 回。'hit' 数えた / 'limited' 速すぎて数えない / 'ignored' 受付外（はじめ前・締め切り後）
  tap() {
    if (this.mode !== 'play' || this.t >= CFG.duration - 1e-9) return 'ignored';
    const h = this.hits;
    while (h.length && this.t - h[0] >= 1 - 1e-9) h.shift();
    if (h.length >= CFG.maxPerSec) return 'limited';
    h.push(this.t);
    this.count++;
    this.events.push({ type: 'hit', count: this.count, tier: this.tier(), tierUp: this.count % CFG.tierEvery === 0 && this.count / CFG.tierEvery <= CFG.maxTier });
    return 'hit';
  },

  step(dt) {
    if (this.mode === 'ready') {
      this.readyT += dt;
      if (this.readyT >= CFG.readySecs) { this.mode = 'play'; this.t = 0; this.hits = []; this.events.push({ type: 'start' }); }
      return;
    }
    if (this.mode === 'play') {
      this.t += dt;
      if (this.t >= CFG.duration - 1e-9) {
        this.t = CFG.duration;
        this.mode = 'finish'; this.finT = 0;
        this.events.push({ type: 'end', count: this.count, stage: this.stage() });
      }
      return;
    }
    if (this.mode === 'finish') {
      this.finT += dt;
      if (this.finT >= CFG.finishSecs) this.startShow();
      return;
    }
    if (this.mode === 'show') {
      this.showR += dt;
      this.showT = Math.min(this.show.dur, this.showR * this.show.speed);
      if (this.showT >= this.show.dur - 1e-9) { this.showT = this.show.dur; this.mode = 'over'; this.overT = 0; this.events.push({ type: 'over' }); }
      return;
    }
    if (this.mode === 'over') this.overT += dt;
  },
};
// ===== 段位・記録・共有（画面を使わない）=====
// 段位。8〜10 は破門の先のおかしな段位（本人の最終修正 2026-11-20 で追加）
const RANKS = ['出直し', '初段', '二段', '三段', '四段', '五段', '名誉師範', '破門', '永久破門', '地球出禁', '宇宙破門'];
const NST = CFG.stageNames.length;   // 段階の数（11）
// 師範のひとこと（文節ごとに区切る。画面では文節の途中で改行しない）
const VERDICTS = [
  ['瓦が割れるまで、', '出直してまいれ'],
  ['右の者、', '瓦を割ったことを', '認める'],
  ['右の者、', '瓦を全部', '割ったことを', '認める'],
  ['右の者、', '道場の床まで', '割ったことを', '認める'],
  ['右の者、', '道場を', '全壊させたことを', '認める'],
  ['右の者、', '町内を', '全壊させたことを', '認める'],
  ['右の者、', '山まで', '割ったゆえ', '名誉師範とする'],
  ['右の者、', '割りすぎにつき', '破門とする'],
  ['右の者、', '大陸を', '真っ二つにしたゆえ', '永久に', '破門とする'],
  ['右の者、', '地球に', 'ひびを入れたゆえ', '地球への', '立ち入りを', '禁ずる'],
  ['右の者、', '地球を', '割りすぎたゆえ', '宇宙より', '破門とする'],
];

const rankFor = s => RANKS[clamp(s, 0, NST - 1)];
const certTitle = s => (s >= 7 ? '破門状' : '段位認定証');
const stageLabel = s => CFG.stageNames[clamp(s, 0, NST - 1)].replace(/ /g, '');      // 文章用（空白なし）
const tilesBroken = s => (s <= 0 ? 0 : s === 1 ? 5 : CFG.tiles);
const tileText = s => (s >= 2 ? CFG.tiles + ' 枚（と、その他）' : tilesBroken(s) + ' 枚');
// 見た段階：段階 0・1 はその結果に届いたとき、段階 2 以上は見せ場で順に見るので、届いた段階までの 2〜S
function seenFor(s) {
  const a = [];
  if (s <= 1) a.push(s); else for (let i = 2; i <= s; i++) a.push(i);
  return a;
}

// ---- 記録（自己ベストと見た段階）。保存できなくても動く ----
const REC_KEY = 'kawarawari.record.v1';
const emptyRec = () => ({ seen: new Array(NST).fill(0), bestStage: -1, bestCount: 0, plays: 0 });   // 古い保存データ（8 段階分）は足りない分を 0 にして読む
function cleanRec(x) {   // 壊れた保存データでも安全な形にそろえる
  const r = emptyRec();
  if (!x || typeof x !== 'object') return r;
  if (Array.isArray(x.seen)) for (let i = 0; i < NST; i++) r.seen[i] = x.seen[i] ? 1 : 0;
  const bs = Number(x.bestStage), bc = Number(x.bestCount), pl = Number(x.plays);
  r.bestStage = Number.isInteger(bs) && bs >= -1 && bs <= NST - 1 ? bs : -1;
  r.bestCount = Number.isFinite(bc) && bc >= 0 && bc < 1e6 ? Math.floor(bc) : 0;
  r.plays = Number.isFinite(pl) && pl >= 0 && pl < 1e9 ? Math.floor(pl) : 0;
  return r;
}
function safeStore() { try { return typeof localStorage === 'undefined' ? null : localStorage; } catch (_) { return null; } }
function loadRec(store) {
  try {
    const s = store === undefined ? safeStore() : store;
    if (!s) return emptyRec();
    const raw = s.getItem(REC_KEY);
    return raw ? cleanRec(JSON.parse(raw)) : emptyRec();
  } catch (_) { return emptyRec(); }
}
function saveRec(rec, store) {
  try {
    const s = store === undefined ? safeStore() : store;
    if (!s) return false;
    s.setItem(REC_KEY, JSON.stringify(rec));
    return true;
  } catch (_) { return false; }
}
// 1 回の結果を記録に足す。first：初めての挑戦（更新の表示は出さない）
function applyResult(rec, stage, count) {
  const prev = cleanRec(rec), next = cleanRec(rec), first = prev.plays === 0, seen = seenFor(stage);
  const newSeen = seen.filter(i => !prev.seen[i]);
  for (const i of seen) next.seen[i] = 1;
  next.plays = prev.plays + 1;
  const newStage = stage > prev.bestStage, newCount = count > prev.bestCount;
  if (newStage) next.bestStage = stage;
  if (newCount) next.bestCount = count;
  return { rec: next, first, newStage: newStage && !first, newCount: newCount && !first, newSeen };
}
const seenCount = rec => rec.seen.reduce((a, b) => a + (b ? 1 : 0), 0);

// ---- 共有 ----
function shareText(stage, count) {
  const nm = stageLabel(stage);
  let body;
  if (stage >= 8) body = '割りすぎ瓦割りで「' + rankFor(stage) + '」になりました。「' + nm + '」まで割った（連打 ' + count + ' 回）';
  else if (stage >= 7) body = '割りすぎ瓦割りで「破門」されました。' + nm + 'を作った（連打 ' + count + ' 回）';
  else if (stage === 0) body = '割りすぎ瓦割りで「出直し」と言われた……（連打 ' + count + ' 回）';
  else body = '割りすぎ瓦割りで「' + rankFor(stage) + '」に認定！「' + nm + '」まで届いた（連打 ' + count + ' 回）';
  return body + ' #瓦割り';
}
// スマホ（タッチ端末）は Web Share API、PC は X の投稿画面
function useWebShare(ua, touchPoints) {
  return /Android|iPhone|iPad|iPod/i.test(ua || '') || (/Macintosh/i.test(ua || '') && touchPoints > 1);
}
function tweetUrl(text, url) {
  return 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
}
// ===== 破壊の見せ場（画面を使わない：世界の配置・破片・カメラ・時刻）=====
// 世界の座標は「遊ぶ場所の幅 = 100」の単位。段階 0 の画面は x 0〜100・y 0〜177.78。y は下向き
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

const GY = 140, BY = 215;                              // 地面（道場の床）の高さ / 下の階の床の高さ
const KX = 38;                                         // 空手家の x
const TX = 74, TW = 30, TP = 3, TH = 2.7, TB = 128;    // 瓦の中心x・幅・ピッチ・厚み・台の上の y
const DL = -70, DR = 160;                              // 道場の内側の左右
const HX0 = -12, HX1 = 118;                            // 段階 3 で床が抜ける範囲
const PX = KX + 1;                                     // クレーターの中心x（本人の立つ場所）
const CR = { x: PX, R: 230, D: 300 };                  // クレーター（中心x・半径・深さ）。本人は穴のいちばん深い底に立つ（足場の柱はない：本人の依頼 2026-11-20）
const CFL = 70;                                        // 穴の底の平らな部分の半幅（本人の足が乗る）
const FLOOR_Y = GY + CR.D;                             // 穴の底の高さ（世界の y）
// ---- 段階 8〜10（宇宙へ。本人の最終修正 2026-11-20）：地球は半径 PR の円。中心の x は EX（地球が割れる線。クレーターの右の外）----
// 地面の (PX, GY)（クレーターの中心）が地球の表面に乗るよう、中心の y は cyOf(半径) で決める。本人のいるクレーターは左の半分に丸ごと乗る
const PR = 5200, EX = 295, EDX = EX - PX;
const cyOf = Re => GY + Math.sqrt(Re * Re - EDX * EDX);
const PCY = cyOf(PR);
const ANG0 = 0.07, SPLITD = 0.2 * PR, SPLITA = 0.05;  // 大陸が割れて開く角度／地球が割れて離れる距離・傾き
const MOON = { x: EX + 5950, y: PCY - 2300, r: 520 };   // びっくり顔の月
const STAR = { x: EX - 5900, y: PCY - 3300, r: 330 };   // びっくり顔の星
// 地球の表面に立つ小さな家と住人（中心から測った弧の長さ。割れても自分の側に乗ったまま万歳している）
const FOLK = [[-1950, 'man'], [-1700, 'house'], [-1400, 'man'], [-1100, 'house'], [-800, 'man'], [800, 'man'], [1100, 'house'], [1400, 'man'], [1700, 'house'], [1950, 'man']];
const GRAV = 700;
const DROP_T = 1.1;                                    // 床が抜けて、床に載っていた物が落ちる時刻
const FALL_T = 1.0;                                    // 本人が下の階へ落ち始める時刻

// 段階ごとのカメラ（見たい範囲の中心と大きさ。画面の縦横比に合わせて倍率を決める）
const BASE_CAM = { cx: 50, cy: 88.89, w: 100, h: 177.78 };
const CAMS = [BASE_CAM, BASE_CAM, BASE_CAM,
  { cx: 50, cy: 128, w: 150, h: 225 },       // 3 床が抜ける・下の階
  { cx: 0, cy: 85, w: 440, h: 300 },         // 4 道場の建物（外へ逃げた門下生も入る）
  { cx: 45, cy: 60, w: 760, h: 420 },        // 5 町内
  { cx: 45, cy: 15, w: 800, h: 470 },        // 6 裏山
  { cx: 39, cy: 215, w: 820, h: 560 },       // 7 クレーター
  { cx: (PX + EX) / 2, cy: 640, w: 4200, h: 3000 },   // 8 地平線が丸く見える高さ（大陸が裂ける。クレーターと割れ目の間が真ん中）
  { cx: EX, cy: PCY, w: 13200, h: 13200 },   // 9 宇宙から見た地球の全体
  { cx: EX, cy: PCY, w: 13200, h: 13200 }];  // 10 地球が割れて離れる
// 各段階で「画面に入っていてほしい範囲」（検証でカメラが覆っているか確かめる）
const EXTENT = [
  { x0: 10, x1: 100, y0: 60, y1: 150 }, { x0: 10, x1: 100, y0: 60, y1: 150 }, { x0: 10, x1: 100, y0: 60, y1: 150 },
  { x0: -12, x1: 118, y0: 60, y1: 225 },
  { x0: -92, x1: 182, y0: -42, y1: 225 },
  { x0: -300, x1: 365, y0: 60, y1: 225 },
  { x0: -260, x1: 350, y0: -210, y1: 225 },
  { x0: CR.x - CR.R, x1: CR.x + CR.R, y0: 60, y1: GY + CR.D },
  { x0: PX - 1900, x1: PX + 1900, y0: -300, y1: 1400 },
  { x0: EX - PR - 300, x1: EX + 6500, y0: GY - 300, y1: GY + 2 * PR + 300 },
  { x0: EX - PR - 300 - SPLITD, x1: EX + PR + 300 + SPLITD, y0: GY - 300, y1: GY + 2 * PR + 300 }];
// 裏山（左半分・右半分。ぎざぎざの稜線）
const MT_L = [-260, 140, -190, 50, -130, -40, -85, -95, -40, -150, 10, -185, 45, -210, 45, 140];
const MT_R = [45, -210, 80, -170, 135, -110, 190, -40, 255, 40, 350, 140, 45, 140];
const STRATA = [[GY, '#86d06a'], [GY + 7, '#dcb47c'], [190, '#cb985e'], [255, '#bb8761'], [330, '#aa876c'], [400, '#c2a88e'], [470, '#98795f'], [560, '#806853'], [700, '#6e5a4c']];

// ---- 道場の人たち（師範・門下生）と、避難した住人。位置と動作は時刻だけで決まる ----
const CAST = [
  { id: 'm', role: 'master', x: 8, s: 1.12 },
  { id: 's1', role: 'student', x: 18.5, s: 0.95, belt: '#e8c23a', kneel: true },
  { id: 's2', role: 'student', x: -5, s: 1.0, belt: '#5fb36a' },
  { id: 's3', role: 'student', x: -14, s: 0.95, belt: '#e07a5f' },
  { id: 's4', role: 'student', x: -24, s: 1.0, belt: '#5f8fe0' },
];
const FLEE_T = 0.62;                        // 床が抜ける前に、門下生が外へ逃げ始める時刻
const fleeX = i => -165 - 7 * i;            // 逃げた先（道場の外。崩れた物が落ちる範囲より外）
const HILLS = [{ x: -300, w: 62, h: 58 }, { x: 380, w: 62, h: 58 }];   // 住人が避難した高台（倒れた家より高い）

// 段階ごとの吹き出し（誰が・何と・いつから・いつまで）。最後の吹き出しは結果のあとも残る

// 吹き出しの出どころ（頭の上の世界座標）。見えない・まだいないときは null
function bubbleSpot(who, S, t, k) {

// 結果の認定証（DOM）の置き場所。画面 W×H px、認定証の縦横比 ratio（高さ/幅）

    const pad = 14, w = Math.min(W - pad * 2, 440, H * 0.6 / ratio), h = w * ratio;

// 認定証より上に見せたい一番下／一番上の高さ（世界の y）。クレーターの段階は穴の底まで、ほかは本人の足もと（影まで）。段階 8 は穴の底のまま左の半分が傾くぶんの余裕つき（段階 9〜10 は resultFit で地球ぜんぶを収める）

const resultTop = S => (S >= 9 ? GY - PR * 0.05 : S === 8 ? GY - 500 : (S >= 3 ? BY : GY) - 64);
// 段階 9〜10 の結果の絵：地球ぜんぶ（割れて離れた二つの半分・月と星）と、本人の光の輪・残る吹き出しが、認定証を避けた空きに収まるよう
// 縮め／広げ（z。上限 1.35）、空きの真ん中へずらす（x, y は画面 px）。地球のてっぺんの上には FIT_TOP px（光の輪・吹き出しの高さ）を空ける
const FIT_TOP = 50;

// 認定証が出るとき、見せ場の最後の絵が認定証にかぶらないよう絵をずらす量（画面 px。負＝上／左へ）。cam は見せ場の最後のカメラ

// ---- 段階 8〜10：宇宙へ ----
// 見せ場の長さ（見せ場の単位）。段階 8〜10 は少し速く進めて、実際の秒数を showSecs に収める
const showDur = S => CFG.showSecs[S] * CFG.showSpeed[S];
// カメラの幅から「地面が丸くなる度合い」（0：平ら 〜 1：地球の円）
const epsFor = w => smooth((Math.log(w) - Math.log(1500)) / (Math.log(4200) - Math.log(1500)));

// 本人の光の輪の強さ・大きさ、引いたときに本人を大きく見せる倍率（見つけられる大きさ・穴の底に収まる大きさ）
const HERO_MAX = 10;

  if (S >= 8) sc = Math.max(sc, Math.min(HERO_MAX, 24 / (31 * k)));

// 乱数（シード付き。同じシードなら同じ壊れ方）
function mkRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

// カメラが見ている世界の範囲（画面 W×H px に収める倍率 k = px/世界単位）
function viewFor(cam, W, H) {
  const k = Math.min(W / cam.w, H / cam.h), hw = W / (2 * k), hh = H / (2 * k);
  return { k, x0: cam.cx - hw, x1: cam.cx + hw, y0: cam.cy - hh, y1: cam.cy + hh };

// 見せ場の時刻 t のカメラ（段階が上がるたびに一段引く）
function camAt(S, t) {
  let a = BASE_CAM, b = BASE_CAM, u = 1;
  for (let k = 3; k <= S; k++) {
    if (t < CFG.camAt[k]) break;
    a = CAMS[k - 1]; b = CAMS[k]; u = smooth((t - CFG.camAt[k]) / CFG.camDur[k]);
  }
  const lg = (p, q) => Math.exp(lerp(Math.log(p), Math.log(q), u));
  return { cx: lerp(a.cx, b.cx, u), cy: lerp(a.cy, b.cy, u), w: lg(a.w, b.w), h: lg(a.h, b.h) };

// クレーターの進み具合（0〜1）
function craterAt(S, t) {

}
// 地面の上端（クレーターで掘れた後）。真ん中の底（半幅 CFL）が平らで、本人はそこに立つ。まわりは外へ向かって浅くなる
function craterTop(x, cp) {
  const u = (Math.abs(x - CR.x) - CFL) / (CR.R - CFL);

  return GY + cp * CR.D * (u <= 0 ? 1 : Math.pow(1 - u * u, 0.75));

// 画面の揺れ（px）・光（0〜）

// 今出す大きな文字（出ていなければ -1）
function captionAt(sh, t) {

}

// 空手家の動き：腕の目標・顔・落ちる高さ
function karaAt(sh, t) {
  const S = sh.stage, o = { dy: 0, dx: 0, tx: 61, ty: 65, face: 'serious' };
  if (S === 0) {            // 手を押さえて悶える
    const e = smooth((t - 0.12) / 0.25);
    o.tx = lerp(61, KX + 9, e); o.ty = lerp(65, 105, e); o.face = 'pain';
    if (t > 0.3) { o.dx = Math.sin(t * 48) * 0.7; o.dy = -Math.abs(Math.sin((t - 0.3) * 13)) * 1.8; }

  const k = karaAt({ stage: S }, t), sp = S >= 8 ? spaceAt(S, t) : NOSP;

// ---- 破片 ----
// 着地までの時間（床に届かないなら Infinity）
function landT(p) {

  return Math.max(0, (-p.vy + Math.sqrt(d)) / GRAV);

// 時刻 t の破片の姿勢を o に書く（位置 x,y・角度 a・透明度 al・大きさ s）。式だけで決まるので早送りでも飛ばない

    if (p.kind === 'puff') {

// 家の窓・ドアの飾り（箱の中心が原点。[x, y, w, h, 色] の長方形を順に描く）
function houseDec(w, h) {
  const d = [], win = (x, y, ww, hh) => {
    d.push([x - 0.7, y - 0.7, ww + 1.4, hh + 1.4, '#9a7048'], [x, y, ww, hh, '#d4f0ff'],

// 段階 S までの見せ場を作る。S より上の物は壊れずに（tb = Infinity）そのまま置いてある
function buildShow(S, seed) {
  const R = mkRng(seed), RG = mkRng(CFG.seed + 99);   // R：飛び方（連打数で変わる） RG：形・切れ目（いつも同じ）

  const P = [], cues = [], shakes = [], flashes = [];
  const cue = (t, s) => { if (isFinite(t)) cues.push({ t, s }); };
  const shake = (t, a, d) => { if (isFinite(t)) shakes.push({ t, a, d }); };
  const flash = (t, a) => { if (isFinite(t)) flashes.push({ t, a }); };

  // 段階 9・10 の結果画面：地球ぜんぶ（割れた二つの半分）・月と星・本人（光の輪つき）・残る吹き出しが、画面内で認定証と重ならない
  // （描画と同じ式：画面 x = W/2 + (世界 x − カメラ中心) × 倍率 + ずらし）。第 6 回までは 697×787 のような画面で、上の吹き出しと本人が上端で切れていた
  const fitScr = [[390, 844], [375, 812], [375, 667], [360, 640], [412, 915], [697, 787], [768, 1024], [600, 1200], [844, 390], [1024, 768], [1280, 720], [1950, 1135], [1920, 1080], [2560, 1080]];
  const fitBad = [], gaps = [];
  for (const [w, h] of fitScr) for (const st of [9, 10]) {
    const cam = camAt(st, showDur(st)), box = certBox(w, h, 1.5), sft = resultShift(st, cam, w, h, box), kk = viewFor(cam, w, h).k * sft.z;
    const X = wx => w / 2 + (wx - cam.cx) * kk + sft.x, Y = wy => h / 2 + (wy - cam.cy) * kk + sft.y, tag = w + 'x' + h + ' 段階' + st + ' ';
    const free = box.portrait ? { x0: 0, x1: w, y0: 0, y1: box.y } : { x0: 0, x1: box.x, y0: 0, y1: h };
    const inFree = (x0, y0, x1, y1, what) => { if (x0 < free.x0 - 0.5 || x1 > free.x1 + 0.5 || y0 < free.y0 - 0.5 || y1 > free.y1 + 0.5) fitBad.push(tag + what + '（' + [x0, y0, x1, y1].map(Math.round).join(',') + '）'); };
    const sdx = st >= 10 ? SPLITD : 0;
    inFree(X(EX - PR - sdx), Y(GY - 6), X(EX + PR + sdx), Y(PCY + PR), '地球');
    inFree(X(MOON.x - MOON.r), Y(MOON.y - MOON.r), X(MOON.x + MOON.r), Y(MOON.y + MOON.r), '月');
    inFree(X(STAR.x - STAR.r), Y(STAR.y - STAR.r), X(STAR.x + STAR.r), Y(STAR.y + STAR.r), '星');
    const sp = spaceAt(st, showDur(st)), ft = heroFeet(st, showDur(st)), sc = heroScale(st, kk), hr = Math.max(34 * kk, 36);   // 光の輪の画面での半径
    inFree(X(ft.x) - hr, Y(ft.y - 27) - hr, X(ft.x) + hr, Y(ft.y - 27) + hr, '本人の光の輪');
    inFree(X(ft.x) - 17 * sc * kk, Y(ft.y) - 31 * sc * kk, X(ft.x) + 17 * sc * kk, Y(ft.y), '本人');
    for (const b of bubblesFor(st)) {
      if (b.t1 !== Infinity) continue;
      const q = bubbleSpot(b.who, st, showDur(st), kk), bw = b.text.length * 14 + 18, hh = 27 + 9;
      inFree(Math.max(0, Math.min(X(q.x) - bw / 2, free.x1 - 6 - bw)), Y(q.y) - hh, Math.max(bw + 6, Math.min(X(q.x) + bw / 2, free.x1 - 6)), Y(q.y), '吹き出し「' + b.text + '」');
    }
    if (st === 10) gaps.push(2 * SPLITD * kk);
    if (box.portrait ? Y(PCY + PR) > box.y - 2 : X(EX + PR + sdx) > box.x - 2) fitBad.push(tag + '地球が認定証にかぶる');
  }
  check(fitScr.length + ' 種類の画面（縦 375×812・697×787 ほか、横・PC）の段階 9・10 の結果で、地球の円・月と星・本人と光の輪・残る吹き出しがすべて画面内、かつ認定証と重ならない', fitBad.length === 0, fitBad.slice(0, 4).join(' / ') || fitScr.length + ' 種類 × 2 段階');
  check('段階 10 の結果：二つに離れた隙間が画面ではっきり見える（どの画面でも 24px 以上）', gaps.length === fitScr.length && Math.min(...gaps) >= 24, '最小 ' + Math.min(...gaps).toFixed(0) + 'px');

  // 崩れた物（屋根・壁・柱・床板・台）が、本人の足もとに縦に立ったり重なったりしない
  const ZC0 = KX + 8, ZR0 = 36;
  let zoneBad = [], tallBad = [], roofMax = 0, pillarBad = 0, angBad = 0, nBig = 0;
  for (let st = 3; st <= 10; st++) for (const sd of [11, 222, 3333, 44444]) {
    const sh = buildShow(st, sd + st);
    for (const p of sh.pieces) {
      if (!isFinite(p.tb) || !(p.g === 'dojo' || p.g === 'slab' || p.g === 'stand') || !isFinite(p.tl)) continue;
      nBig++;
      const xl = p.x + p.vx * (p.tl + 0.06);
      if (Math.abs(xl - ZC0) < ZR0 + p.ex - 0.5) zoneBad.push('段階' + st + ' ' + p.g + ' 着地 x=' + xl.toFixed(0) + ' 半幅' + p.ex.toFixed(0));
      if (p.edge === '#8a3a2a') roofMax = Math.max(roofMax, p.hh * 2);
      if (2 * p.hh > 40.5) tallBad.push('段階' + st + ' ' + p.g + ' 高さ' + (2 * p.hh).toFixed(0));
      if (st >= 7) { const o2 = poseAt(p, sh.dur + 3, { x: 0, y: 0, a: 0, al: 1, s: 1 }); if (o2.al > 0.02 && Math.abs(o2.x - CR.x) < CR.R * 0.9 && o2.y > GY + 5) pillarBad++; }   // 穴の中に残る破片
      const o = poseAt(p, sh.dur + 3, { x: 0, y: 0, a: 0, al: 1, s: 1 });   // 結果のあと（着地して落ち着いた姿勢）
      if (p.lie ? Math.abs(Math.cos(o.a)) > 0.02 : Math.abs(Math.sin(o.a)) > 0.02) angBad++;
    }
  }
  check('段階 3〜10 のどの見せ場でも、崩れた物は本人の足もと（x=' + ZC0 + ' の左右 ' + ZR0 + '＋物の幅）に着地しない', zoneBad.length === 0 && nBig > 500, zoneBad.slice(0, 3).join(' / ') || '対象 ' + nBig + ' 個');
  check('崩れた物は着地して横になる（縦に立ったまま止まらない）：落ち着いた向きが、背の低い向き（長い辺が横）', angBad === 0, 'bad=' + angBad);
  check('屋根は薄い板に分かれて飛ぶ（1 枚の高さ ' + roofMax.toFixed(1) + ' 以下）。着地して立つ高さは壁でも ' + 40 + ' 以下', roofMax > 0 && roofMax <= 14.5 && tallBad.length === 0, tallBad.slice(0, 3).join(' / '));
  check('段階 7〜10：穴の中（本人の立つ底・壁）に、屋根・柱・壁・床板の破片が残らない（穴の底は本人だけ）', pillarBad === 0, 'bad=' + pillarBad);
  const roofN = st => buildShow(st, 5).pieces.filter(p => p.edge === '#8a3a2a').length;
  check('屋根の板の数は 20〜60 枚で、全段階の破片の合計が上限（' + CFG.maxPieces + '）以内', roofN(4) >= 20 && roofN(4) <= 60 && ALLS.every(st => buildShow(st, 5).pieces.length <= CFG.maxPieces), roofN(4) + ' 枚');
  startPlay(); Game.count = TOP; advance(CFG.duration + 0.01); while (Game.mode === 'finish') Game.step(CFG.h);
  advance(1.0);
  check('見せ場の時刻は速さ（段階 10 は ' + CFG.showSpeed[10] + ' 倍）に合わせて進む：1 秒で ' + CFG.showSpeed[10] + ' 単位', Math.abs(Game.showT - CFG.showSpeed[10] * 1.0) < 0.03 && Math.abs(Game.showR - 1.0) < 0.03, 'showT=' + Game.showT.toFixed(3));

  const s = document.createElement('h2');
  s.textContent = fail === 0 ? '全部 OK（' + (total - fail) + '/' + total + '）' : 'NG が ' + fail + ' 件（OK ' + (total - fail) + '/' + total + '）';
  s.className = fail === 0 ? 'ok' : 'ng';
  out.insertBefore(s, out.firstChild);
  window.__verifyFail = fail;
})();
</script>
