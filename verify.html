<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>瓦割り（仮） 検証</title>
<style>body{font:16px sans-serif;padding:16px}.ok{color:#080}.ng{color:#c00;font-weight:bold}pre{background:#f4f4f4;padding:8px}</style>
</head><body><h1>瓦割り（仮） 検証</h1><div id="out"></div>
<script>
// ===== 調整用の数値 =====
const CFG = {
  h: 1 / 120,            // 検証用の固定刻み
  readySecs: 0.6,        // 「はじめ」から連打の開始まで
  duration: 5,           // 連打の長さ（秒）。「はじめ」のあとに固定
  finishSecs: 0.16,      // 「せいっ」で腕を振り下ろして瓦に届くまで。そのあと見せ場
  retryWait: 0.5,        // 結果が出てから再挑戦を受け付けるまで（誤タップ防止）
  maxPerSec: 25,         // 1秒に数える連打の上限（直近1秒の窓）
  tiles: 20,             // 積む瓦の枚数

  // 段階 i になる最低の連打数（段階 0〜7）。本人のテストプレイで調整
  levelAt: [10, 20, 30, 40, 50, 60, 70],
  stageNames: ['ひびだけ', '瓦 数枚', '瓦 全部', '道場の床', '道場 全壊', '町内 全壊', '山 真っ二つ', 'クレーター'],

  tierEvery: 10,         // 連打 10 回ごとにオーラが一段派手になる
  maxTier: 7,

  // ---- Phase 2：破壊の見せ場 ----
  showSecs: [1.0, 1.2, 1.5, 2.1, 2.7, 3.2, 3.6, 4.0],   // 段階ごとの見せ場の長さ（高いほど長い。最高でも約 4 秒）
  showMax: 4.0,          // 見せ場の長さの上限（秒）
  skipGrace: 0.4,        // 見せ場の最初の 0.4 秒はタップを早送りにしない（連打の指が残っているため）
  maxPieces: 400,        // 破片（砂ぼこり含む）の数の上限
  seed: 20261120,        // 乱数のシード（連打数を足して使う。同じ連打数なら同じ壊れ方）
  camAt: [0, 0, 0, 0.75, 1.5, 2.05, 2.6, 3.05],          // 段階 k のカメラが引き始める時刻
  camDur: [0, 0, 0, 0.45, 0.45, 0.45, 0.4, 0.45],        // そのカメラが動く時間
  craterT: [3.15, 3.8],  // クレーターができ始める・できあがる時刻
  showCaps: [            // 段階ごとの大きな文字 [文字, 出る時刻]
    ['……いたい', 0.2], ['瓦、数枚', 0.2], ['瓦、全部', 0.3], ['床、抜けた', 0.95],
    ['道場、全壊', 1.65], ['町内、全壊', 2.25], ['山、真っ二つ', 2.75], ['……クレーター', 3.3]],
};
// ===== ゲームのロジック（画面を使わない）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// 連打数 → 段階（0〜7）
function stageFor(count) {
  let s = 0;
  for (let i = 0; i < CFG.levelAt.length; i++) if (count >= CFG.levelAt[i]) s = i + 1;
  return s;
}
// 連打数 → オーラの段（10 回ごとに一段）
function tierFor(count) { return Math.min(CFG.maxTier, Math.floor(count / CFG.tierEvery)); }

// キー入力を数えてよいか（スペース・Enter、押しっぱなしの連続入力は数えない）
function acceptKey(e) {
  if (e.repeat) return false;
  return e.key === ' ' || e.key === 'Enter' || e.code === 'Space';
}

const Game = {
  mode: 'title',   // title → ready → play → finish（せいっ）→ show（破壊の見せ場）→ over（結果）
  t: 0, readyT: 0, finT: 0, showT: 0, overT: 0, show: null,
  count: 0, hits: [],      // hits: 数えた時刻（直近1秒の窓の判定に使う）
  events: [],

  reset() {
    this.mode = 'title';
    this.t = 0; this.readyT = 0; this.finT = 0; this.showT = 0; this.overT = 0; this.show = null;
    this.count = 0; this.hits = [];
    this.events = [];
  },

  begin() {
    if (this.mode !== 'title') return;
    this.mode = 'ready'; this.readyT = 0;
    this.events.push({ type: 'ready' });
  },

  stage() { return stageFor(this.count); },
  tier() { return tierFor(this.count); },
  remaining() { return Math.max(0, CFG.duration - this.t); },
  // 見せ場を始める（届いた段階まで。壊れ方は連打数で決まるシード付き）
  startShow() {
    const st = this.stage();
    this.show = buildShow(st, CFG.seed + this.count);
    this.mode = 'show'; this.showT = 0;
    this.events.push({ type: 'show', stage: st });
  },
  // タップで早送り：見せ場の最初の skipGrace 秒は受け付けない。結果へ直ちに移る
  skip() {
    if (this.mode !== 'show' || this.showT < CFG.skipGrace) return false;
    this.showT = this.show.dur; this.mode = 'over'; this.overT = 0;
    this.events.push({ type: 'over', skipped: true });
    return true;
  },
  canRetry() { return this.mode === 'over' && this.overT >= CFG.retryWait; },

  // 連打 1 回。'hit' 数えた / 'limited' 速すぎて数えない / 'ignored' 受付外（はじめ前・締め切り後）
  tap() {
    if (this.mode !== 'play' || this.t >= CFG.duration - 1e-9) return 'ignored';
    const h = this.hits;
    while (h.length && this.t - h[0] >= 1 - 1e-9) h.shift();
    if (h.length >= CFG.maxPerSec) return 'limited';
    h.push(this.t);
    this.count++;
    this.events.push({ type: 'hit', count: this.count, tier: this.tier(), tierUp: this.count % CFG.tierEvery === 0 && this.count / CFG.tierEvery <= CFG.maxTier });
    return 'hit';
  },

  step(dt) {
    if (this.mode === 'ready') {
      this.readyT += dt;
      if (this.readyT >= CFG.readySecs) { this.mode = 'play'; this.t = 0; this.hits = []; this.events.push({ type: 'start' }); }
      return;
    }
    if (this.mode === 'play') {
      this.t += dt;
      if (this.t >= CFG.duration - 1e-9) {
        this.t = CFG.duration;
        this.mode = 'finish'; this.finT = 0;
        this.events.push({ type: 'end', count: this.count, stage: this.stage() });
      }
      return;
    }
    if (this.mode === 'finish') {
      this.finT += dt;
      if (this.finT >= CFG.finishSecs) this.startShow();
      return;
    }
    if (this.mode === 'show') {
      this.showT += dt;
      if (this.showT >= this.show.dur - 1e-9) { this.showT = this.show.dur; this.mode = 'over'; this.overT = 0; this.events.push({ type: 'over' }); }
      return;
    }
    if (this.mode === 'over') this.overT += dt;
  },
};
// ===== 破壊の見せ場（画面を使わない：世界の配置・破片・カメラ・時刻）=====
// 世界の座標は「遊ぶ場所の幅 = 100」の単位。段階 0 の画面は x 0〜100・y 0〜177.78。y は下向き
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

const GY = 140, BY = 215;                              // 地面（道場の床）の高さ / 下の階の床の高さ
const KX = 38;                                         // 空手家の x
const TX = 74, TW = 30, TP = 3, TH = 2.7, TB = 128;    // 瓦の中心x・幅・ピッチ・厚み・台の上の y
const DL = -70, DR = 160;                              // 道場の内側の左右
const HX0 = -12, HX1 = 118;                            // 段階 3 で床が抜ける範囲
const PX = KX + 1, PW = 34;                            // 最後に残る足場の柱（中心x・幅）
const CR = { x: PX, R: 230, D: 300 };                  // クレーター（中心x・半径・深さ）
const GRAV = 700;
const DROP_T = 1.1;                                    // 床が抜けて、床に載っていた物が落ちる時刻
const FALL_T = 1.0;                                    // 本人が下の階へ落ち始める時刻

// 段階ごとのカメラ（見たい範囲の中心と大きさ。画面の縦横比に合わせて倍率を決める）
const BASE_CAM = { cx: 50, cy: 88.89, w: 100, h: 177.78 };
const CAMS = [BASE_CAM, BASE_CAM, BASE_CAM,
  { cx: 50, cy: 128, w: 150, h: 225 },       // 3 床が抜ける・下の階
  { cx: 45, cy: 85, w: 320, h: 300 },        // 4 道場の建物
  { cx: 45, cy: 60, w: 760, h: 420 },        // 5 町内
  { cx: 45, cy: 15, w: 800, h: 470 },        // 6 裏山
  { cx: 39, cy: 215, w: 820, h: 560 }];      // 7 クレーター
// 各段階で「画面に入っていてほしい範囲」（検証でカメラが覆っているか確かめる）
const EXTENT = [
  { x0: 10, x1: 100, y0: 60, y1: 150 }, { x0: 10, x1: 100, y0: 60, y1: 150 }, { x0: 10, x1: 100, y0: 60, y1: 150 },
  { x0: -12, x1: 118, y0: 60, y1: 225 },
  { x0: -92, x1: 182, y0: -42, y1: 225 },
  { x0: -300, x1: 365, y0: 60, y1: 225 },
  { x0: -260, x1: 350, y0: -210, y1: 225 },
  { x0: CR.x - CR.R, x1: CR.x + CR.R, y0: 60, y1: GY + CR.D }];
// 裏山（左半分・右半分。ぎざぎざの稜線）
const MT_L = [-260, 140, -190, 50, -130, -40, -85, -95, -40, -150, 10, -185, 45, -210, 45, 140];
const MT_R = [45, -210, 80, -170, 135, -110, 190, -40, 255, 40, 350, 140, 45, 140];
const STRATA = [[GY, '#86d06a'], [GY + 7, '#dcb47c'], [190, '#cb985e'], [255, '#bb8761'], [330, '#aa876c'], [400, '#c2a88e'], [470, '#98795f'], [560, '#806853'], [700, '#6e5a4c']];

// 乱数（シード付き。同じシードなら同じ壊れ方）
function mkRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// カメラが見ている世界の範囲（画面 W×H px に収める倍率 k = px/世界単位）
function viewFor(cam, W, H) {
  const k = Math.min(W / cam.w, H / cam.h), hw = W / (2 * k), hh = H / (2 * k);
  return { k, x0: cam.cx - hw, x1: cam.cx + hw, y0: cam.cy - hh, y1: cam.cy + hh };
}
// 見せ場の時刻 t のカメラ（段階が上がるたびに一段引く）
function camAt(S, t) {
  let a = BASE_CAM, b = BASE_CAM, u = 1;
  for (let k = 3; k <= S; k++) {
    if (t < CFG.camAt[k]) break;
    a = CAMS[k - 1]; b = CAMS[k]; u = smooth((t - CFG.camAt[k]) / CFG.camDur[k]);
  }
  const lg = (p, q) => Math.exp(lerp(Math.log(p), Math.log(q), u));
  return { cx: lerp(a.cx, b.cx, u), cy: lerp(a.cy, b.cy, u), w: lg(a.w, b.w), h: lg(a.h, b.h) };
}
// クレーターの進み具合（0〜1）
function craterAt(S, t) {
  if (S < 7) return 0;
  return smooth((t - CFG.craterT[0]) / (CFG.craterT[1] - CFG.craterT[0]));
}
// 地面の上端（クレーターで掘れた後。足場の柱だけ残る）
function craterTop(x, cp) {
  const u = (x - CR.x) / CR.R;
  let y = GY + (cp > 0 && Math.abs(u) < 1 ? cp * CR.D * Math.pow(1 - u * u, 0.75) : 0);
  if (x > PX - PW / 2 && x < PX + PW / 2) y = Math.min(y, BY);
  return y;
}
// 画面の揺れ（px）・光（0〜）
function shakeAt(sh, t, o) {
  let a = 0;
  for (const s of sh.shakes) if (t >= s.t && t < s.t + s.d) { const u = 1 - (t - s.t) / s.d; a += s.a * u * u; }
  o.x = Math.sin(t * 57) * a; o.y = Math.cos(t * 43) * a;
  return o;
}
function flashAt(sh, t) {
  let f = 0;
  for (const s of sh.flashes) if (t >= s.t) f += s.a * Math.exp(-(t - s.t) * 7);
  return f;
}
// 今出す大きな文字（出ていなければ -1）
function captionAt(sh, t) {
  let r = -1;
  for (let i = 0; i < sh.caps.length; i++) if (sh.caps[i].t <= t) r = i;
  return r;
}

// 空手家の動き：腕の目標・顔・落ちる高さ
function karaAt(sh, t) {
  const S = sh.stage, o = { dy: 0, dx: 0, tx: 61, ty: 65, face: 'serious' };
  if (S === 0) {            // 手を押さえて悶える
    const e = smooth((t - 0.12) / 0.25);
    o.tx = lerp(61, KX + 9, e); o.ty = lerp(65, 105, e); o.face = 'pain';
    if (t > 0.3) { o.dx = Math.sin(t * 48) * 0.7; o.dy = -Math.abs(Math.sin((t - 0.3) * 13)) * 1.8; }
  } else {                  // 拳が瓦を割り下ろし、そのあと正拳の姿勢のまま真顔
    const wv = S === 1 ? [3, 15, 0.35, 0.6] : [8, 60, 0.6, 0.75];
    const w = smooth((t - 0.05) / wv[2]), e = smooth((t - wv[3]) / 0.3);
    o.tx = lerp(61 + wv[0] * w, KX + 27, e); o.ty = lerp(65 + wv[1] * w, 104, e);
  }
  if (S >= 3 && t > FALL_T) {   // 床が抜けて、本人だけ下の階へ
    const tt = t - FALL_T, fall = BY - GY, tl = Math.sqrt(2 * fall / GRAV);
    o.dy = tt < tl ? 0.5 * GRAV * tt * tt : fall - 3 * Math.exp(-(tt - tl) * 7) * Math.abs(Math.sin((tt - tl) * 16));
  }
  return o;
}

// ---- 破片 ----
// 着地までの時間（床に届かないなら Infinity）
function landT(p) {
  if (!isFinite(p.fy)) return Infinity;
  const d = p.vy * p.vy - 2 * GRAV * (p.y - p.fy);
  if (d < 0) return Infinity;
  return Math.max(0, (-p.vy + Math.sqrt(d)) / GRAV);
}
// 時刻 t の破片の姿勢を o に書く（位置 x,y・角度 a・透明度 al・大きさ s）。式だけで決まるので早送りでも飛ばない
function poseAt(p, t, o) {
  o.x = p.x; o.y = p.y; o.a = 0; o.al = 1; o.s = 1;
  if (t >= p.tb) {
    const tt = t - p.tb;
    if (p.kind === 'puff') {
      const u = clamp(tt / p.life, 0, 1);
      o.s = lerp(p.r0, p.r1, 1 - (1 - u) * (1 - u)); o.al = (1 - u) * 0.85; o.y = p.y + p.vy * tt;
    } else if (p.kind === 'tilt') {       // 倒れる（軸のまわりに回る）
      const u = clamp(tt / p.dur, 0, 1), ang = p.ang * (p.out ? 1 - (1 - u) * (1 - u) : u * u);
      const c = Math.cos(ang), s = Math.sin(ang), dx = p.x - p.px, dy = p.y - p.py;
      o.x = p.px + dx * c - dy * s; o.y = p.py + dx * s + dy * c; o.a = ang;
    } else if (tt < p.tl) {                // 飛ぶ
      o.x = p.x + p.vx * tt; o.y = p.y + p.vy * tt + 0.5 * GRAV * tt * tt; o.a = p.w * tt;
    } else {                               // 着地（少し滑って、平らに落ち着く）
      const u = tt - p.tl, ar = p.w * p.tl, flat = Math.round(ar / Math.PI) * Math.PI;
      o.x = p.x + p.vx * p.tl + p.vx * 0.06 * (1 - Math.exp(-8 * u)); o.y = p.fy; o.a = lerp(ar, flat, 1 - Math.exp(-12 * u));
      if (t >= p.drop) { const dd = t - p.drop; o.y = Math.min(p.fy2, p.fy + 0.5 * GRAV * dd * dd); }
    }
  } else if (p.hid) o.al = 0;
  if (t > p.fade) o.al *= 1 - clamp((t - p.fade) / 0.2, 0, 1);
  return o;
}

// 段階 S までの見せ場を作る。S より上の物は壊れずに（tb = Infinity）そのまま置いてある
function buildShow(S, seed) {
  const R = mkRng(seed), RG = mkRng(CFG.seed + 99);   // R：飛び方（連打数で変わる） RG：形・切れ目（いつも同じ）
  const rr = (a, b) => a + (b - a) * R(), rg = (a, b) => a + (b - a) * RG();
  const sgn = () => (R() < 0.5 ? -1 : 1);
  const T = (st, t) => (S >= st ? t : Infinity);
  const P = [], cues = [], shakes = [], flashes = [];
  const cue = (t, s) => { if (isFinite(t)) cues.push({ t, s }); };
  const shake = (t, a, d) => { if (isFinite(t)) shakes.push({ t, a, d }); };
  const flash = (t, a) => { if (isFinite(t)) flashes.push({ t, a }); };

  function add(o) {
    const p = Object.assign({ g: '', idx: 0, x: 0, y: 0, poly: null, col: '#ccc', edge: null, lay: 3, kind: 'fly', tb: Infinity,
      vx: 0, vy: 0, w: 0, fy: Infinity, fy2: Infinity, drop: Infinity, fade: Infinity, hid: false, hh: 1, tl: Infinity,
      dec: null, ck: null, ckT: Infinity }, o);
    if (p.poly) { let m = 0; for (let i = 1; i < p.poly.length; i += 2) m = Math.max(m, Math.abs(p.poly[i])); p.hh = m; }
    P.push(p);
    return p;
  }
  const box = (w, h) => [-w / 2, -h / 2, w / 2, -h / 2, w / 2, h / 2, -w / 2, h / 2];
  const floorAt = (x, st) => (st <= 2 ? GY : st === 3 ? (x > HX0 && x < HX1 ? BY : GY) : (x > DL && x < DR ? BY : GY));
  // 着地する床を決める（飛んだ先の x で、抜けた床の下かどうか）
  function settle(p, st) {
    p.fy = GY - p.hh; let tl = landT(p);
    const f = floorAt(p.x + p.vx * (isFinite(tl) ? tl : 0), st);
    p.fy = f - p.hh; p.tl = landT(p);
    return p;
  }
  const puff = (x, y, r0, r1, tb, life, col) => add({ g: 'puff', kind: 'puff', x, y, r0, r1, tb, life, vy: -10, col, lay: 5, hid: true });

  // ---- 瓦（上から k 枚目。1 枚を 3 つに割る）。段階 1 は上の 5 枚、段階 2 で全部 ----
  for (let k = 0; k < CFG.tiles; k++) {
    const i = CFG.tiles - 1 - k, st = k < 5 ? 1 : 2, hy = TH / 2;
    const cy = TB - (i + 1) * TP + (TP - TH) + hy, x0 = TX - TW / 2;
    const xs = [x0, x0 + TW * rg(0.25, 0.4), x0 + TW * rg(0.6, 0.78), x0 + TW], sl = [0, rg(-0.9, 0.9), rg(-0.9, 0.9), 0];
    const tb = T(st, 0.05 + k * (S >= 2 ? 0.03 : 0.07));
    for (let j = 0; j < 3; j++) {
      const xa = xs[j], xb = xs[j + 1], cx = (xa + xb) / 2, side = j === 0 ? -1 : j === 2 ? 1 : sgn();
      const p = add({ g: 'tile', idx: k, x: cx, y: cy, poly: [xa - cx, -hy, xb - cx, -hy, xb + sl[j + 1] - cx, hy, xa + sl[j] - cx, hy],
        col: i % 2 ? '#667c92' : '#5b7188', edge: '#33414f', tb, vx: side * rr(16, 48), vy: -rr(50, 130), w: side * rr(2, 9) });
      settle(p, 2);
      if (S >= 3) { const xl = p.x + p.vx * p.tl; if (xl > HX0 && xl < HX1) { p.drop = DROP_T; p.fy2 = BY - p.hh; } }   // 床が抜けたら一緒に落ちる
      const w = xb - xa;   // ひび（割れずに残る瓦）
      if (j === 1 && ((S === 0 && k < 8) || (S === 1 && k >= 5 && k < 9))) {
        p.ck = [-w * 0.3, -hy, -w * 0.05, -hy * 0.1, w * 0.15, hy * 0.2, 0, hy];
        p.ckT = S === 0 ? 0.05 + k * 0.02 : 0.1 + (k - 5) * 0.04;
      }
    }
    if (isFinite(tb) && k % 3 === 0) cue(tb, 'tile');
  }
  if (S >= 1) { shake(0.05, 5, 0.45); cue(0.02, 'crack'); }
  if (S >= 1) for (let n = 0; n < 3; n++) puff(TX + rr(-10, 10), TB - 20 + n * 12, 5, 16, 0.1 + n * 0.18, 0.5, '#ffffff');
  if (S === 0) { shake(0.02, 3, 0.3); cue(0.02, 'crack'); cue(0.3, 'thud'); }

  // ---- 瓦の台（段階 3）----
  for (const bx of [TX - TW / 2 - 0.5, TX + TW / 2 - 6.5]) {
    const p = add({ g: 'stand', x: bx + 3.5, y: (TB + GY) / 2, poly: box(7, GY - TB), col: '#948a7e', edge: '#5e564c', tb: T(3, 0.97 + rr(0, 0.1)),
      vx: rr(-10, 10), vy: rr(-10, 10), w: rr(-1.5, 1.5) });

  check('早送り入力で直ちに結果へ移る（見せ場の途中から）', sk === true && Game.mode === 'over' && Game.overT === 0 && tBefore < durBefore, 'showT=' + tBefore.toFixed(2));
  advance(CFG.retryWait + 0.01);
  check('早送りのあと 0.5 秒で再挑戦でき、連打数・段階は変わらない', Game.canRetry() && Game.count === 70 && Game.stage() === 7);
  check('見せ場でない間の早送りは何もしない', Game.skip() === false);

  // 破片の数・再現性
  let maxPieces = 0, maxBroken = 0;
  for (let st = 0; st < 8; st++) {
    const s = buildShow(st, CFG.seed + counts[st]);
    maxPieces = Math.max(maxPieces, s.pieces.length);
    maxBroken = Math.max(maxBroken, s.pieces.filter(p => isFinite(p.tb)).length);
  }
  check('破片の数が上限（' + CFG.maxPieces + '）を超えない（全段階）', maxPieces <= CFG.maxPieces, '最大 ' + maxPieces + '（うち飛ぶもの ' + maxBroken + '）');
  const sig = s => JSON.stringify(s.pieces.map(p => [p.x, p.y, p.vx, p.vy, p.w, p.tb, p.fy]));
  check('同じシードなら同じ壊れ方（再現できる）', sig(buildShow(7, 12345)) === sig(buildShow(7, 12345)));
  check('シードが違えば飛び方が変わる', sig(buildShow(7, 12345)) !== sig(buildShow(7, 54321)));
  let badN = 0;
  for (let st = 0; st < 8; st++) {
    const s = buildShow(st, 99);
    for (const t of [0, 0.5, 1, 2, 3, 4, 6]) for (const p of s.pieces) { const o = poseAt(p, t, { x: 0, y: 0, a: 0, al: 1, s: 1 }); if (![o.x, o.y, o.a, o.al, o.s].every(Number.isFinite)) badN++; }
  }
  check('どの時刻でも破片の位置が正常な数値（早送り・結果のあとも）', badN === 0, 'bad=' + badN);

  // 段階ごとに壊れる範囲がはっきり違う
  const groups = st => { const s = buildShow(st, 7), g = {}; for (const p of s.pieces) if (isFinite(p.tb) && p.g !== 'puff') g[p.g] = (g[p.g] || 0) + 1; return g; };
  const G = [0, 1, 2, 3, 4, 5, 6, 7].map(groups), keys = g => Object.keys(g).sort().join(','), sum = g => Object.values(g).reduce((a, b) => a + b, 0);
  check('段階 0：何も割れない（ひびだけ）', Object.keys(G[0]).length === 0);
  check('段階 1：瓦が数枚だけ（5 枚 = 15 片）、段階 2：瓦が全部（20 枚 = 60 片）', G[1].tile === 15 && keys(G[1]) === 'tile' && G[2].tile === 60 && keys(G[2]) === 'tile', keys(G[1]) + ' / ' + keys(G[2]));
  check('段階 3：台と床が加わる', G[3].stand === 2 && G[3].slab > 0 && !G[3].dojo, keys(G[3]));
  check('段階 4：道場の建物が加わる', G[4].dojo > 20 && !G[4].house, keys(G[4]));
  check('段階 5：家と電柱が加わる（家 6 軒・電柱 4 本）', G[5].house === 12 && G[5].pole === 4 && !G[5].mountain, keys(G[5]));
  check('段階 6：裏山が割れる', G[6].mountain === 2 && G[6].rock > 0 && !G[6].dirt, keys(G[6]));
  check('段階 7：地面（クレーター）が加わる', G[7].dirt > 50, keys(G[7]));
  check('壊れる破片の数が段階ごとに増える', [1, 2, 3, 4, 5, 6, 7].every(i => sum(G[i]) > sum(G[i - 1])), G.map(sum).join(' < '));
  const area = i => CAMS[i].w * CAMS[i].h;
  check('カメラが段階ごとに一段引く（範囲が必ず広がる）', [3, 4, 5, 6, 7].every(i => area(i) > area(i - 1)));
  const cams = [0, 1, 2, 3, 4, 5, 6, 7].map(st => camAt(st, CFG.showSecs[st]));
  check('見せ場の終わりのカメラが段階の設定どおり', cams.every((c, i) => Math.abs(c.w - CAMS[i].w) < 0.01 && Math.abs(c.cy - CAMS[i].cy) < 0.01));
  const midc = camAt(7, CFG.camAt[7] + CFG.camDur[7] / 2);
  check('カメラは連続して動く（引いている途中は前後の中間）', midc.w > CAMS[6].w && midc.w < CAMS[7].w);

  // 画面の縦横比ごとに、引いたカメラが必要な範囲を覆う（はみ出さない）
  const asp = [[390, 844], [375, 667], [360, 800], [768, 1024], [844, 390], [1024, 768], [1280, 720], [1920, 1080], [2560, 1080], [600, 1200]];
  const off = [];
  for (const [w, h] of asp) for (let st = 0; st < 8; st++) {
    const v = viewFor(CAMS[st], w, h), e = EXTENT[st];
    if (!(v.x0 <= e.x0 && v.x1 >= e.x1 && v.y0 <= e.y0 && v.y1 >= e.y1)) off.push(w + 'x' + h + ' 段階' + st);
  }
  check('縦・横・PC の 10 種類の画面で、どの段階も必要な範囲が画面に入る', off.length === 0, off.join(', ') || asp.length + ' 種類 × 8 段階');
  check('クレーター：足場の柱は残り、まわりは深く掘れる', craterTop(PX, 1) === BY && craterTop(CR.x + 100, 1) > BY + 100 && craterTop(CR.x + CR.R + 20, 1) === GY && craterTop(CR.x + 100, 0) === GY);
  check('大きな文字は段階ごとに用意（段階 7 は 6 つ：瓦、全部〜クレーター）', buildShow(7, 1).caps.length === 6 && buildShow(0, 1).caps.length === 1 && buildShow(1, 1).caps.length === 1);

  // --- 連打の反応（イベント）---
  startPlay();
  for (let i = 0; i < 20; i++) { Game.tap(); advance(0.05); }
  const ev = Game.events.filter(e => e.type === 'hit');
  check('数えた連打ごとに必ず反応のイベントが出る', ev.length === 20 && Game.count === 20, 'events=' + ev.length);
  check('10 回ごとに「一段派手」のイベントが出る', ev.filter(e => e.tierUp).map(e => e.count).join(',') === '10,20');

  const s = document.createElement('h2');
  s.textContent = fail === 0 ? '全部 OK（' + (total - fail) + '/' + total + '）' : 'NG が ' + fail + ' 件（OK ' + (total - fail) + '/' + total + '）';
  s.className = fail === 0 ? 'ok' : 'ng';
  out.insertBefore(s, out.firstChild);
  window.__verifyFail = fail;
})();
</script>
