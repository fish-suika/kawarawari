<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>瓦割り（仮）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c196;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#2b2b3a;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
.nb{display:inline-block;white-space:nowrap}

/* 絵は画面いっぱい。遊ぶ場所は縦9:16で中央 */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠。単位は cqw（枠の幅の1%）。文字の置き場所に使うだけで、触れるのは下の絵 */
#stage{position:relative;container-type:size;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}
#stage>*{pointer-events:none}

/* 上：残り時間 / 下：連打数 */
#hudTop{position:absolute;left:0;right:0;top:6cqw;text-align:center;font-weight:900;color:#fff;
  -webkit-text-stroke:1.2cqw #7a1f1a;paint-order:stroke fill;text-shadow:0 1cqw 0 #7a1f1a;
  font-size:13cqw;line-height:1;font-variant-numeric:tabular-nums;opacity:0}
#hudTop small{font-size:5cqw;margin-left:1.2cqw;-webkit-text-stroke-width:.8cqw}
#hudTop.on{opacity:1}
#hudTop.low{color:#ffe14d}
#hudBot{position:absolute;left:0;right:0;bottom:7cqw;text-align:center;font-weight:bold;color:#fff;
  font-size:5.6cqw;text-shadow:0 .6cqw 0 #0007,0 0 2cqw #0007;font-variant-numeric:tabular-nums;opacity:0}
#hudBot.on{opacity:1}
#hudBot b{font-size:7cqw}

/* 「はじめ」「せいっ」 */
#call{position:absolute;left:0;right:0;top:34cqw;text-align:center;font-weight:900;font-size:21cqw;color:#fff;
  -webkit-text-stroke:2cqw #7a1f1a;paint-order:stroke fill;text-shadow:0 1.6cqw 0 #7a1f1a;
  opacity:0;transform:scale(.6)}
#call.on{animation:call .5s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes call{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

/* 段階ごとの大きな文字（見せ場）。文字の大きさは setCap で文字数に合わせる */
#cap{position:absolute;left:0;right:0;top:11cqw;text-align:center;font-weight:900;color:#fff;white-space:nowrap;
  -webkit-text-stroke:1.8cqw #7a1f1a;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #7a1f1a;line-height:1.1;opacity:0}
#cap.on{animation:capin .35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes capin{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

/* タイトル */
#title{position:absolute;left:5cqw;right:5cqw;top:40cqw;z-index:20;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:3cqw}
#title.hide{display:none}
#title .t1{font-size:4.6cqw;font-weight:bold;color:#fff;background:#8a1f1a;border-radius:5cqw;padding:.8cqw 4.5cqw;letter-spacing:.6cqw}
#title .t2{font-size:19cqw;font-weight:900;line-height:1.1;color:#fff;
  -webkit-text-stroke:1.6cqw #5a2a14;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #5a2a14,0 2.2cqw 3cqw #0004}
#title .t3{font-size:5.2cqw;font-weight:bold;color:#5a2a14;background:#fffd;border-radius:3cqw;padding:1cqw 4cqw}
#title .t4{margin-top:3cqw;font-size:6cqw;font-weight:bold;color:#fff;background:#d2382f;border-radius:6cqw;
  padding:2cqw 8cqw;box-shadow:0 1.2cqw 0 #8f221c;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.07)}}

/* 結果（仮） */
#result{position:absolute;left:8cqw;right:8cqw;top:30cqw;z-index:30;padding:6cqw 5cqw;
  background:#fffdf2;border:.7cqw solid #5a2a14;border-radius:2cqw;box-shadow:0 2cqw 0 #3a1a0a,0 3cqw 6cqw #0006;
  display:none;flex-direction:column;align-items:center;gap:2.4cqw;text-align:center}
#result.show{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#result .lb{font-size:4.4cqw;color:#7a6a58;font-weight:bold}
#result .stage{font-size:11cqw;font-weight:900;line-height:1.15;color:#d2382f}
#result .cnt{font-size:6cqw;font-weight:bold;color:#2b2b3a;font-variant-numeric:tabular-nums}
#result .again{margin-top:2cqw;font-size:5.4cqw;font-weight:bold;color:#fff;background:#d2382f;border-radius:5cqw;
  padding:1.6cqw 7cqw;box-shadow:0 1cqw 0 #8f221c;opacity:.35}
#result.ready .again{opacity:1;animation:blink 1.1s ease-in-out infinite}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="hudTop"><span id="tLeft">5.0</span><small>秒</small></div>
  <div id="hudBot"><b id="cNum">0</b> 回</div>
  <div id="call"></div>
  <div id="cap"></div>
  <div id="title">
    <div class="t2"><span class="nb">瓦割り</span></div>
    <div class="t3"><span class="nb">5秒で</span><span class="nb">どこまで 割れる？</span></div>
    <div class="t4">タップで スタート</div>
  </div>
  <div id="result">
    <div class="lb">到達</div>
    <div class="stage" id="rStage"></div>
    <div class="cnt"><span id="rCnt">0</span> 回</div>
    <div class="again">タップで もう一回</div>
  </div>
</div>
<script>
// ===== 調整用の数値 =====
const CFG = {
  h: 1 / 120,            // 検証用の固定刻み
  readySecs: 0.6,        // 「はじめ」から連打の開始まで
  duration: 5,           // 連打の長さ（秒）。「はじめ」のあとに固定
  finishSecs: 0.16,      // 「せいっ」で腕を振り下ろして瓦に届くまで。そのあと見せ場
  retryWait: 0.5,        // 結果が出てから再挑戦を受け付けるまで（誤タップ防止）
  maxPerSec: 25,         // 1秒に数える連打の上限（直近1秒の窓）
  tiles: 20,             // 積む瓦の枚数

  // 段階 i になる最低の連打数（段階 0〜7）。本人のテストプレイで調整
  levelAt: [6, 12, 18, 24, 30, 36, 42],   // 6 回ごと。全力（毎秒 8 回強）でクレーター
  stageNames: ['ひびだけ', '瓦 数枚', '瓦 全部', '道場の床', '道場 全壊', '町内 全壊', '山 真っ二つ', 'クレーター'],

  tierEvery: 6,          // 連打 6 回ごとにオーラが一段派手になる（下で levelAt[0] から上書き）
  maxTier: 7,

  // ---- Phase 2：破壊の見せ場 ----
  showSecs: [1.0, 1.2, 1.5, 2.1, 2.7, 3.2, 3.6, 4.0],   // 段階ごとの見せ場の長さ（高いほど長い。最高でも約 4 秒）
  showMax: 4.0,          // 見せ場の長さの上限（秒）
  skipGrace: 0.4,        // 見せ場の最初の 0.4 秒はタップを早送りにしない（連打の指が残っているため）
  maxPieces: 400,        // 破片（砂ぼこり含む）の数の上限
  seed: 20261120,        // 乱数のシード（連打数を足して使う。同じ連打数なら同じ壊れ方）
  camAt: [0, 0, 0, 0.75, 1.5, 2.05, 2.6, 3.05],          // 段階 k のカメラが引き始める時刻
  camDur: [0, 0, 0, 0.45, 0.45, 0.45, 0.4, 0.45],        // そのカメラが動く時間
  craterT: [3.15, 3.8],  // クレーターができ始める・できあがる時刻
  showCaps: [            // 段階ごとの大きな文字 [文字, 出る時刻]
    ['……いたい', 0.2], ['瓦、数枚', 0.2], ['瓦、全部', 0.3], ['床、抜けた', 0.95],
    ['道場、全壊', 1.65], ['町内、全壊', 2.25], ['山、真っ二つ', 2.75], ['……クレーター', 3.3]],
};
CFG.tierEvery = CFG.levelAt[0];                       // オーラの段は段階と同じ区切り（6 回ごと）
CFG.topCount = CFG.levelAt[CFG.levelAt.length - 1];   // 最高段階の連打数。強さの伸びの上限に使う
// ===== ゲームのロジック（画面を使わない）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// 連打数 → 段階（0〜7）
function stageFor(count) {
  let s = 0;
  for (let i = 0; i < CFG.levelAt.length; i++) if (count >= CFG.levelAt[i]) s = i + 1;
  return s;
}
// 連打数 → オーラの段（段階と同じ区切りで一段）
function tierFor(count) { return Math.min(CFG.maxTier, Math.floor(count / CFG.tierEvery)); }

// キー入力を数えてよいか（スペース・Enter、押しっぱなしの連続入力は数えない）
function acceptKey(e) {
  if (e.repeat) return false;
  return e.key === ' ' || e.key === 'Enter' || e.code === 'Space';
}

const Game = {
  mode: 'title',   // title → ready → play → finish（せいっ）→ show（破壊の見せ場）→ over（結果）
  t: 0, readyT: 0, finT: 0, showT: 0, overT: 0, show: null,
  count: 0, hits: [],      // hits: 数えた時刻（直近1秒の窓の判定に使う）
  events: [],

  reset() {
    this.mode = 'title';
    this.t = 0; this.readyT = 0; this.finT = 0; this.showT = 0; this.overT = 0; this.show = null;
    this.count = 0; this.hits = [];
    this.events = [];
  },

  begin() {
    if (this.mode !== 'title') return;
    this.mode = 'ready'; this.readyT = 0;
    this.events.push({ type: 'ready' });
  },

  stage() { return stageFor(this.count); },
  tier() { return tierFor(this.count); },
  remaining() { return Math.max(0, CFG.duration - this.t); },
  // 見せ場を始める（届いた段階まで。壊れ方は連打数で決まるシード付き）
  startShow() {
    const st = this.stage();
    this.show = buildShow(st, CFG.seed + this.count);
    this.mode = 'show'; this.showT = 0;
    this.events.push({ type: 'show', stage: st });
  },
  // タップで早送り：見せ場の最初の skipGrace 秒は受け付けない。結果へ直ちに移る
  skip() {
    if (this.mode !== 'show' || this.showT < CFG.skipGrace) return false;
    this.showT = this.show.dur; this.mode = 'over'; this.overT = 0;
    this.events.push({ type: 'over', skipped: true });
    return true;
  },
  canRetry() { return this.mode === 'over' && this.overT >= CFG.retryWait; },

  // 連打 1 回。'hit' 数えた / 'limited' 速すぎて数えない / 'ignored' 受付外（はじめ前・締め切り後）
  tap() {
    if (this.mode !== 'play' || this.t >= CFG.duration - 1e-9) return 'ignored';
    const h = this.hits;
    while (h.length && this.t - h[0] >= 1 - 1e-9) h.shift();
    if (h.length >= CFG.maxPerSec) return 'limited';
    h.push(this.t);
    this.count++;
    this.events.push({ type: 'hit', count: this.count, tier: this.tier(), tierUp: this.count % CFG.tierEvery === 0 && this.count / CFG.tierEvery <= CFG.maxTier });
    return 'hit';
  },

  step(dt) {
    if (this.mode === 'ready') {
      this.readyT += dt;
      if (this.readyT >= CFG.readySecs) { this.mode = 'play'; this.t = 0; this.hits = []; this.events.push({ type: 'start' }); }
      return;
    }
    if (this.mode === 'play') {
      this.t += dt;
      if (this.t >= CFG.duration - 1e-9) {
        this.t = CFG.duration;
        this.mode = 'finish'; this.finT = 0;
        this.events.push({ type: 'end', count: this.count, stage: this.stage() });
      }
      return;
    }
    if (this.mode === 'finish') {
      this.finT += dt;
      if (this.finT >= CFG.finishSecs) this.startShow();
      return;
    }
    if (this.mode === 'show') {
      this.showT += dt;
      if (this.showT >= this.show.dur - 1e-9) { this.showT = this.show.dur; this.mode = 'over'; this.overT = 0; this.events.push({ type: 'over' }); }
      return;
    }
    if (this.mode === 'over') this.overT += dt;
  },
};
// ===== 破壊の見せ場（画面を使わない：世界の配置・破片・カメラ・時刻）=====
// 世界の座標は「遊ぶ場所の幅 = 100」の単位。段階 0 の画面は x 0〜100・y 0〜177.78。y は下向き
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

const GY = 140, BY = 215;                              // 地面（道場の床）の高さ / 下の階の床の高さ
const KX = 38;                                         // 空手家の x
const TX = 74, TW = 30, TP = 3, TH = 2.7, TB = 128;    // 瓦の中心x・幅・ピッチ・厚み・台の上の y
const DL = -70, DR = 160;                              // 道場の内側の左右
const HX0 = -12, HX1 = 118;                            // 段階 3 で床が抜ける範囲
const PX = KX + 1, PW = 34;                            // 最後に残る足場の柱（中心x・幅）
const CR = { x: PX, R: 230, D: 300 };                  // クレーター（中心x・半径・深さ）
const GRAV = 700;
const DROP_T = 1.1;                                    // 床が抜けて、床に載っていた物が落ちる時刻
const FALL_T = 1.0;                                    // 本人が下の階へ落ち始める時刻

// 段階ごとのカメラ（見たい範囲の中心と大きさ。画面の縦横比に合わせて倍率を決める）
const BASE_CAM = { cx: 50, cy: 88.89, w: 100, h: 177.78 };
const CAMS = [BASE_CAM, BASE_CAM, BASE_CAM,
  { cx: 50, cy: 128, w: 150, h: 225 },       // 3 床が抜ける・下の階
  { cx: 45, cy: 85, w: 320, h: 300 },        // 4 道場の建物
  { cx: 45, cy: 60, w: 760, h: 420 },        // 5 町内
  { cx: 45, cy: 15, w: 800, h: 470 },        // 6 裏山
  { cx: 39, cy: 215, w: 820, h: 560 }];      // 7 クレーター
// 各段階で「画面に入っていてほしい範囲」（検証でカメラが覆っているか確かめる）
const EXTENT = [
  { x0: 10, x1: 100, y0: 60, y1: 150 }, { x0: 10, x1: 100, y0: 60, y1: 150 }, { x0: 10, x1: 100, y0: 60, y1: 150 },
  { x0: -12, x1: 118, y0: 60, y1: 225 },
  { x0: -92, x1: 182, y0: -42, y1: 225 },
  { x0: -300, x1: 365, y0: 60, y1: 225 },
  { x0: -260, x1: 350, y0: -210, y1: 225 },
  { x0: CR.x - CR.R, x1: CR.x + CR.R, y0: 60, y1: GY + CR.D }];
// 裏山（左半分・右半分。ぎざぎざの稜線）
const MT_L = [-260, 140, -190, 50, -130, -40, -85, -95, -40, -150, 10, -185, 45, -210, 45, 140];
const MT_R = [45, -210, 80, -170, 135, -110, 190, -40, 255, 40, 350, 140, 45, 140];
const STRATA = [[GY, '#86d06a'], [GY + 7, '#dcb47c'], [190, '#cb985e'], [255, '#bb8761'], [330, '#aa876c'], [400, '#c2a88e'], [470, '#98795f'], [560, '#806853'], [700, '#6e5a4c']];

// 乱数（シード付き。同じシードなら同じ壊れ方）
function mkRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// カメラが見ている世界の範囲（画面 W×H px に収める倍率 k = px/世界単位）
function viewFor(cam, W, H) {
  const k = Math.min(W / cam.w, H / cam.h), hw = W / (2 * k), hh = H / (2 * k);
  return { k, x0: cam.cx - hw, x1: cam.cx + hw, y0: cam.cy - hh, y1: cam.cy + hh };
}
// 見せ場の時刻 t のカメラ（段階が上がるたびに一段引く）
function camAt(S, t) {
  let a = BASE_CAM, b = BASE_CAM, u = 1;
  for (let k = 3; k <= S; k++) {
    if (t < CFG.camAt[k]) break;
    a = CAMS[k - 1]; b = CAMS[k]; u = smooth((t - CFG.camAt[k]) / CFG.camDur[k]);
  }
  const lg = (p, q) => Math.exp(lerp(Math.log(p), Math.log(q), u));
  return { cx: lerp(a.cx, b.cx, u), cy: lerp(a.cy, b.cy, u), w: lg(a.w, b.w), h: lg(a.h, b.h) };
}
// クレーターの進み具合（0〜1）
function craterAt(S, t) {
  if (S < 7) return 0;
  return smooth((t - CFG.craterT[0]) / (CFG.craterT[1] - CFG.craterT[0]));
}
// 地面の上端（クレーターで掘れた後。足場の柱だけ残る）
function craterTop(x, cp) {
  const u = (x - CR.x) / CR.R;
  let y = GY + (cp > 0 && Math.abs(u) < 1 ? cp * CR.D * Math.pow(1 - u * u, 0.75) : 0);
  if (x > PX - PW / 2 && x < PX + PW / 2) y = Math.min(y, BY);
  return y;
}
// 画面の揺れ（px）・光（0〜）
function shakeAt(sh, t, o) {
  let a = 0;
  for (const s of sh.shakes) if (t >= s.t && t < s.t + s.d) { const u = 1 - (t - s.t) / s.d; a += s.a * u * u; }
  o.x = Math.sin(t * 57) * a; o.y = Math.cos(t * 43) * a;
  return o;
}
function flashAt(sh, t) {
  let f = 0;
  for (const s of sh.flashes) if (t >= s.t) f += s.a * Math.exp(-(t - s.t) * 7);
  return f;
}
// 今出す大きな文字（出ていなければ -1）
function captionAt(sh, t) {
  let r = -1;
  for (let i = 0; i < sh.caps.length; i++) if (sh.caps[i].t <= t) r = i;
  return r;
}

// 空手家の動き：腕の目標・顔・落ちる高さ
function karaAt(sh, t) {
  const S = sh.stage, o = { dy: 0, dx: 0, tx: 61, ty: 65, face: 'serious' };
  if (S === 0) {            // 手を押さえて悶える
    const e = smooth((t - 0.12) / 0.25);
    o.tx = lerp(61, KX + 9, e); o.ty = lerp(65, 105, e); o.face = 'pain';
    if (t > 0.3) { o.dx = Math.sin(t * 48) * 0.7; o.dy = -Math.abs(Math.sin((t - 0.3) * 13)) * 1.8; }
  } else {                  // 拳が瓦を割り下ろし、そのあと正拳の姿勢のまま真顔
    const wv = S === 1 ? [3, 15, 0.35, 0.6] : [8, 60, 0.6, 0.75];
    const w = smooth((t - 0.05) / wv[2]), e = smooth((t - wv[3]) / 0.3);
    o.tx = lerp(61 + wv[0] * w, KX + 27, e); o.ty = lerp(65 + wv[1] * w, 104, e);
  }
  if (S >= 3 && t > FALL_T) {   // 床が抜けて、本人だけ下の階へ
    const tt = t - FALL_T, fall = BY - GY, tl = Math.sqrt(2 * fall / GRAV);
    o.dy = tt < tl ? 0.5 * GRAV * tt * tt : fall - 3 * Math.exp(-(tt - tl) * 7) * Math.abs(Math.sin((tt - tl) * 16));
  }
  return o;
}

// ---- 破片 ----
// 着地までの時間（床に届かないなら Infinity）
function landT(p) {
  if (!isFinite(p.fy)) return Infinity;
  const d = p.vy * p.vy - 2 * GRAV * (p.y - p.fy);
  if (d < 0) return Infinity;
  return Math.max(0, (-p.vy + Math.sqrt(d)) / GRAV);
}
// 時刻 t の破片の姿勢を o に書く（位置 x,y・角度 a・透明度 al・大きさ s）。式だけで決まるので早送りでも飛ばない
function poseAt(p, t, o) {
  o.x = p.x; o.y = p.y; o.a = 0; o.al = 1; o.s = 1;
  if (t >= p.tb) {
    const tt = t - p.tb;
    if (p.kind === 'puff') {
      const u = clamp(tt / p.life, 0, 1);
      o.s = lerp(p.r0, p.r1, 1 - (1 - u) * (1 - u)); o.al = (1 - u) * 0.85; o.y = p.y + p.vy * tt;
    } else if (p.kind === 'tilt') {       // 倒れる（軸のまわりに回る）
      const u = clamp(tt / p.dur, 0, 1), ang = p.ang * (p.out ? 1 - (1 - u) * (1 - u) : u * u);
      const c = Math.cos(ang), s = Math.sin(ang), dx = p.x - p.px, dy = p.y - p.py;
      o.x = p.px + dx * c - dy * s; o.y = p.py + dx * s + dy * c; o.a = ang;
    } else if (tt < p.tl) {                // 飛ぶ
      o.x = p.x + p.vx * tt; o.y = p.y + p.vy * tt + 0.5 * GRAV * tt * tt; o.a = p.w * tt;
    } else {                               // 着地（少し滑って、平らに落ち着く）
      const u = tt - p.tl, ar = p.w * p.tl, flat = Math.round(ar / Math.PI) * Math.PI;
      o.x = p.x + p.vx * p.tl + p.vx * 0.06 * (1 - Math.exp(-8 * u)); o.y = p.fy; o.a = lerp(ar, flat, 1 - Math.exp(-12 * u));
      if (t >= p.drop) { const dd = t - p.drop; o.y = Math.min(p.fy2, p.fy + 0.5 * GRAV * dd * dd); }
    }
  } else if (p.hid) o.al = 0;
  if (t > p.fade) o.al *= 1 - clamp((t - p.fade) / 0.2, 0, 1);
  return o;
}

// 段階 S までの見せ場を作る。S より上の物は壊れずに（tb = Infinity）そのまま置いてある
function buildShow(S, seed) {
  const R = mkRng(seed), RG = mkRng(CFG.seed + 99);   // R：飛び方（連打数で変わる） RG：形・切れ目（いつも同じ）
  const rr = (a, b) => a + (b - a) * R(), rg = (a, b) => a + (b - a) * RG();
  const sgn = () => (R() < 0.5 ? -1 : 1);
  const T = (st, t) => (S >= st ? t : Infinity);
  const P = [], cues = [], shakes = [], flashes = [];
  const cue = (t, s) => { if (isFinite(t)) cues.push({ t, s }); };
  const shake = (t, a, d) => { if (isFinite(t)) shakes.push({ t, a, d }); };
  const flash = (t, a) => { if (isFinite(t)) flashes.push({ t, a }); };

  function add(o) {
    const p = Object.assign({ g: '', idx: 0, x: 0, y: 0, poly: null, col: '#ccc', edge: null, lay: 3, kind: 'fly', tb: Infinity,
      vx: 0, vy: 0, w: 0, fy: Infinity, fy2: Infinity, drop: Infinity, fade: Infinity, hid: false, hh: 1, tl: Infinity,
      dec: null, ck: null, ckT: Infinity }, o);
    if (p.poly) { let m = 0; for (let i = 1; i < p.poly.length; i += 2) m = Math.max(m, Math.abs(p.poly[i])); p.hh = m; }
    P.push(p);
    return p;
  }
  const box = (w, h) => [-w / 2, -h / 2, w / 2, -h / 2, w / 2, h / 2, -w / 2, h / 2];
  const floorAt = (x, st) => (st <= 2 ? GY : st === 3 ? (x > HX0 && x < HX1 ? BY : GY) : (x > DL && x < DR ? BY : GY));
  // 着地する床を決める（飛んだ先の x で、抜けた床の下かどうか）
  function settle(p, st) {
    p.fy = GY - p.hh; let tl = landT(p);
    const f = floorAt(p.x + p.vx * (isFinite(tl) ? tl : 0), st);
    p.fy = f - p.hh; p.tl = landT(p);
    return p;
  }
  const puff = (x, y, r0, r1, tb, life, col) => add({ g: 'puff', kind: 'puff', x, y, r0, r1, tb, life, vy: -10, col, lay: 5, hid: true });

  // ---- 瓦（上から k 枚目。1 枚を 3 つに割る）。段階 1 は上の 5 枚、段階 2 で全部 ----
  for (let k = 0; k < CFG.tiles; k++) {
    const i = CFG.tiles - 1 - k, st = k < 5 ? 1 : 2, hy = TH / 2;
    const cy = TB - (i + 1) * TP + (TP - TH) + hy, x0 = TX - TW / 2;
    const xs = [x0, x0 + TW * rg(0.25, 0.4), x0 + TW * rg(0.6, 0.78), x0 + TW], sl = [0, rg(-0.9, 0.9), rg(-0.9, 0.9), 0];
    const tb = T(st, 0.05 + k * (S >= 2 ? 0.03 : 0.07));
    for (let j = 0; j < 3; j++) {
      const xa = xs[j], xb = xs[j + 1], cx = (xa + xb) / 2, side = j === 0 ? -1 : j === 2 ? 1 : sgn();
      const p = add({ g: 'tile', idx: k, x: cx, y: cy, poly: [xa - cx, -hy, xb - cx, -hy, xb + sl[j + 1] - cx, hy, xa + sl[j] - cx, hy],
        col: i % 2 ? '#667c92' : '#5b7188', edge: '#33414f', tb, vx: side * rr(16, 48), vy: -rr(50, 130), w: side * rr(2, 9) });
      settle(p, 2);
      if (S >= 3) { const xl = p.x + p.vx * p.tl; if (xl > HX0 && xl < HX1) { p.drop = DROP_T; p.fy2 = BY - p.hh; } }   // 床が抜けたら一緒に落ちる
      const w = xb - xa;   // ひび（割れずに残る瓦）
      if (j === 1 && ((S === 0 && k < 8) || (S === 1 && k >= 5 && k < 9))) {
        p.ck = [-w * 0.3, -hy, -w * 0.05, -hy * 0.1, w * 0.15, hy * 0.2, 0, hy];
        p.ckT = S === 0 ? 0.05 + k * 0.02 : 0.1 + (k - 5) * 0.04;
      }
    }
    if (isFinite(tb) && k % 3 === 0) cue(tb, 'tile');
  }
  if (S >= 1) { shake(0.05, 5, 0.45); cue(0.02, 'crack'); }
  if (S >= 1) for (let n = 0; n < 3; n++) puff(TX + rr(-10, 10), TB - 20 + n * 12, 5, 16, 0.1 + n * 0.18, 0.5, '#ffffff');
  if (S === 0) { shake(0.02, 3, 0.3); cue(0.02, 'crack'); cue(0.3, 'thud'); }

  // ---- 瓦の台（段階 3）----
  for (const bx of [TX - TW / 2 - 0.5, TX + TW / 2 - 6.5]) {
    const p = add({ g: 'stand', x: bx + 3.5, y: (TB + GY) / 2, poly: box(7, GY - TB), col: '#948a7e', edge: '#5e564c', tb: T(3, 0.97 + rr(0, 0.1)),
      vx: rr(-10, 10), vy: rr(-10, 10), w: rr(-1.5, 1.5) });
    p.fy = BY - p.hh; p.tl = landT(p);
  }
  // ---- 道場の床（段階 3 で瓦の下が抜ける。残りは段階 4 の崩壊で）----
  for (let x = DL; x < DR - 0.5;) {
    let w = rg(10, 16); if (DR - x - w < 6) w = DR - x;
    const cx = x + w / 2, hole = cx > HX0 && cx < HX1, st = hole ? 3 : 4;
    const p = add({ g: 'slab', x: cx, y: GY + 5, poly: box(w, 10), col: '#d9a85e', edge: '#7a5a2a', tb: hole ? T(3, 0.95 + rr(0, 0.25)) : T(4, 1.75 + rr(0, 0.3)),
      vx: (cx - KX) * 0.3 + rr(-10, 10), vy: hole ? rr(-20, 30) : -rr(10, 60), w: rr(-2, 2) });
    p.fy = BY - p.hh; p.tl = landT(p);
    x += w;
  }
  if (S >= 3) { shake(0.95, 8, 0.6); flash(0.95, 0.18); cue(0.95, 'floor'); cue(0.98, 'rumble'); cue(FALL_T + Math.sqrt(2 * (BY - GY) / GRAV), 'thud'); shake(FALL_T + 0.46, 7, 0.4);
    for (let n = 0; n < 4; n++) puff(rg(0, 100) + (n - 1.5) * 8, GY + 2, 8, 26, 1.0 + n * 0.1, 0.7, '#f5ead0'); }

  // ---- 道場の建物（段階 4）：屋根が吹き飛び、壁が崩れる ----
  const dtb = () => T(4, 1.85 + rr(0, 0.3));
  const dojoFly = (p, vx, vy, w) => { p.vx = vx; p.vy = vy; p.w = w; settle(p, 4); return p; };
  for (let c = 0; c < 6; c++) for (let r = 0; r < 2; r++) {     // 奥の壁
    const cw = (DR - DL) / 6, cx = DL + cw * (c + 0.5), cy = 8 + 33 + 66 * r;
    dojoFly(add({ g: 'dojo', idx: 0, x: cx, y: cy, poly: box(cw, 66), col: (c + r) % 2 ? '#efdfba' : '#ecdcb4', edge: '#d8c696', lay: 2, tb: dtb() }),
      (cx - KX) * 0.8 + rr(-20, 20), -rr(30, 150), rr(-2, 2));
  }
  for (const x of [-60, -26, 8, 42, 76, 110, 144]) {            // 柱
    dojoFly(add({ g: 'dojo', x, y: 74, poly: box(3.2, 132), col: '#8a5a2e', edge: '#6e4521', lay: 2, tb: dtb() }),
      (x - KX) * 0.4 + rr(-15, 15), -rr(10, 60), rr(-4, 4));
  }
  for (let n = 0; n < 4; n++) {                                  // 長押（はり）
    const bw = (DR - DL) / 4, cx = DL + bw * (n + 0.5);
    dojoFly(add({ g: 'dojo', x: cx, y: 45.2, poly: box(bw, 2.4), col: '#6e4521', lay: 2, tb: dtb() }), (cx - KX) * 0.5 + rr(-15, 15), -rr(10, 70), rr(-2, 2));
  }
  for (const sd of [-1, 1]) for (let n = 0; n < 3; n++) {        // 外の壁
    const cx = sd < 0 ? DL - 2.5 : DR + 2.5;
    dojoFly(add({ g: 'dojo', x: cx, y: 8 + 22 + 44 * n, poly: box(5, 44), col: '#b98a52', edge: '#6e4521', lay: 4, tb: dtb() }),
      sd * rr(40, 90), -rr(20, 100), sd * rr(1, 4));
  }
  const rx = []; for (let n = 0; n <= 8; n++) rx.push(-92 + (182 + 92) * n / 8);
  const rtop = x => (x <= -30 ? lerp(12, -42, (x + 92) / 62) : x >= 120 ? lerp(-42, 12, (x - 120) / 62) : -42);
  for (let n = 0; n < 8; n++) {                                  // 屋根（吹き飛ぶ）
    const a = rx[n], b = rx[n + 1], cx = (a + b) / 2, ymin = Math.min(rtop(a), rtop(b)), cy = (ymin + 12) / 2;
    dojoFly(add({ g: 'dojo', x: cx, y: cy, poly: [a - cx, rtop(a) - cy, b - cx, rtop(b) - cy, b - cx, 12 - cy, a - cx, 12 - cy],
      col: n % 2 ? '#c0573f' : '#b5503c', edge: '#8a3a2a', lay: 4, tb: T(4, 1.65 + rr(0, 0.12)) }),
      (cx - 45) * 0.9 + rr(-30, 30), -rr(200, 260), rr(-4, 4) + (cx < 45 ? -1 : 1));
  }
  if (S >= 4) { shake(1.7, 12, 0.8); flash(1.7, 0.25); cue(1.65, 'whoosh'); cue(1.8, 'collapse'); cue(1.9, 'rumble');
    for (let n = 0; n < 4; n++) puff(-60 + n * 70, GY - 8, 14, 46, 1.9 + n * 0.06, 0.8, '#f5ead0'); }

  // ---- 町内（段階 5）：電柱と家が、近い順に外へ倒れる ----
  const HOUSES = [
    { x0: -120, x1: -82, h: 46, o: 2, c: '#ffd7a8', r: '#d9604c' }, { x0: -178, x1: -138, h: 58, o: 6, c: '#cfe8ff', r: '#4c7fd9' },
    { x0: -245, x1: -198, h: 42, o: 8, c: '#ffe0e6', r: '#7a5cc0' }, { x0: 172, x1: 210, h: 50, o: 3, c: '#d9f2c4', r: '#d9904c' },
    { x0: 228, x1: 268, h: 42, o: 7, c: '#fff2a8', r: '#4cb0d9' }, { x0: 288, x1: 335, h: 56, o: 9, c: '#e6d4ff', r: '#d95c8a' }];
  const POLES = [{ x: -130, o: 0 }, { x: 220, o: 1 }, { x: -190, o: 4 }, { x: 280, o: 5 }];
  const toppleT = o => T(5, 2.25 + o * 0.055);
  for (const h of HOUSES) {
    const sd = h.x1 < 45 ? -1 : 1, w = h.x1 - h.x0, mid = (h.x0 + h.x1) / 2, tb = toppleT(h.o);
    const tilt = { kind: 'tilt', tb, px: sd < 0 ? h.x0 : h.x1, py: GY, ang: sd * 1.55, dur: 0.42, lay: 1 };
    add(Object.assign({ g: 'house', x: mid, y: GY - h.h / 2, poly: box(w, h.h), col: h.c, edge: '#b49470',
      dec: [[-w * 0.22, -h.h * 0.1, w * 0.26, h.h * 0.24, '#bfe6ff'], [w * 0.2, h.h * 0.12, w * 0.18, h.h * 0.38, '#a0703c']] }, tilt));
    add(Object.assign({ g: 'house', x: mid, y: GY - h.h - 6, poly: [-w / 2 - 4, 6, 0, -8, w / 2 + 4, 6], col: h.r, edge: '#8a3a2a' }, tilt));
    puff(tilt.px + sd * 22, GY - 6, 5, 22, isFinite(tb) ? tb + 0.38 : Infinity, 0.6, '#f5ead0');
    if (isFinite(tb)) { cue(tb + 0.4, 'topple'); shake(tb + 0.4, 5, 0.25); }
  }
  for (const pl of POLES) {
    const sd = pl.x < 45 ? -1 : 1, tb = toppleT(pl.o);
    add({ g: 'pole', kind: 'tilt', x: pl.x, y: GY - 36, poly: [-1.3, 36, -1.3, -30, -8, -30, -8, -33, 8, -33, 8, -30, 1.3, -30, 1.3, 36],
      col: '#7a5a3a', edge: '#4a3a24', lay: 1, tb, px: pl.x, py: GY, ang: sd * 1.5, dur: 0.5 });
  }
  if (S >= 5) { shake(2.3, 4, 0.9); cue(2.25, 'rumble'); }

  // ---- 裏山（段階 6）：真っ二つ ----
  const half = (pts, pvx, ang, col) => {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (let i = 0; i < pts.length; i += 2) { x0 = Math.min(x0, pts[i]); x1 = Math.max(x1, pts[i]); y0 = Math.min(y0, pts[i + 1]); y1 = Math.max(y1, pts[i + 1]); }
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, poly = [];
    for (let i = 0; i < pts.length; i += 2) poly.push(pts[i] - cx, pts[i + 1] - cy);
    add({ g: 'mountain', kind: 'tilt', x: cx, y: cy, poly, col, edge: '#6fa08a', lay: 0, tb: T(6, 2.8), px: pvx, py: GY, ang, dur: 0.55, out: true });
  };
  half(MT_L, -260, -0.17, '#8dc3a6'); half(MT_R, 350, 0.17, '#9ccfb0');
  for (let n = 0; n < 8; n++) {                                  // 割れ目から飛ぶ岩
    const s = rg(7, 15), sx = sgn();
    const p = add({ g: 'rock', x: 45 + rg(-25, 25), y: rg(-190, -120), poly: [-s, s * 0.6, 0, -s, s, s * 0.6], col: n % 2 ? '#8a9a8a' : '#9aaa9a', edge: '#6a7a6a', lay: 0, tb: T(6, 2.85 + rr(0, 0.2)),
      vx: sx * rr(20, 80), vy: -rr(60, 200), w: sx * rr(2, 8) });
    settle(p, 2);
  }
  for (let n = 0; n < 4; n++) puff(45 + (n - 1.5) * 40, GY - 20, 20, 60 + n * 6, T(6, 2.85 + n * 0.05), 0.9, '#e8f0e8');
  if (S >= 6) { shake(2.8, 14, 0.9); flash(2.8, 0.25); cue(2.8, 'mountain'); cue(3.0, 'crash'); }

  // ---- 地面（段階 7）：大きなクレーター。足場だけが細い柱で残る ----
  const t7 = CFG.craterT[0];
  for (let n = 0; n < 100; n++) {
    const s = rg(5, 14), tri = rg(0, 1) < 0.5, poly = tri ? [-s, s * 0.6, 0, -s, s, s * 0.6] : box(s, s * 0.8);
    const y0 = GY + rg(10, 200), x0 = CR.x + rg(-0.9, 0.9) * CR.R;
    const p = add({ g: 'dirt', x: x0, y: y0, poly, col: STRATA[1 + Math.floor(rg(0, STRATA.length - 1))][1], edge: null, lay: 5, hid: true, tb: T(7, t7 + rr(0, 0.15)), w: sgn() * rr(2, 10) });
    p.fy = GY - p.hh;
    const hA = rr(60, 260);
    p.vy = -Math.sqrt(2 * GRAV * (y0 - p.fy + hA));
    p.tl = landT(p);
    p.vx = (CR.x + sgn() * (CR.R + rr(15, 260)) - x0) / p.tl;   // 穴の外の地面に降る
  }
  for (let n = 0; n < 10; n++) puff(CR.x + (n - 4.5) * 40, GY - 4, 25, 70, T(7, t7 + n * 0.03), 1.0, '#ead9bc');
  if (S >= 7) { shake(t7, 22, 1.1); flash(t7, 0.75); cue(t7, 'crater'); cue(t7 + 0.05, 'rumble'); }
  // クレーターの中に落ちた物は、掘られる時に消える（足場の柱の上の物は残る）
  if (S >= 7) for (const p of P) {
    if (p.g === 'dirt' || p.g === 'puff' || p.g === 'mountain' || p.g === 'rock' || !isFinite(p.tb)) continue;
    const xr = p.kind === 'tilt' ? p.px : p.x + p.vx * (isFinite(p.tl) ? p.tl : 0), u = Math.abs(xr - CR.x) / CR.R;
    if (u < 0.96 && !(xr > PX - PW / 2 - 4 && xr < PX + PW / 2 + 4)) p.fade = t7 + 0.1 + (1 - u) * 0.3;
  }

  // ---- 大きな文字・音の合図 ----
  const caps = [];
  const k0 = S >= 2 ? 2 : S;
  for (let k = k0; k <= S; k++) caps.push({ t: CFG.showCaps[k][1], text: CFG.showCaps[k][0] });
  cues.sort((a, b) => a.t - b.t);
  return { stage: S, seed, dur: CFG.showSecs[S], pieces: P, cues, shakes, flashes, caps };
}
// ===== 描画（Canvas 2D。世界の座標は「遊ぶ場所の幅 = 100」。カメラで見せ場に合わせて引く）=====
const $ = id => document.getElementById(id);
const cv = $('cv'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let CAMV = viewFor(BASE_CAM, 390, 844);   // 今のカメラが見ている世界の範囲
let nowT = 0;
const IDLE = buildShow(0, CFG.seed);      // 連打の間の世界（壊れる前の姿）

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}

// 配置は 30-show.js（GY・KX・TX…）
const TIER_COL = ['#ffffff', '#fff2a8', '#ffd84a', '#ffa63a', '#ff6a2a', '#ff3d4a', '#e63cc8', '#7a5cff'];

// ---- 演出の状態 ----
const V = { kick: 0, bounce: 0, pulse: 0, aura: 12, flash: 0, slam: 0 };
const sparks = [], rings = [];
const SPARK_MAX = 90;

function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function mix(c1, c2, k) {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const a = p(c1), b = p(c2);
  return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',') + ')';
}

// 押した反応（見た目）
function onHit(e) {
  V.kick = Math.min(1.6, V.kick + 0.5);
  V.bounce = 1; V.pulse = 1;
  const n = e.tier >= 4 ? 3 : 2;
  for (let i = 0; i < n && sparks.length < SPARK_MAX; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, sp = 18 + Math.random() * 26 + e.tier * 3;
    sparks.push({ x: KX + 6 + (Math.random() - 0.5) * 6, y: 78 + Math.random() * 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 0.35 + Math.random() * 0.3, col: TIER_COL[e.tier], r: 0.9 + Math.random() * 0.9 });
  }
  if (e.tierUp) {
    rings.push({ life: 0, max: 0.6, col: TIER_COL[e.tier] });
    V.flash = Math.min(0.5, 0.12 + e.tier * 0.04);
  }
}
function onSlam() { V.slam = 1; V.flash = 0.6; V.kick = 3; }
function resetVisual() { V.kick = 0; V.bounce = 0; V.pulse = 0; V.aura = 12; V.flash = 0; V.slam = 0; sparks.length = 0; rings.length = 0; }

function updateVisual(dt) {
  V.kick *= Math.exp(-dt * 7);
  V.bounce *= Math.exp(-dt * 12);
  V.pulse *= Math.exp(-dt * 8);
  V.flash *= Math.exp(-dt * 6);
  V.slam *= Math.exp(-dt * 4);
  const target = Game.mode === 'title' ? 12 : (Game.mode === 'show' || Game.mode === 'over') ? 0 : 14 + Math.min(Game.count, CFG.topCount) / CFG.topCount * 38.5;
  V.aura += (target - V.aura) * (1 - Math.exp(-dt * 10));
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life += dt;
    if (s.life >= s.max) { sparks.splice(i, 1); continue; }
    s.vy += 60 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].life += dt; if (rings[i].life >= rings[i].max) rings.splice(i, 1); }
}

function twoBone(sx, sy, tx, ty, l1, l2) {
  const dx = tx - sx, dy = ty - sy, d0 = Math.hypot(dx, dy) || 0.01;
  const d = clamp(d0, Math.abs(l1 - l2) + 0.1, l1 + l2 - 0.05);
  const ux = dx / d0, uy = dy / d0;
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  return { ex: sx + ux * a + uy * h, ey: sy + uy * a - ux * h, hx: sx + ux * d, hy: sy + uy * d };
}

// ---- 空・雲・裏山の芯・住人 ----
const CLOUDS = [[-200, -110, 1], [110, -95, 1.3], [300, -150, 0.9], [-60, -190, 1.1], [-330, -40, 1.2], [420, -60, 1]];
const RESIDENTS = [[-290, '#ff8a5c'], [-275, '#5c9cff'], [350, '#f2c94c'], [365, '#7bd389']];

function drawSky(v) {
  const c = cx;
  const g = c.createLinearGradient(0, v.y0, 0, GY);
  g.addColorStop(0, '#86cdf0'); g.addColorStop(1, '#eaf8ff');
  c.fillStyle = g; c.fillRect(v.x0 - 5, v.y0 - 5, v.x1 - v.x0 + 10, GY - v.y0 + 6);
  c.fillStyle = '#e6d3b2'; c.fillRect(v.x0 - 5, GY - 1, v.x1 - v.x0 + 10, v.y1 - GY + 6);   // 穴の向こう側（クレーターの奥の壁）
  c.fillStyle = '#ffffffcc';
  for (const [x, y, s] of CLOUDS) {
    c.beginPath();
    c.ellipse(x, y, 34 * s, 9 * s, 0, 0, 6.283); c.ellipse(x - 20 * s, y + 3 * s, 20 * s, 7 * s, 0, 0, 6.283); c.ellipse(x + 22 * s, y + 2 * s, 24 * s, 8 * s, 0, 0, 6.283);
    c.fill();
  }
  // 裏山の芯（山が割れた隙間から見える暗い部分）
  c.fillStyle = '#5f957f';
  c.beginPath(); c.moveTo(MT_L[0], MT_L[1]);
  for (let i = 2; i < MT_L.length - 2; i += 2) c.lineTo(MT_L[i], MT_L[i + 1]);
  for (let i = 2; i < MT_R.length - 2; i += 2) c.lineTo(MT_R[i], MT_R[i + 1]);
  c.closePath(); c.fill();
}

// 遠くから見ている住人（避難済み。けがはしない。万歳して小さく跳ねている）
function drawResidents(t) {
  const c = cx;
  c.lineCap = 'round';
  for (let i = 0; i < RESIDENTS.length; i++) {
    const x = RESIDENTS[i][0], hop = Math.abs(Math.sin(t * 6 + i * 1.7)) * 1.5;
    c.strokeStyle = RESIDENTS[i][1]; c.lineWidth = 3.2;
    c.beginPath(); c.moveTo(x, GY - 6 - hop); c.lineTo(x, GY - 14 - hop); c.stroke();
    c.lineWidth = 1.4; c.beginPath(); c.moveTo(x - 4, GY - 16 - hop); c.lineTo(x, GY - 12 - hop); c.lineTo(x + 4, GY - 16 - hop); c.stroke();
    c.beginPath(); c.moveTo(x - 1.5, GY - hop); c.lineTo(x, GY - 6 - hop); c.lineTo(x + 1.5, GY - hop); c.stroke();
    c.fillStyle = '#f6cfa6'; c.beginPath(); c.arc(x, GY - 17.5 - hop, 2.4, 0, 6.283); c.fill();
  }
}

// 地面の断面：地層の帯、道場の下の階、クレーター（足場の柱だけ残る）
function drawGround(v, cp) {
  const c = cx, xL = v.x0 - 30, xR = v.x1 + 30, yB = v.y1 + 40;
  const xs = [xL, xR];
  if (cp > 0) {
    for (let x = CR.x - CR.R - 6; x <= CR.x + CR.R + 6; x += 6) xs.push(x);
    for (const e of [PX - PW / 2, PX + PW / 2]) xs.push(e - 0.001, e + 0.001);
  }
  xs.sort((a, b) => a - b);
  c.save(); c.beginPath();
  let first = true;
  for (const x of xs) {
    if (x < xL || x > xR) continue;
    const y = craterTop(x, cp);
    if (first) { c.moveTo(x, y); first = false; } else c.lineTo(x, y);
  }
  c.lineTo(xR, yB); c.lineTo(xL, yB); c.closePath(); c.clip();
  for (let i = 0; i < STRATA.length; i++) {
    const y0 = STRATA[i][0], y1 = i + 1 < STRATA.length ? STRATA[i + 1][0] : yB;
    c.fillStyle = STRATA[i][1]; c.fillRect(xL, y0, xR - xL, Math.max(y1, y0 + 1) - y0 + 0.5);
  }
  // 下の階（道場の真下の部屋）
  c.fillStyle = '#a98d68'; c.fillRect(DL, GY, DR - DL, BY - GY);
  c.fillStyle = '#8f7452';
  for (let x = DL + 17; x < DR; x += 34) c.fillRect(x - 1, GY, 2, BY - GY);
  c.fillRect(DL, 176, DR - DL, 1.6);
  c.fillStyle = '#d3a35a'; c.fillRect(DL, BY, DR - DL, 9);
  c.fillStyle = '#8f6a30'; c.fillRect(DL, BY, DR - DL, 1.2);
  c.restore();
}

// 破片・建物・山など（lay：奥から手前）。時刻 tp の姿勢は 30-show.js の poseAt
const po = { x: 0, y: 0, a: 0, al: 1, s: 1 };
function drawPieces(sh, lay, tp, jit) {
  const c = cx, amp = 0.35 + Math.min(Game.count, CFG.topCount) / CFG.topCount * 0.84;
  for (const p of sh.pieces) {
    if (p.lay !== lay) continue;
    if (p.hid && tp < p.tb) continue;
    poseAt(p, tp, po);
    if (po.al <= 0.01) continue;
    if (jit && p.g === 'tile') {   // 連打の間の瓦の震え
      const i = CFG.tiles - 1 - p.idx, j = Math.sin(nowT * 65 + i * 2.31), j2 = Math.sin(nowT * 83 + i * 1.7);
      po.x += j * amp * V.kick * (0.4 + i * 0.05) + j * V.slam * 1.2; po.y += j2 * amp * V.kick * 0.25;
    }
    c.save(); c.translate(po.x, po.y);
    if (po.al < 1) c.globalAlpha = po.al;
    if (p.kind === 'puff') {
      c.fillStyle = p.col; c.beginPath(); c.arc(0, 0, po.s, 0, 6.283); c.fill();
    } else {
      if (po.a) c.rotate(po.a);
      const q = p.poly;
      c.beginPath(); c.moveTo(q[0], q[1]);
      for (let i = 2; i < q.length; i += 2) c.lineTo(q[i], q[i + 1]);
      c.closePath(); c.fillStyle = p.col; c.fill();
      if (p.edge) { c.strokeStyle = p.edge; c.lineWidth = 0.35; c.stroke(); }
      if (p.dec) for (const d of p.dec) { c.fillStyle = d[4]; c.fillRect(d[0], d[1], d[2], d[3]); }
      if (p.ck && tp >= p.ckT && tp < p.tb) {   // ひび
        c.strokeStyle = '#141a22'; c.lineWidth = 0.4; c.beginPath(); c.moveTo(p.ck[0], p.ck[1]);
        for (let i = 2; i < p.ck.length; i += 2) c.lineTo(p.ck[i], p.ck[i + 1]);
        c.stroke();
      }
    }
    c.restore();
  }
}

function drawAura() {
  const c = cx, t = Game.tier(), col = TIER_COL[t];
  if (Game.mode === 'title' || Game.mode === 'ready' || V.aura < 1.5) return;
  const ax = KX + 2, ay = 108, R = V.aura * (1 + V.pulse * 0.12);
  c.save(); c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(ax, ay, 0, ax, ay, R);
  g.addColorStop(0, col + 'cc'); g.addColorStop(0.5, col + '55'); g.addColorStop(1, col + '00');
  c.fillStyle = g; c.beginPath(); c.arc(ax, ay, R, 0, 6.283); c.fill();
  if (t >= 1) {   // 段階と同じ区切りで一段派手に：光の筋
    const n = 6 + t * 2, rot = nowT * (0.6 + t * 0.25);
    c.fillStyle = col + '40';
    for (let i = 0; i < n; i++) {
      const a = rot + i * 6.283 / n, w = 0.11, rl = R * (1.15 + 0.1 * Math.sin(nowT * 9 + i));
      c.beginPath(); c.moveTo(ax + Math.cos(a - w) * R * 0.55, ay + Math.sin(a - w) * R * 0.55);
      c.lineTo(ax + Math.cos(a) * rl, ay + Math.sin(a) * rl);
      c.lineTo(ax + Math.cos(a + w) * R * 0.55, ay + Math.sin(a + w) * R * 0.55); c.fill();
    }
  }
  for (const r of rings) {
    const p = r.life / r.max;
    c.strokeStyle = r.col; c.globalAlpha = 1 - p; c.lineWidth = 1.6 * (1 - p) + 0.3;
    c.beginPath(); c.arc(ax, ay, R * (0.7 + p * 1.1), 0, 6.283); c.stroke();
  }
  c.restore();
}

// 空手家の今の姿勢（腕の目標と顔）。連打〜せいっは Phase 1 のまま、見せ場は 30-show.js の karaAt
function karaView() {
  const m = Game.mode, sh = Game.show;
  if ((m === 'show' || m === 'over') && sh) {
    const t = m === 'show' ? Game.showT : sh.dur, k = karaAt(sh, t);
    return { dx: k.dx, dy: k.dy, tx: k.tx, ty: k.ty, face: k.face, t, by: 0, pain: sh.stage === 0 };
  }
  let tx = KX + 11, ty = 76 + (m === 'play' ? -V.bounce * 1.5 : 0);
  if (m === 'title') { tx = KX + 11; ty = 98; }
  if (m === 'ready') { tx = KX + 12; ty = 84; }
  if (m === 'finish') {
    const e = Math.pow(clamp(Game.finT / 0.12, 0, 1), 2);
    tx = lerp(KX + 11, 61, e); ty = lerp(76, TB - CFG.tiles * TP - 3, e);
  }
  const by = V.bounce * 1.2 + (m === 'play' ? Math.sin(nowT * 30) * 0.15 * Math.min(1, Game.count / 20) : 0);
  return { dx: 0, dy: 0, tx, ty, face: m === 'play' || m === 'finish' ? 'shout' : 'calm', t: nowT, by, pain: false };
}

function drawKarateka() {
  const c = cx, K = karaView();
  const skin = mix('#f6cfa6', '#ff7a5a', clamp(Game.count / CFG.topCount, 0, 1));
  c.save(); c.translate(K.dx, K.dy + K.by);
  // 影
  c.save(); c.translate(0, -K.by); c.fillStyle = '#0003'; c.beginPath(); c.ellipse(KX + 1, GY + 1.5, 15, 2.6, 0, 0, 6.283); c.fill(); c.restore();
  c.lineCap = 'round'; c.lineJoin = 'round';
  const white = '#fbfbf6', edge = '#a9a392';
  // 脚（馬立ち）
  c.strokeStyle = edge; c.lineWidth = 8.4; c.beginPath(); c.moveTo(KX - 3, 122); c.lineTo(KX - 10, GY - 1); c.moveTo(KX + 5, 122); c.lineTo(KX + 12, GY - 1); c.stroke();
  c.strokeStyle = white; c.lineWidth = 7; c.beginPath(); c.moveTo(KX - 3, 122); c.lineTo(KX - 10, GY - 1); c.moveTo(KX + 5, 122); c.lineTo(KX + 12, GY - 1); c.stroke();
  c.fillStyle = skin; c.beginPath(); c.ellipse(KX - 11, GY - 0.3, 4, 1.6, 0, 0, 6.283); c.ellipse(KX + 13, GY - 0.3, 4, 1.6, 0, 0, 6.283); c.fill();
  // 後ろの腕（ふだんは腰に。痛いときは手首を押さえる）
  if (K.pain) {
    const bk = twoBone(KX - 5, 105, K.tx - 1, K.ty + 2, 20, 20);
    c.strokeStyle = edge; c.lineWidth = 6.6; c.beginPath(); c.moveTo(KX - 5, 105); c.lineTo(bk.ex, bk.ey); c.lineTo(bk.hx, bk.hy); c.stroke();
    c.strokeStyle = white; c.lineWidth = 5.4; c.beginPath(); c.moveTo(KX - 5, 105); c.lineTo(bk.ex, bk.ey); c.lineTo(bk.hx, bk.hy); c.stroke();
  } else {
    c.strokeStyle = edge; c.lineWidth = 6.6; c.beginPath(); c.moveTo(KX - 5, 105); c.lineTo(KX - 11, 114); c.lineTo(KX - 5, 118); c.stroke();
    c.strokeStyle = white; c.lineWidth = 5.4; c.beginPath(); c.moveTo(KX - 5, 105); c.lineTo(KX - 11, 114); c.lineTo(KX - 5, 118); c.stroke();
  }
  // 胴
  c.fillStyle = white; c.strokeStyle = edge; c.lineWidth = 0.7;
  rr(c, KX - 8, 99, 17, 25, 4.5); c.fill(); c.stroke();
  c.strokeStyle = edge; c.lineWidth = 0.6; c.beginPath(); c.moveTo(KX - 1, 99); c.lineTo(KX + 4, 110); c.lineTo(KX + 7, 99); c.stroke();   // 襟
  c.fillStyle = '#26262e'; c.fillRect(KX - 8.3, 118.5, 17.6, 3.2);   // 黒帯
  // 頭
  const hx = KX + 1.5, hy = 91;
  c.fillStyle = skin; c.strokeStyle = '#b98a62'; c.lineWidth = 0.6;
  c.beginPath(); c.arc(hx, hy, 7, 0, 6.283); c.fill(); c.stroke();
  c.fillStyle = '#26262e'; c.beginPath(); c.arc(hx - 0.6, hy - 1.2, 7.3, Math.PI * 1.02, Math.PI * 2.0); c.fill();
  c.fillStyle = '#fff'; c.fillRect(hx - 7.2, hy - 2.6, 14.4, 2.2);   // はちまき
  c.fillStyle = '#d2382f'; c.beginPath(); c.arc(hx, hy - 1.5, 1.1, 0, 6.283); c.fill();
  c.fillStyle = '#26262e'; c.strokeStyle = '#26262e';
  if (K.face === 'pain') {            // >_< と汗
    c.lineWidth = 0.8; c.beginPath(); c.moveTo(hx + 2, hy - 0.5); c.lineTo(hx + 4, hy + 1); c.lineTo(hx + 2, hy + 2.4); c.stroke();
    c.beginPath(); c.moveTo(hx + 1.6, hy - 1.6); c.lineTo(hx + 5, hy - 0.6); c.stroke();
    c.strokeStyle = '#7a1f1a'; c.beginPath(); c.moveTo(hx + 1.6, hy + 4.6); c.lineTo(hx + 2.6, hy + 3.8); c.lineTo(hx + 3.6, hy + 4.6); c.lineTo(hx + 4.6, hy + 3.8); c.stroke();
    c.fillStyle = '#7ec8ff';
    for (let i = 0; i < 3; i++) { const u = (K.t * 2.2 + i / 3) % 1; c.globalAlpha = 1 - u; c.beginPath(); c.ellipse(hx + 8 + i * 2 + u * 5, hy - 6 - u * 7, 0.9, 1.4, 0, 0, 6.283); c.fill(); }
    c.globalAlpha = 1;
  } else if (K.face === 'serious') {  // 真顔：まっすぐな眉、点の目、一文字の口
    c.beginPath(); c.ellipse(hx + 3.2, hy + 1.2, 0.8, 0.8, 0, 0, 6.283); c.fill();
    c.lineWidth = 0.8; c.beginPath(); c.moveTo(hx + 1.8, hy - 0.5); c.lineTo(hx + 5, hy - 0.5); c.stroke();
    c.strokeStyle = '#7a1f1a'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(hx + 1.8, hy + 4.3); c.lineTo(hx + 4.6, hy + 4.3); c.stroke();
  } else {
    const shout = K.face === 'shout';
    c.beginPath(); c.ellipse(hx + 3.2, hy + 1.2, 0.9, shout ? 0.6 : 1, 0, 0, 6.283); c.fill();   // 目
    c.lineWidth = 0.8; c.beginPath(); c.moveTo(hx + 1.8, hy - 0.6); c.lineTo(hx + 5, hy + 0.2); c.stroke();   // まゆ
    if (shout) { c.fillStyle = '#7a1f1a'; c.beginPath(); c.ellipse(hx + 3.2, hy + 4.4, 1.7, 1.2 + Math.min(1, V.pulse) * 0.9, 0, 0, 6.283); c.fill(); }
    else { c.strokeStyle = '#7a1f1a'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(hx + 1.8, hy + 4.3); c.lineTo(hx + 4.6, hy + 4.3); c.stroke(); }
  }
  // 前の腕（二関節）
  const sx = KX + 3, sy = 104;
  const arm = twoBone(sx, sy, K.tx, K.ty, 22, 22);
  c.strokeStyle = edge; c.lineWidth = 6.6; c.beginPath(); c.moveTo(sx, sy); c.lineTo(arm.ex, arm.ey); c.lineTo(arm.hx, arm.hy); c.stroke();
  c.strokeStyle = white; c.lineWidth = 5.4; c.beginPath(); c.moveTo(sx, sy); c.lineTo(arm.ex, arm.ey); c.lineTo(arm.hx, arm.hy); c.stroke();
  c.fillStyle = skin; c.strokeStyle = '#b98a62'; c.lineWidth = 0.5;
  c.beginPath(); c.arc(arm.hx, arm.hy, 3.4, 0, 6.283); c.fill(); c.stroke();
  c.restore();
}

function drawSparks() {
  const c = cx;
  for (const s of sparks) {
    const p = s.life / s.max;
    c.globalAlpha = 1 - p; c.fillStyle = s.col;
    c.beginPath(); c.arc(s.x, s.y, s.r * (1 - p * 0.5), 0, 6.283); c.fill();
  }
  c.globalAlpha = 1;
}

function render() {
  const c = cx, m = Game.mode, sh = Game.show || IDLE;
  const inShow = !!Game.show && (m === 'show' || m === 'over');
  const ts = inShow ? (m === 'show' ? Game.showT : sh.dur) : 0;                                   // カメラ・演出の時刻
  const tp = inShow ? (m === 'show' ? Game.showT : sh.dur + Math.min(Game.overT, 3)) : 0;          // 破片の時刻（結果のあとも着地まで進む）
  const cam = inShow ? camAt(sh.stage, ts) : BASE_CAM, shk = inShow ? shakeAt(sh, ts, { x: 0, y: 0 }) : { x: 0, y: 0 };
  const v = CAMV = viewFor(cam, W, H);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  c.setTransform(DPR * v.k, 0, 0, DPR * v.k, DPR * (W / 2 - cam.cx * v.k + shk.x), DPR * (H / 2 - cam.cy * v.k + shk.y));
  const jit = !inShow;
  drawSky(v);
  drawPieces(sh, 0, tp, jit);       // 裏山
  drawResidents(nowT);
  drawPieces(sh, 1, tp, jit);       // 家・電柱
  drawPieces(sh, 2, tp, jit);       // 道場の奥の壁・柱
  drawGround(v, craterAt(sh.stage, ts));
  drawAura();
  drawKarateka();
  drawPieces(sh, 3, tp, jit);       // 瓦・台・床
  drawPieces(sh, 4, tp, jit);       // 屋根・外の壁
  drawPieces(sh, 5, tp, jit);       // 砂ぼこり・土
  drawSparks();
  const f = Math.min(0.85, V.flash + (inShow ? flashAt(sh, ts) : 0));
  if (f > 0.01) { c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = 'rgba(255,255,255,' + f + ')'; c.fillRect(0, 0, cv.width, cv.height); }
}
// ===== 効果音（WebAudio で合成。音声ファイルなし・BGMなし。太鼓の連打が音楽の代わり）=====
const Snd = (() => {
  let ac = null, master = null, noiseBuf = null, bus = null;   // bus：見せ場の音の出口（早送りで一気に止められる）
  const recent = [];   // 直近に鳴らした太鼓の時刻（重なりすぎの間引きに使う）

  function init() {
    if (!ac) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        const comp = ac.createDynamicsCompressor();   // 重なっても割れないように
        comp.threshold.value = -16; comp.ratio.value = 8;
        master = ac.createGain(); master.gain.value = 0.55;   // 全体の音量の上限
        master.connect(comp); comp.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (_) { ac = null; return; }
    }
    if (ac.state === 'suspended') ac.resume();
  }
  const now = () => ac.currentTime;
  const dest = () => bus || master;

  function tone(f, t0, dur, o) {
    if (!ac) return;
    o = o || {};
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
    const a = o.attack || 0.004, v = o.gain == null ? 0.3 : o.gain;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(dest());
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function noise(t0, dur, o) {
    if (!ac) return;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = o.type || 'bandpass';
    fl.frequency.setValueAtTime(o.f, t0); fl.Q.value = o.q || 1;
    if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(Math.max(0.0001, o.gain == null ? 0.3 : o.gain), t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl); fl.connect(g); g.connect(dest());
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  }

  return {
    init,
    // 太鼓：連打が増えるほど高く、強く
    taiko(count) {
      if (!ac) return; const t = now();
      while (recent.length && t - recent[0] > 0.1) recent.shift();
      if (recent.length >= 4) return;   // 重なりすぎたら間引く
      recent.push(t);
      const k = Math.min(count, CFG.topCount) / CFG.topCount;
      const f = 78 + k * 150, v = 0.2 + k * 0.22;
      tone(f * 1.7, t, 0.13, { gain: v, f2: f });
      tone(f * 0.5, t, 0.2, { gain: v * 0.6, f2: f * 0.42 });
      noise(t, 0.04, { f: 1500 + k * 900, q: 0.9, gain: 0.08 + k * 0.08 });
    },
    // 段階の区切りごとのご褒美の音
    tier(tier) {
      if (!ac) return; const t = now();
      const f = 440 * Math.pow(2, Math.min(tier, 7) * 2 / 12);
      tone(f, t, 0.18, { type: 'triangle', gain: 0.1 });
      tone(f * 1.5, t + 0.05, 0.18, { type: 'triangle', gain: 0.08 });
    },
    // 「はじめ」の気合
    hajime() {
      if (!ac) return; const t = now();
      tone(220, t, 0.22, { type: 'sawtooth', gain: 0.1, f2: 160 });
      noise(t, 0.16, { f: 900, q: 1.1, gain: 0.12 });
    },
    // 「せいっ」：振り下ろして一撃
    sei() {
      if (!ac) return; const t = now();
      tone(330, t, 0.2, { type: 'sawtooth', gain: 0.12, f2: 200 });
      tone(120, t + 0.08, 0.35, { gain: 0.5, f2: 45 });
      noise(t + 0.08, 0.25, { f: 2500, f2: 600, q: 0.7, gain: 0.35 });
    },

    // ---- Phase 2：破壊の見せ場（音量は小さめ。全体の上限とコンプレッサーを通る）----
    showBegin() {
      if (!ac) return;
      bus = ac.createGain(); bus.gain.value = 1; bus.connect(master);
    },
    showEnd(cut) {   // cut：早送り。残っている音をすぐ止める
      if (!ac || !bus) return;
      if (cut) { bus.gain.setTargetAtTime(0, now(), 0.025); }
      bus = null;
    },
    cue(name) {
      if (!ac) return; const t = now();
      if (name === 'crack') {            // 瓦にひび：ピシッ
        noise(t, 0.05, { type: 'highpass', f: 3500, q: 0.7, gain: 0.22 });
        tone(1800, t, 0.06, { type: 'square', gain: 0.05, f2: 700 });
      } else if (name === 'tile') {      // 瓦が割れる：パリパリッ
        noise(t, 0.14, { f: 3200, f2: 1400, q: 0.8, gain: 0.2 });
        tone(980 + Math.random() * 300, t, 0.09, { type: 'triangle', gain: 0.09, f2: 420 });
        noise(t + 0.05, 0.1, { type: 'highpass', f: 4500, q: 0.7, gain: 0.12 });
      } else if (name === 'thud') {      // ドスッ
        tone(95, t, 0.28, { gain: 0.4, f2: 38 });
        noise(t, 0.14, { type: 'lowpass', f: 400, q: 0.7, gain: 0.25 });
      } else if (name === 'floor') {     // 床が割れる：バキバキッ
        noise(t, 0.4, { f: 1200, f2: 300, q: 0.8, gain: 0.28 });
        tone(140, t, 0.3, { type: 'sawtooth', gain: 0.1, f2: 60 });
        noise(t + 0.08, 0.2, { type: 'highpass', f: 2500, q: 0.7, gain: 0.14 });
      } else if (name === 'whoosh') {    // 屋根が飛ぶ：ヒュオーッ
        noise(t, 0.55, { f: 400, f2: 2800, q: 1.2, gain: 0.22 });
      } else if (name === 'collapse') {  // 崩れる：ガラガラ
        noise(t, 0.8, { type: 'lowpass', f: 1400, f2: 180, q: 0.8, gain: 0.34 });
        noise(t + 0.15, 0.5, { f: 700, f2: 250, q: 0.9, gain: 0.18 });
        tone(80, t, 0.5, { gain: 0.3, f2: 36 });
      } else if (name === 'topple') {    // 倒れる：ズシン
        tone(70, t, 0.3, { gain: 0.28, f2: 32 });
        noise(t, 0.2, { type: 'lowpass', f: 600, q: 0.7, gain: 0.18 });
      } else if (name === 'rumble') {    // 地響き
        tone(46, t, 0.9, { gain: 0.3, f2: 30, attack: 0.08 });
        noise(t, 0.9, { type: 'lowpass', f: 140, q: 0.7, gain: 0.26 });
      } else if (name === 'mountain') {  // 山が割れる：ゴゴゴッ
        tone(55, t, 1.0, { gain: 0.4, f2: 28, attack: 0.1 });
        noise(t, 1.0, { type: 'lowpass', f: 300, f2: 90, q: 0.8, gain: 0.34 });
        noise(t + 0.1, 0.3, { f: 2000, f2: 500, q: 0.8, gain: 0.16 });
      } else if (name === 'crash') {
        noise(t, 0.5, { f: 1800, f2: 300, q: 0.7, gain: 0.26 });
        tone(110, t, 0.4, { gain: 0.3, f2: 40 });
      } else if (name === 'crater') {    // どーん
        tone(72, t, 1.1, { gain: 0.5, f2: 26, attack: 0.01 });
        noise(t, 1.2, { type: 'lowpass', f: 1000, f2: 70, q: 0.7, gain: 0.4 });
        noise(t, 0.3, { f: 2500, f2: 400, q: 0.7, gain: 0.2 });
      }
    },
  };
})();
// ===== 操作・ループ・結果 =====
let shownResult = false, last = 0, cueI = 0, capKey = '';

function setCall(text) {
  const el = $('call');
  el.textContent = text;
  el.classList.remove('on');
  void el.offsetWidth;   // アニメーションを最初から
  el.classList.add('on');
 
}

// 画面どこでもタップ／スペース・Enter。タイトルで開始、結果で再挑戦、連打中は 1 回
function press() {
  Snd.init();
  if (Game.mode === 'title') { Game.begin(); return; }
  if (Game.mode === 'show') { Game.skip(); return; }   // 見せ場はタップで早送り
  if (Game.mode === 'over') { if (Game.canRetry()) retry(); return; }
  Game.tap();
}

// 段階ごとの大きな文字（言葉の途中では改行しない：「、」の後ろで区切る）
function setCap(text) {
  const el = $('cap'), parts = text.split(/(?<=、)/);
  el.innerHTML = parts.map(p => '<span class="nb">' + p + '</span>').join('');
  el.style.fontSize = Math.min(17, 86 / text.length) + 'cqw';
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}
function hideCap() { $('cap').classList.remove('on'); }

function bindUI() {
  cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });   // マルチタッチは指ごとに 1 回
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (!acceptKey(e)) { if (e.key === ' ' || e.key === 'Enter') e.preventDefault(); return; }
    e.preventDefault();
    press();
  });
  // ダブルタップ拡大・ピンチを止める（iOS）
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 350) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  window.addEventListener('resize', resize);
}

function retry() {
  Game.reset();
  shownResult = false;
  resetVisual();
  $('result').classList.remove('show', 'ready');
  $('call').classList.remove('on'); hideCap(); capKey = '';
  Game.begin();   // 再挑戦はそのまま「はじめ」から
}

// 結果（仮）。段階の名前と連打数
function showResult() {
  shownResult = true;
  $('call').classList.remove('on');
  const names = CFG.stageNames[Game.stage()].split(' ');
  $('rStage').innerHTML = names.map(n => '<span class="nb">' + n + '</span>').join(' ');
  $('rCnt').textContent = Game.count;
  $('result').classList.add('show');
  $('result').classList.remove('ready');
}

// ゲームの出来事を、見た目と音の反応にする
function reactToEvents() {
  for (const e of Game.events) {
    if (e.type === 'ready') {
      $('title').classList.add('hide');
      setCall('はじめ'); Snd.hajime();
    } else if (e.type === 'start') {
      $('call').classList.remove('on');
    } else if (e.type === 'hit') {
      Snd.taiko(e.count);
      if (e.tierUp) Snd.tier(e.tier);
      onHit(e);
    } else if (e.type === 'end') {
      setCall('せいっ'); Snd.sei();
    } else if (e.type === 'show') {      // 瓦に届いた：見せ場の始まり
      $('call').classList.remove('on'); cueI = 0; capKey = '';
      Snd.showBegin(); onSlam();
    } else if (e.type === 'over') {
      Snd.showEnd(!!e.skipped); hideCap();
    }
  }
  Game.events.length = 0;
}

// 見せ場の音の合図と大きな文字
function playShow() {
  const sh = Game.show;
  if (Game.mode !== 'show' || !sh) return;
  while (cueI < sh.cues.length && sh.cues[cueI].t <= Game.showT) Snd.cue(sh.cues[cueI++].s);
  const i = captionAt(sh, Game.showT), key = i < 0 ? '' : sh.caps[i].text;
  if (key !== capKey) { capKey = key; if (key) setCap(key); }
}

function updateHud() {
  const m = Game.mode, playing = m === 'play', show = m === 'ready' || playing || m === 'finish';
  const rem = m === 'ready' ? CFG.duration : Game.remaining();
  $('tLeft').textContent = rem.toFixed(1);
  $('hudTop').classList.toggle('on', show);
  $('hudTop').classList.toggle('low', playing && rem <= 1.5);
  $('hudBot').classList.toggle('on', show);
  $('cNum').textContent = Game.count;
}

function frame(ts) {
  const dt = last ? Math.min((ts - last) / 1000, 0.1) : 0;
  last = ts; nowT += dt;
  Game.step(dt);
  reactToEvents();
  playShow();
  if (Game.mode === 'over' && !shownResult) showResult();
  if (shownResult && Game.canRetry()) $('result').classList.add('ready');
  updateHud();
  updateVisual(dt);
  render();
  requestAnimationFrame(frame);
}
Game.reset();
resize();
bindUI();
requestAnimationFrame(frame);
</script>
